                                                    {rows.map((g) => {
                                                        const key = `email:${s.row}:${g.address}`;
                                                        const copied = copiedKey === key;
                                                        const copyLabel = copied
                                                            ? (s.dir === 'ltr' ? 'Email address copied' : 'הכתובת הועתקה')
                                                            : (s.dir === 'ltr' ? `Copy ${g.address}` : `העתקת ${g.address}`);
                                                        const sendLabel = s.dir === 'ltr' ? `Email ${g.address}` : `שליחת דוא״ל אל ${g.address}`;
                                                        return (
                                                            <div key={`${s.row}_mail_${g.address}`} className="mh-pick-option" role="option">
                                                                <span className="mh-pick-text">
                                                                    <span className="mh-pick-title">{g.labels.join(', ')}</span>
                                                                    <span className="mh-pick-detail" dir="ltr">{g.address}</span>
                                                                </span>
                                                                <span className="mh-pick-actions">
                                                                    <a className="mh-pick-mail" href={`mailto:${g.address}`} aria-label={sendLabel} title={sendLabel} data-tracking-name={`${s.trackingName || s.org}_email_site`} data-analytics-type="email">
                                                                        <i className="fas fa-envelope" aria-hidden="true"></i>
                                                                    </a>
                                                                    <button type="button" className="mh-pick-copy" aria-label={copyLabel} title={copyLabel} onClick={() => copyText(g.address, { onSuccess: () => markCopied(key), fallbackPrompt: s.dir === 'ltr' ? 'Copy this email address:' : 'העתיקו את כתובת הדוא״ל:' })} data-tracking-name={`${s.trackingName || s.org}_email_copy`} data-analytics-type="email">
                                                                        <i className={`fas ${copied ? 'fa-check' : 'fa-copy'}`} aria-hidden="true"></i>
                                                                    </button>
                                                                </span>
                                                            </div>
                                                        );
                                                    })}
                                                    {!rows.length && <p className="mh-map-empty">{s.dir === 'ltr' ? 'No matching email' : 'אין דוא״ל תואם'}</p>}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })()}
                            {s.web && (<a href={s.web} target="_blank" rel="noopener noreferrer" data-probe-external-link="true" data-tracking-name={s.webTrackingName || `${s.trackingName || s.org}_website`} data-analytics-type="website" style={{background: 'var(--primary)'}} title={webIsFacebook ? (s.webLabel || fbTitle) : undefined}><i className={webIsFacebook ? 'fab fa-facebook-f' : 'fas fa-external-link-alt'}></i> {webIsFacebook ? '' : (s.webLabel || (s.org && s.org.startsWith("Kav L'Noar") ? (s.dir === 'ltr' ? 'Jerusalem clinic' : 'מרפאת ירושלים') : (s.dir === 'ltr' ? 'Website' : 'לאתר')))}</a>)}
                            {s.web2 && (<a href={s.web2} target="_blank" rel="noopener noreferrer" data-probe-external-link="true" data-tracking-name={s.webTrackingName2 || `${s.trackingName || s.org}_website2`} data-analytics-type="website" style={{background: 'var(--primary)'}}><i className="fas fa-external-link-alt"></i> {s.webLabel2 || (s.dir === 'ltr' ? 'Website' : 'לאתר')}</a>)}
                            {s.add && (() => {
                                const isPdfDownload = /\.pdf(\?|$)/i.test(s.add) || s.addDownload;
                                const addProps = isPdfDownload
                                    ? { download: s.addDownloadName || 'haravot-barzel-maanaim.pdf', 'data-skip-external-link-check': true }
                                    : { target: '_blank', rel: 'noopener noreferrer' };
                                return (
                                    <a href={s.add} {...addProps} style={{ background: isPdfDownload ? '#c0392b' : 'var(--primary)' }} data-probe-external-link={isPdfDownload ? undefined : 'true'} data-tracking-name={s.addTrackingName || `${s.trackingName || s.org}_add`} data-analytics-type={isPdfDownload ? 'download' : 'website'} title={addIsFacebook ? (s.addLabel || fbTitle) : undefined}>
                                        <i className={isPdfDownload ? 'fas fa-file-pdf' : (addIsFacebook ? 'fab fa-facebook-f' : 'fas fa-external-link-alt')}></i>
                                        {addIsFacebook ? '' : (s.addLabel || (s.org && s.org.startsWith("Kav L'Noar") ? (s.dir === 'ltr' ? 'Beit Shemesh clinic' : 'מרפאת בית שמש') : (s.dir === 'ltr' ? 'Website' : 'לאתר נוסף')))}
                                    </a>
                                );
                            })()}
                            {locs.length === 1 && (
                                <a
                                    href={mhGoogleMapsUrl(locs[0])}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="mh-map-btn"
                                    data-skip-external-link-check="true"
                                    data-tracking-name={`${s.trackingName || s.org}_map`}
                                    data-analytics-type="map"
                                    title={locs[0].address || locs[0].label}
                                >
                                    <i className="fas fa-map-marker-alt"></i> {s.dir === 'ltr' ? 'Map' : 'מפה'}
                                </a>
                            )}
                            {locs.length > 1 && (
                                <div className="mh-map-picker">
                                    <button
                                        type="button"
                                        className="mh-map-btn"
                                        aria-expanded={mapOpen}
                                        aria-haspopup="listbox"
                                        onClick={() => { setContactOpen(null); setMapOpen((open) => !open); }}
                                        data-tracking-name={`${s.trackingName || s.org}_map`}
                                        data-analytics-type="map"
                                    >
                                        <i className="fas fa-map-marker-alt"></i> {s.dir === 'ltr' ? 'Map' : 'מפה'}
                                    </button>
                                    {mapOpen && (
                                        <button
                                            type="button"
                                            className="mh-map-backdrop"
                                            aria-label={s.dir === 'ltr' ? 'Close site list' : 'סגירת רשימת המרפאות'}
                                            onClick={() => setMapOpen(false)}
                                        />
                                    )}
                                    {mapOpen && (
                                        <div className="mh-map-panel mh-pick-panel" role="listbox" aria-label={s.dir === 'ltr' ? 'Choose a site' : 'בחירת מרפאה'}>
                                            <div className="mh-map-panel-bar">
                                                {locs.length > 6 && (
                                                    <input
                                                        type="text"
                                                        className="mh-map-filter"
                                                        value={mapFilter}
                                                        onChange={(e) => setMapFilter(e.target.value)}
                                                        placeholder={s.dir === 'ltr' ? 'Filter sites' : 'סינון מרפאות'}
                                                    />
                                                )}
                                                <button
                                                    type="button"
                                                    className="mh-map-close"
                                                    aria-label={s.dir === 'ltr' ? 'Close site list' : 'סגירת רשימת המרפאות'}
                                                    onClick={() => setMapOpen(false)}
                                                >
                                                    <i className="fas fa-times" aria-hidden="true"></i>
                                                </button>
                                            </div>
                                            {authUser && authUser.city && !nearbyOrigin && (
                                                <button
                                                    type="button"
                                                    className="mh-map-city"
                                                    onClick={() => runNearbyGeocode(authUser.city)}
                                                >
                                                    {s.dir === 'ltr' ? `Sort by your city (${authUser.city})` : `מיון לפי העיר בחשבון (${authUser.city})`}
                                                </button>
                                            )}
                                            <div className="mh-map-list">
                                                {visibleLocs.map(({ loc, locIdx, km }) => {
                                                    const detail = loc.address && loc.address !== loc.label ? loc.address : '';
                                                    const copyValue = detail || loc.label || '';
                                                    const key = `map:${s.row}:${locIdx}:${copyValue}`;
                                                    const copied = copiedKey === key;
                                                    const nearestMark = km != null && nearestKm != null && km === nearestKm
                                                        ? (s.dir === 'ltr' ? ' · nearest' : ' · הקרוב')
                                                        : '';
                                                    const copyLabel = copied
                                                        ? (s.dir === 'ltr' ? 'Address copied' : 'הכתובת הועתקה')
                                                        : (s.dir === 'ltr' ? `Copy ${copyValue}` : `העתקת ${copyValue}`);
                                                    const mapLabel = s.dir === 'ltr'
                                                        ? `Open ${loc.label || copyValue} on the map`
                                                        : `פתיחת ${loc.label || copyValue} במפה`;
                                                    return (
                                                        <div key={`${s.row}_map_${locIdx}`} className="mh-pick-option" role="option">
                                                            <span className="mh-pick-text">
                                                                <span className="mh-pick-title">
                                                                    {loc.label}{nearestMark}
                                                                    {km != null && <span className="mh-map-km"> · {mhFormatKm(km)} ק״מ</span>}
                                                                </span>
                                                                {detail ? <span className="mh-pick-detail">{detail}</span> : null}
                                                                {loc.note ? <span className="mh-pick-note">{loc.note}</span> : null}
                                                            </span>
                                                            <span className="mh-pick-actions">
                                                                <a className="mh-pick-map" href={mhGoogleMapsUrl(loc)} target="_blank" rel="noopener noreferrer" data-skip-external-link-check="true" aria-label={mapLabel} title={mapLabel} data-tracking-name={`${s.trackingName || s.org}_map_${locIdx + 1}`} data-analytics-type="map">
                                                                    <i className="fas fa-map-marker-alt" aria-hidden="true"></i>
                                                                </a>
                                                                <button type="button" className="mh-pick-copy" aria-label={copyLabel} title={copyLabel} onClick={() => copyText(copyValue, { onSuccess: () => markCopied(key), fallbackPrompt: s.dir === 'ltr' ? 'Copy this address:' : 'העתיקו את הכתובת:' })} data-tracking-name={`${s.trackingName || s.org}_map_copy_${locIdx + 1}`} data-analytics-type="map">
                                                                    <i className={`fas ${copied ? 'fa-check' : 'fa-copy'}`} aria-hidden="true"></i>
                                                                </button>
                                                            </span>
                                                        </div>
                                                    );
                                                })}
                                                {!visibleLocs.length && <p className="mh-map-empty">{s.dir === 'ltr' ? 'No matching site' : 'אין מרפאה תואמת'}</p>}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
            };

            const CategoryCard = ({ groupId }) => {
                const group = CATEGORY_GROUPS[groupId];
                const count = getGroupServiceCount(groupId);
                const isUrgent = group.priority === 'urgent';
                return (
                    <div
                        className={`mh-category-card ${isUrgent ? 'mh-category-card-urgent' : ''}`}
                        data-analytics-id={`category_${groupId}`}
                        data-analytics-section="category_overview"
                        data-section-anchor={`group_card_${groupId}`}
                        onClick={() => goToGroup(groupId)}
                        role="link"
                        tabIndex={0}
                        onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && goToGroup(groupId)}
                        aria-label={`${group.title} - ${group.titleEn}. ${count} שירותים. לחצו לצפייה`}
                    >
                        <SectionCopyButton groupId={groupId} label={group.title} variant="group" />
                        <div className="mh-category-card-icon">
                            <i className={`fas ${isUrgent ? 'fa-exclamation-triangle' : group.icon}`}></i>
                        </div>
                        <div>
                            <div className="mh-category-card-title">{group.title}</div>
                            <div style={{ fontSize: '0.85rem', opacity: 0.85 }}>{group.titleEn}</div>
                        </div>
                        {group.desc && <p className="mh-category-card-desc">{group.desc}</p>}
                        <div className="mh-category-card-meta">
                            <span className="mh-category-card-badge">
                                {count} {count === 1 ? 'שירות' : 'שירותים'}
                            </span>
                            {isUrgent && <span className="mh-category-card-badge">דחוף</span>}
                        </div>
                    </div>
                );
            };

            const uniqueLocatedServices = useMemo(() => {
                const map = new Map();
                Object.entries(data).forEach(([catId, cat]) => {
                    getCatServices(cat).forEach((s) => {
                        const row = Number(s.row);
                        const hasSites = (Array.isArray(s.cardSites) && s.cardSites.length) || ENTRY_LOCATIONS[row];
                        if (!row || !hasSites || map.has(row)) return;
                        map.set(row, { s, categoryKey: catId });
                    });
                });
                return map;
            }, [data]);
            const nearbyMatches = useMemo(() => {
                if (!nearbyOrigin) return [];
                const out = [];
                uniqueLocatedServices.forEach(({ s, categoryKey }, row) => {
                    const nearest = mhNearestLocation(
                        (Array.isArray(s.cardSites) && s.cardSites.length) ? s.cardSites : mhGetLocationsForRow(row),
                        nearbyOrigin
                    );
                    if (!nearest || nearest.km > nearbyRadiusKm) return;
                    out.push({ s, categoryKey, nearest });
                });
                out.sort((a, b) => a.nearest.km - b.nearest.km);
                return out;
            }, [nearbyOrigin, nearbyRadiusKm, uniqueLocatedServices]);
            const nearbyExpanded = nearbyOpen || !!nearbyOrigin || nearbyBusy;
            const runNearbyGeocode = async (addr) => {
                const q = String(addr || '').trim();
                if (q.length < 2) {
                    setNearbyStatus('נא להזין כתובת או יישוב');
                    return;
                }
                setNearbyBusy(true);
                setNearbyStatus('מחפש כתובת…');
                try {
                    const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
                    const body = await res.json();
                    if (!res.ok || !body.found) {
                        setNearbyOrigin(null);
                        setNearbyStatus('לא נמצאה כתובת בישראל. נסו יישוב או רחוב אחר.');
                        return;
                    }
                    setNearbyOrigin({ lat: body.lat, lng: body.lng, label: body.display_name, via: 'address' });
                    setNearbyStatus('');
                } catch {
                    setNearbyOrigin(null);
                    setNearbyStatus('שגיאה בחיפוש הכתובת. נסו שוב.');
                } finally {
                    setNearbyBusy(false);
                }
            };
            const runNearbyGps = () => {
                if (!navigator.geolocation) {
                    setNearbyStatus('הדפדפן אינו תומך במיקום.');
                    return;
                }
                setNearbyBusy(true);
                setNearbyStatus('מאתר מיקום…');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        setNearbyOrigin({ lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'המיקום הנוכחי', via: 'gps' });
                        setNearbyAddress('');
                        setNearbyStatus('');
                        setNearbyBusy(false);
                    },
                    () => {
                        setNearbyBusy(false);
                        setNearbyStatus('לא ניתן לקבל מיקום. בדקו הרשאות או הזינו כתובת.');
                    },
                    { enableHighAccuracy: false, timeout: 12000, maximumAge: 60000 }
                );
            };

            // Terms filtering and organization
            const filteredTerms = useMemo(() => {
                let result = Object.entries(terms);
                
                // Filter by search term
                if (termsSearch) {
                    const search = termsSearch.toLowerCase();
                    result = result.filter(([k, t]) => 
                        t.title.toLowerCase().includes(search) || 
                        t.text.toLowerCase().includes(search) ||
                        (t.category && TERM_CATEGORIES[t.category]?.title.toLowerCase().includes(search))
                    );
                }
                
                // Filter by category
                if (termsCategory) {
                    result = result.filter(([k, t]) => t.category === termsCategory);
                }
                
                // Filter by letter (for alphabetical view)
                if (selectedLetter) {
                    result = result.filter(([k, t]) => {
                        const firstChar = t.title.charAt(0);
                        return firstChar === selectedLetter;
                    });
                }
                
                return result;
            }, [termsSearch, termsCategory, selectedLetter]);

            // Group terms by category
            const termsByCategory = useMemo(() => {
                const grouped = {};
                filteredTerms.forEach(([k, t]) => {
                    const cat = t.category || 'other';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push([k, t]);
                });
                // Sort within each category
                Object.keys(grouped).forEach(cat => {
                    grouped[cat].sort((a, b) => a[1].title.localeCompare(b[1].title, 'he'));
                });
                return grouped;
            }, [filteredTerms]);

            // Get all first letters for A-Z navigation
            const firstLetters = useMemo(() => {
                const letters = new Set();
                Object.values(terms).forEach(t => {
                    const firstChar = t.title.charAt(0);
                    if (/[\u0590-\u05FF]/.test(firstChar)) {
                        letters.add(firstChar);
                    }
                });
                return Array.from(letters).sort((a, b) => a.localeCompare(b, 'he'));
            }, []);

            // Get Hebrew alphabet for A-Z navigation
            const hebrewAlphabet = 'אבגדהוזחטיכלמנסעפצקרשת';

            const renderTermReadMore = (t) => {
                if (!t?.readMoreUrl) return null;
                return (
                    <p style={{
                        lineHeight: 1.8,
                        fontSize: 'var(--text-base)',
                        color: 'var(--text)',
                        marginBottom: 'var(--space-md)',
                        marginTop: 0
                    }}>
                        <a
                            href={t.readMoreUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            style={{ color: 'var(--primary)', fontWeight: 600, textDecoration: 'underline' }}
                            data-tracking-name="terms_read_more"
                        >
                            קרא עוד
                        </a>
                    </p>
                );
            };

            const renderTermParagraphs = (text, keyPrefix) => {
                const parts = String(text || '').split(/\n+/).map((part) => part.trim()).filter(Boolean);
                return parts.map((part, i) => (
                    <p key={`${keyPrefix}-p-${i}`} style={{
                        lineHeight: 1.8,
                        fontSize: 'var(--text-base)',
                        color: 'var(--text)',
                        margin: i === parts.length - 1 ? '0 0 var(--space-md)' : '0 0 var(--space-sm)'
                    }}>
                        {mhDialText(part, `${keyPrefix}-${i}`)}
                    </p>
                ));
            };

            const renderTermActions = (t, k) => {
                if (!t.phone && !t.phone2 && !t.web && !t.web2) return null;
                const btn = {
                    padding: 'var(--space-sm) var(--space-md)',
                    borderRadius: 'var(--radius-sm)',
                    textDecoration: 'none',
                    fontSize: 'var(--text-sm)',
                    display: 'inline-flex',
                    alignItems: 'center',
                    gap: 'var(--space-xs)',
                    color: 'white'
                };
                return (
                    <div style={{
                        marginTop: 'var(--space-md)',
                        paddingTop: 'var(--space-md)',
                        borderTop: '1px solid var(--border)',
                        display: 'flex',
                        gap: 'var(--space-md)',
                        flexWrap: 'wrap'
                    }}>
                        {t.phone && (
                            <a href={mhTelHref(t.phone)} style={{ ...btn, background: 'var(--accent)' }} data-tracking-name={`terms_phone_${k}`} data-analytics-type="phone">
                                <i className="fas fa-phone"></i> {mhPhoneFace(t.phone, t.phoneLabel, true, false, `tp-${k}`)}
                            </a>
                        )}
                        {t.phone2 && (
                            <a href={mhTelHref(t.phone2)} style={{ ...btn, background: 'var(--accent)' }} data-tracking-name={`terms_phone2_${k}`} data-analytics-type="phone">
                                <i className="fas fa-phone"></i> {mhPhoneFace(t.phone2, t.phoneLabel2, true, false, `tp2-${k}`)}
                            </a>
                        )}
                        {t.web && (
                            <a href={t.web} target="_blank" rel="noopener noreferrer" data-probe-external-link="true" style={{ ...btn, background: 'var(--primary)' }} data-tracking-name={`terms_web_${k}`} data-analytics-type="website">
                                <i className="fas fa-external-link-alt"></i> {t.webLabel || 'לאתר'}
                            </a>
                        )}
                        {t.web2 && (
                            <a href={t.web2} target="_blank" rel="noopener noreferrer" data-probe-external-link="true" style={{ ...btn, background: 'var(--primary)' }} data-tracking-name={`terms_web2_${k}`} data-analytics-type="website">
                                <i className="fas fa-external-link-alt"></i> {t.webLabel2 || 'לאתר'}
                            </a>
                        )}
                    </div>
                );
            };

            const openTerm = (key) => {
                pushGlossaryNavRef.current = true;
                setTermsSearch('');
                setTermsCategory(null);
                setSelectedLetter(null);
                setTermsViewMode('categories');
                setFocusedTermCat(null);
                setTermCardsKey(null);
                setFocusedTerm(key);
                setShowTerms(true);
            };
            const openTermCards = (key) => {
                pushGlossaryNavRef.current = true;
                setShowTerms(false);
                setFocusedTerm(null);
                setFocusedTermCat(null);
                setTermsSearch('');
                setTermsCategory(null);
                setSelectedLetter(null);
                setTermsViewMode('categories');
                setSearchTerm('');
                setHaravotBarzelLaunchedFrom(null);
                setTermCardsKey(key);
                setSelectedCategoryGroup(null);
                setRequestedEntryId(null);
                setRequestedSectionId(null);
                setRequestedSubsectionId(null);
                setResourcePage(null);
                handledDeepLinkRef.current = null;
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    document.querySelector('.mh-termcards-banner')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }));
            };
            const clearTermCards = () => {
                pushGlossaryNavRef.current = true;
                setTermCardsKey(null);
            };
            const closeTerms = () => {
                pushGlossaryNavRef.current = true;
                setShowTerms(false);
                setTermsSearch('');
                setTermsCategory(null);
                setSelectedLetter(null);
                setTermsViewMode('categories');
                setFocusedTerm(null);
                setFocusedTermCat(null);
            };
            useEffect(() => {
                if (focusedTerm && !terms[focusedTerm]) {
                    setFocusedTerm(null);
                    if (!focusedTermCat) setShowTerms(false);
                    return;
                }
                if (!showTerms || !focusedTerm) return;
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    document.getElementById(`term-${focusedTerm}`)?.scrollIntoView({ block: 'center' });
                }));
            }, [showTerms, focusedTerm, focusedTermCat]);
            useEffect(() => {
                if (!focusedTermCat) return;
                if (!TERM_CATEGORIES[focusedTermCat]) {
                    setFocusedTermCat(null);
                    if (!focusedTerm) setShowTerms(false);
                    return;
                }
                if (!showTerms || focusedTerm) return;
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    document.getElementById(`termcat-${focusedTermCat}`)?.scrollIntoView({ block: 'start' });
                }));
            }, [showTerms, focusedTermCat, focusedTerm]);
            useEffect(() => {
                if (termCardsKey && !terms[termCardsKey]) setTermCardsKey(null);
            }, [termCardsKey]);

            // Approved glossary links arrive on each card (cardTerms). The reverse list, a term's
            // services, is built from the same cards so the two directions cannot disagree.
            const termCards = useMemo(() => {
                const byTerm = {};
                const seen = new Set();
                const add = (svc, categoryKey) => {
                    if (!svc || !Array.isArray(svc.cardTerms)) return;
                    const id = `${svc.row}|||${svc.svc || ''}`;
                    if (seen.has(id)) return;
                    seen.add(id);
                    svc.cardTerms.forEach((key) => {
                        if (!byTerm[key]) byTerm[key] = [];
                        byTerm[key].push({ row: svc.row, org: svc.org, svc: svc.svc, categoryKey });
                    });
                };
                Object.entries(data).forEach(([categoryKey, cat]) => {
                    (cat.services || []).forEach((svc) => add(svc, categoryKey));
                    Object.values(cat.subsections || {}).forEach((sub) => (sub.services || []).forEach((svc) => add(svc, categoryKey)));
                });
                Object.values(byTerm).forEach((list) => list.sort((a, b) => String(a.org).localeCompare(String(b.org), 'he')));
                return byTerm;
            }, [data]);

            const TERM_SERVICES_VISIBLE = 8;
            const [expandedTermGroups, setExpandedTermGroups] = useState([]);
            const countSectionServices = (catId) => {
                const cat = data[catId];
                if (!cat) return 0;
                return (cat.services || []).length

                list.forEach((item) => { orgCounts[item.org] = (orgCounts[item.org] || 0) + 1; });

                                    data-analytics-text={terms[key].title}
                                    data-tracking-name={`terms_cards_${key}`}
                                >
                                    כל השירותים במדריך ({list.length})
                                </button>
                            </div>

                        {groups.map((g) => {
                            const groupId = `${key}|${g.categoryKey}`;
                            const expanded = expandedTermGroups.includes(groupId);
                            const shown = expanded ? g.items : g.items.slice(0, TERM_SERVICES_VISIBLE);
                            const hidden = g.items.length - shown.length;
                            return (
                                <div key={groupId}>

                                    ? `חיפוש ב${CATEGORY_GROUPS[selectedCategoryGroup].title}`
                                    : 'חיפוש לפי ארגון, נושא או אוכלוסייה (למשל: טראומה, נוער)'}
                                value={searchTerm}

                                className={`mh-search-input${searchTerm.trim() ? ' mh-search-input-with-share' : searchTerm ? ' mh-search-input-with-clear' : ''}`}

<!-- Improved Button Click Tracking for Google Analytics -->
<script>
  window.addEventListener('load', function() {
    console.log('✅ Click tracking initialized');
    
    document.addEventListener('click', function(e) {
      const element = e.target.closest('button, a, [role="button"]');
      
      if (element && typeof gtag !== 'undefined') {
        let buttonName = 'unknown';
        let buttonType = element.tagName.toLowerCase();
        let destination = '';
        
        // Priority order for getting button name:
        // 1. data-tracking-name (custom attribute you can add)
        // 2. aria-label (accessibility label)
        // 3. title attribute
        // 4. Button text (cleaned up)
        // 5. href for links
        
        if (element.hasAttribute('data-tracking-name')) {
          buttonName = element.getAttribute('data-tracking-name');
        } else if (element.hasAttribute('aria-label')) {
          buttonName = element.getAttribute('aria-label');
        } else if (element.hasAttribute('title')) {
          buttonName = element.getAttribute('title');
        } else if (element.textContent.trim()) {
          buttonName = element.textContent.trim().substring(0, 100); // Limit to 100 chars
        }
        
        // For links, capture the destination
        if (element.tagName === 'A' && element.href) {
          destination = element.href;
          // If button name is just the emoji, use a cleaned URL instead
          if (buttonName === 'לאתר 🔗' || buttonName.length < 3) {
            try {
              const url = new URL(element.href);
              buttonName = url.hostname.replace('www.', '');
            } catch (e) {
              buttonName = element.href;
            }
          }
        }
        
        console.log('📊 Tracking click:', {
          name: buttonName,
          type: buttonType,
          destination: destination
        });
        
        // Send to Google Analytics
        gtag('event', 'button_click', {
          'button_name': buttonName,
          'button_type': buttonType,
          'link_url': destination,
          'page_location': window.location.href
        });
        
        console.log('✅ Event sent to Google Analytics');
      }
    });
  });
</script>
