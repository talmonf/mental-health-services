            const filmDisplayLanguages = (film) => [...new Set((film.languages || []).map(normalizeFilmLanguage))];
            const filmMatchesFilters = (film, filters, exclude = null) => {
                if (exclude !== 'audience') {
                    if (filters.audience === 'peers' && !(Number(film.ratingPeers) >= 4)) return false;
                    if (filters.audience === 'therapists' && !(Number(film.ratingTherapists) >= 4)) return false;
                }
                if (exclude !== 'language' && filters.language) {
                    const want = normalizeFilmLanguage(filters.language).toLowerCase();
                    if (!filmDisplayLanguages(film).some(l => l.toLowerCase() === want)) return false;
                }
                if (exclude !== 'typeGroup' && filters.typeGroup) {
                    const g = FILM_TYPE_GROUP[film.type] || film.type;
                    if (g !== filters.typeGroup) return false;
                }
                if (exclude !== 'topic' && filters.topic) {
                    if (!(film.topics || []).some(t => String(t).toLowerCase() === filters.topic.toLowerCase())) return false;
                }
                if (exclude !== 'free') {
                    if (filters.free === 'yes' && !filmIsFree(film)) return false;
                    if (filters.free === 'no' && filmIsFree(film)) return false;
                }
                if (exclude !== 'platform' && filters.platform) {
                    if (!filmPlatformNames(film).some(n => n.toLowerCase().includes(filters.platform.toLowerCase()))) return false;
                }
                return true;
            };

            const filteredFilms = useMemo(() => {
                return FILMS.filter(film => filmMatchesFilters(film, filmFilters));
            }, [filmFilters]);

            const filmFilterOptions = useMemo(() => {
                const uniqSort = (arr) => [...new Set(arr)].sort((a, b) => String(a).localeCompare(String(b), 'he'));
                const languages = uniqSort(
                    FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'language'))
                        .flatMap(f => filmDisplayLanguages(f))
                        .filter(l => FILM_LANGUAGE_FILTER_VALUES.has(l))
                );
                const topics = uniqSort(
                    FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'topic'))
                        .flatMap(f => f.topics || [])
                );
                const platforms = uniqSort(
                    FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'platform'))
                        .flatMap(f => filmPlatformNames(f))
                );
                return { languages, topics, platforms };
            }, [filmFilters]);

            useEffect(() => {
                setFilmFilters(prev => {
                    let next = prev;
                    const ensure = (key, ok) => {
                        if (prev[key] && !ok) {
                            if (next === prev) next = { ...prev };
                            next[key] = '';
                        }
                    };
                    ensure('language', !prev.language || filmFilterOptions.languages.includes(prev.language));
                    ensure('topic', !prev.topic || filmFilterOptions.topics.includes(prev.topic));
                    ensure('platform', !prev.platform || filmFilterOptions.platforms.some(p => p.toLowerCase().includes(prev.platform.toLowerCase())));
                    if (prev.typeGroup) {
                        const hasType = FILMS.some(f => filmMatchesFilters(f, prev, 'typeGroup') && (FILM_TYPE_GROUP[f.type] || f.type) === prev.typeGroup);
                        ensure('typeGroup', hasType);
                    }
                    if (prev.free === 'yes') {
                        ensure('free', FILMS.some(f => filmMatchesFilters(f, prev, 'free') && filmIsFree(f)));
                    } else if (prev.free === 'no') {
                        ensure('free', FILMS.some(f => filmMatchesFilters(f, prev, 'free') && !filmIsFree(f)));
                    }
                    return next;
                });
            }, [filmFilterOptions]);

            const filmTypeFilterOptions = useMemo(() => {
                const base = FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'typeGroup'));
                const groups = new Set(base.map(f => FILM_TYPE_GROUP[f.type] || f.type));
                return [
                    groups.has('film') ? { value: 'film', label: 'סרט / דוקו' } : null,
                    groups.has('series') ? { value: 'series', label: 'סדרה' } : null

            }, [filmFilters]);

            const filmFreeFilterOptions = useMemo(() => {
                const base = FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'free'));
                const hasYes = base.some(filmIsFree);
                const hasNo = base.some(f => !filmIsFree(f));
                return [
                    hasYes ? { value: 'yes', label: 'כן' } : null,
                    hasNo ? { value: 'no', label: 'לא / בתשלום' } : null

            const renderCategoryContent = (cat, id) => {

                    return (

                                    {card.desc && <p className="mh-resource-nav-card-desc">{card.desc}</p>}

                if (cat.subsections) {
                    return Object.entries(cat.subsections).map(([subId, sub]) => (
                        <div key={`${id}_${subId}`} style={{ marginBottom: 'var(--space-xl)' }}>

                                    <span style={{ display: 'inline-block', marginTop: '4px', background: 'rgba(45, 90, 123, 0.12)', color: 'var(--primary)', borderRadius: '999px', padding: '2px 8px', fontSize: 'var(--text-sm)' }}>
                                        {(sub.services || []).length} רשומות

                                <SectionCopyButton

                                    subsectionId={subId}

                                    variant="subsection"

                return (

                        {(s.target || s.notes || s.region || s.cost || s.specialty || s.languages || s.diseases || mhGetLocationsForRow(s.row).length) && (

                                {s.region && <div style={{ marginBottom: '6px' }}><strong style={{ color: 'var(--primary)' }}>{s.dir === 'ltr' ? 'Region:' : 'אזור:'}</strong> {s.region}</div>}

                                {mhGetLocationsForRow(s.row).length > 1 && (

                            </div>

                        <div className="mh-card-actions">

                            {s.phone3 && (<a href={`tel:${s.phone3.replace(/[^\d*#]/g, '')}`} style={{background: 'var(--accent)'}} title={s.iconOnly ? (s.phoneLabel3 ? `${s.phoneLabel3}: ${s.phone3}` : s.phone3) : undefined} data-tracking-name={`${s.trackingName || s.org}_phone3`} data-analytics-type="phone"><i className="fas fa-phone"></i> {s.iconOnly ? (s.phoneLabel3 || '') : (s.phoneLabel3 ? (s.phoneShowNumber3 ? `${s.phoneLabel3}: ${s.phone3}` : s.phoneLabel3) : s.phone3)}</a>)}
                            {s.phone4 && (<a href={`tel:${s.phone4.replace(/[^\d*#]/g, '')}`} style={{background: 'var(--accent)'}} title={s.iconOnly ? (s.phoneLabel4 ? `${s.phoneLabel4}: ${s.phone4}` : s.phone4) : undefined} data-tracking-name={`${s.trackingName || s.org}_phone4`} data-analytics-type="phone"><i className="fas fa-phone"></i> {s.iconOnly ? (s.phoneLabel4 || '') : (s.phoneLabel4 ? (s.phoneShowNumber4 ? `${s.phoneLabel4}: ${s.phone4}` : s.phoneLabel4) : s.phone4)}</a>)}
                            {s.phone5 && (<a href={`tel:${s.phone5.replace(/[^\d*#]/g, '')}`} style={{background: 'var(--accent)'}} title={s.iconOnly ? (s.phoneLabel5 ? `${s.phoneLabel5}: ${s.phone5}` : s.phone5) : undefined} data-tracking-name={`${s.trackingName || s.org}_phone5`} data-analytics-type="phone"><i className="fas fa-phone"></i> {s.iconOnly ? (s.phoneLabel5 || '') : (s.phoneLabel5 ? (s.phoneShowNumber5 ? `${s.phoneLabel5}: ${s.phone5}` : s.phoneLabel5) : s.phone5)}</a>)}
                            {s.phone6 && (<a href={`tel:${s.phone6.replace(/[^\d*#]/g, '')}`} style={{background: 'var(--accent)'}} title={s.iconOnly ? (s.phoneLabel6 ? `${s.phoneLabel6}: ${s.phone6}` : s.phone6) : undefined} data-tracking-name={`${s.trackingName || s.org}_phone6`} data-analytics-type="phone"><i className="fas fa-phone"></i> {s.iconOnly ? (s.phoneLabel6 || '') : (s.phoneLabel6 ? (s.phoneShowNumber6 ? `${s.phoneLabel6}: ${s.phone6}` : s.phoneLabel6) : s.phone6)}</a>)}
                            {s.whatsapp && (<a href={`https://wa.me/${s.whatsapp.replace(/[^\d]/g, '')}`} target="_blank" rel="noopener noreferrer" style={{background: '#25D366', gap: '4px'}} title={s.showContactText ? undefined : (s.dir === 'ltr' ? `WhatsApp: ${s.whatsapp}` : `וואטסאפ: ${s.whatsapp}`)} data-tracking-name={`${s.trackingName || s.org}_whatsapp`} data-analytics-type="whatsapp"><i className="fab fa-whatsapp"></i> {s.showContactText ? s.whatsapp : (s.whatsappLabel || '')}</a>)}

                            {s.web && (<a href={s.web} target="_blank" rel="noopener noreferrer" data-probe-external-link="true" data-tracking-name={s.webTrackingName || `${s.trackingName || s.org}_website`} data-analytics-type="website" style={{background: 'var(--primary)'}} title={webIsFacebook ? (s.webLabel || fbTitle) : undefined}><i className={webIsFacebook ? 'fab fa-facebook-f' : 'fas fa-external-link-alt'}></i> {webIsFacebook ? '' : (s.webLabel || (s.org && s.org.startsWith("Kav L'Noar") ? (s.dir === 'ltr' ? 'Jerusalem clinic' : 'מרפאת ירושלים') : (s.dir === 'ltr' ? 'Website' : 'לאתר')))}</a>)}

                    if (!nearest || nearest.km > nearbyRadiusKm) return;
                    out.push({ s, categoryKey, nearest });

                    return;
                }
                setNearbyBusy(true);
                setNearbyStatus('מחפש כתובת…');
                try {
                    const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
                    const body = await res.json();
                    if (!res.ok || !body.found) {
                        setNearbyOrigin(null);
                        setNearbyStatus('לא נמצאה כתובת בישראל. נסו יישוב או רחוב אחר.');
                        return;
                    }
                    setNearbyOrigin({ lat: body.lat, lng: body.lng, label: body.display_name, via: 'address' });
                    setNearbyStatus('');
                } catch {
                    setNearbyOrigin(null);
                    setNearbyStatus('שגיאה בחיפוש הכתובת. נסו שוב.');
                } finally {
                    setNearbyBusy(false);
                }

            const runNearbyGps = () => {

                    setNearbyStatus('הדפדפן אינו תומך במיקום.');
                    return;

                setNearbyBusy(true);
                setNearbyStatus('מאתר מיקום…');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        setNearbyOrigin({ lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'המיקום הנוכחי', via: 'gps' });
                        setNearbyAddress('');
                        setNearbyStatus('');
                        setNearbyBusy(false);
                    },
                    () => {
                        setNearbyBusy(false);
                        setNearbyStatus('לא ניתן לקבל מיקום. בדקו הרשאות או הזינו כתובת.');

                            }} className="mh-btn mh-subcategory-back" style={{ background: 'var(--primary)', color: 'white' }} data-tracking-name="back_to_categories">
                                ← חזרה לכל הקטגוריות
                            </button>
                            {CATEGORY_GROUPS[selectedCategoryGroup].subcategories.filter(id => filtered[id]).map(id => {
                                const cat = filtered[id];
                                return (
                                    <div key={id} style={{ background: 'var(--bg-card)', marginBottom: 'var(--space-xl)', borderRadius: 'var(--radius-md)', overflow: 'hidden', boxShadow: 'var(--shadow-card)' }}>
                                        <div onClick={() => toggleCat(id)} className="mh-cat-header" style={{ background: id === 'emergency' ? 'var(--danger-bg)' : 'var(--primary)' }} role="button" tabIndex={0} onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && toggleCat(id)} aria-expanded={expandedCats.includes(id)} data-analytics-id={`subcategory_${id}`} data-analytics-section="category_group">
                                            <span style={{ flexShrink: 0 }}>{expandedCats.includes(id) ? '▲' : '▼'}</span>
                                            <div className="mh-cat-title">
                                                <span className="mh-cat-title-he">{cat.title}</span>
                                                <span className="mh-cat-meta">
                                                    <SectionCopyButton categoryId={id} label={cat.title} />
                                                    <i className={`fas ${CAT_ICONS[id] || 'fa-folder'}`} style={{ fontSize: '1.25rem' }}></i>
                                                    <span style={{ background: 'rgba(255,255,255,0.3)', padding: '2px 8px', borderRadius: 'var(--radius-sm)', fontSize: 'var(--text-sm)' }}>{getCatServiceCount(cat)}</span>
                                                </span>
                                                <span className="mh-cat-title-en">{cat.titleEn}</span>
                                            </div>
                                        </div>
                                        {expandedCats.includes(id) && (
                                            <div>
                                                <CategoryIntro cat={cat} showSectionLinks={!!cat.sectionLinks?.length} />
                                                {renderCategoryContent(cat, id)}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="mh-category-cards">
                            {Object.keys(CATEGORY_GROUPS).map(groupId => (
                                <CategoryCard key={groupId} groupId={groupId} />
                            ))}
                        </div>
                    )}

                    <div className="mh-footer mh-disclaimer">
                        <p style={{ margin: '0 0 var(--space-md)', fontWeight: 'bold', fontSize: 'var(--text-lg)' }}><i className="fas fa-info-circle"></i> הצהרת אחריות | Disclaimer</p>
                        <p style={{ margin: '0 0 var(--space-xl)', opacity: 0.9 }}>
                            המידע לצורכי הכוונה בלבד ואינו מהווה ייעוץ רפואי או משפטי
                        </p>
                        <p style={{ margin: 0, fontSize: 'var(--text-sm)', opacity: 0.7 }}>
                            {`עודכן: ${LAST_UPDATED}`}
                        </p>
                    </div>
                    <div id="mh-link-toast" className={toastMessage ? 'mh-link-toast-visible' : ''} role="status" aria-live="polite">
                        {toastMessage}
                    </div>
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MentalHealthIsrael />);
    </script>

<!-- Improved Button Click Tracking for Google Analytics -->
<script>
  window.addEventListener('load', function() {
    console.log('✅ Click tracking initialized');
    
    document.addEventListener('click', function(e) {
      const element = e.target.closest('button, a, [role="button"]');
      
      if (element && typeof gtag !== 'undefined') {
        let buttonName = 'unknown';
        let buttonType = element.tagName.toLowerCase();
        let destination = '';
        
        // Priority order for getting button name:
        // 1. data-tracking-name (custom attribute you can add)
        // 2. aria-label (accessibility label)
        // 3. title attribute
        // 4. Button text (cleaned up)
        // 5. href for links
        
        if (element.hasAttribute('data-tracking-name')) {
          buttonName = element.getAttribute('data-tracking-name');
        } else if (element.hasAttribute('aria-label')) {
          buttonName = element.getAttribute('aria-label');
        } else if (element.hasAttribute('title')) {
          buttonName = element.getAttribute('title');
        } else if (element.textContent.trim()) {
          buttonName = element.textContent.trim().substring(0, 100); // Limit to 100 chars
        }
        
        // For links, capture the destination
        if (element.tagName === 'A' && element.href) {
          destination = element.href;
          // If button name is just the emoji, use a cleaned URL instead
          if (buttonName === 'לאתר 🔗' || buttonName.length < 3) {
            try {
              const url = new URL(element.href);
              buttonName = url.hostname.replace('www.', '');
            } catch (e) {
              buttonName = element.href;
            }
          }
        }
        
        console.log('📊 Tracking click:', {
          name: buttonName,
          type: buttonType,
          destination: destination
        });
        
        // Send to Google Analytics
        gtag('event', 'button_click', {
          'button_name': buttonName,
          'button_type': buttonType,
          'link_url': destination,
          'page_location': window.location.href
        });
        
        console.log('✅ Event sent to Google Analytics');
      }
    });
  });
</script>
