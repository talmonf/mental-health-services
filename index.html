        const MH_FUNDING_TERMS_EN = { full: 'fully covered', partial: 'co-payment', eligible: 'if eligible' };
        // Indicators come only from directory_card_edits. A card with none set is "unknown",
        // so filters never hide it and the embedded referral codes stay in use for it.
        const mhCardIndicators = (s) => {
            const ind = s && s.cardIndicators;
            if (!ind || typeof ind !== 'object') return null;
            const offers = Array.isArray(ind.offers) ? ind.offers.filter((c) => MH_OFFER_LABELS_HE[c]) : [];
            const funding = Array.isArray(ind.funding) ? ind.funding.filter((f) => f && MH_FUNDING_LABELS_HE[f.channel]) : [];
            const referral = Array.isArray(ind.referral) ? ind.referral.filter(Boolean) : [];
            const wholeOrg = ind.whole_org === true;
            if (!offers.length && !funding.length && !referral.length && !wholeOrg) return null;
            const infoOnly = offers.length === 1 && offers[0] === 'info';
            return {
                offers,
                funding: infoOnly ? [] : funding,
                referral,
                referralSource: typeof ind.referral_source === 'string' ? ind.referral_source : '',
                wholeOrg,
                infoOnly
            };
        };
        const MH_CARD_FILTER_EMPTY = { offer: '', funding: '', hideInfoOnly: false };
        const mhCardFilterActive = (f) => Boolean(f && (f.offer || f.funding || f.hideInfoOnly));
        const mhServiceMatchesCardFilter = (s, f) => {
            if (!mhCardFilterActive(f)) return true;
            const ind = mhCardIndicators(s);
            if (!ind) return true;
            if (f.hideInfoOnly && ind.infoOnly) return false;
            if (f.offer && ind.offers.length && !ind.offers.includes(f.offer)) return false;
            if (f.funding) {
                if (ind.infoOnly) return false;
                if (ind.funding.length && !ind.funding.some((x) => x.channel === f.funding)) return false;
            }
            return true;
        };
        const mhGoogleMapsUrl = (loc) => {
            const lat = Number(loc && loc.lat);
            const lng = Number(loc && loc.lng);
            const name = String((loc && (loc.address || loc.label)) || '').trim();
            const hasCoords = Number.isFinite(lat) && Number.isFinite(lng);
            if (hasCoords && name) return `https://www.google.com/maps?q=${encodeURIComponent(`${lat},${lng} (${name})`)}`;
            if (hasCoords) return `https://www.google.com/maps?q=${lat},${lng}`;
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
        };
        const mhHaversineKm = (lat1, lng1, lat2, lng2) => {
            const toRad = (d) => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
            return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(a)));
        };
        const mhFormatKm = (km) => (km < 10 ? km.toFixed(1) : String(Math.round(km)));
        const mhNearestLocation = (locs, origin) => {
            if (!locs || !locs.length || !origin) return null;
            let best = null;
            locs.forEach((loc) => {
                const km = mhHaversineKm(origin.lat, origin.lng, loc.lat, loc.lng);
                if (!best || km < best.km) best = { loc, km };
            });
            return best;
        };
        // Gershayim, geresh, and the quote keys typed in their place are not part of the word.
        // יה״ל, יה"ל, and יהל are the same search.
        const MH_SEARCH_QUOTE_RE = /["'\u05F3\u05F4\u2018-\u201F\u2032\u2033\u0060\u00B4\u02B9\u02BA\u02BC]/g;
        const mhNormalizeSearchText = (value) => String(value || '').toLowerCase().replace(MH_SEARCH_QUOTE_RE, '');
        const mhServiceSearchText = (s) => {
            const tagPart = `${s.tags || ''}${HARAVOT_BARZEL_ROWS.has(Number(s.row)) ? ' ' + HARAVOT_BARZEL_SEARCH : ''}`;
            return mhNormalizeSearchText(`${s.org} ${s.svc} ${s.target || ''} ${s.notes || ''} ${s.specialty || ''} ${s.diseases || ''} ${s.languages || ''} ${tagPart}`);
        };

        // טיפול יום and אשפוז יום name the same service. A query that uses either phrase
        // also matches cards written with the other, so the two searches return the same cards.
        // ציפור is often typed צפור, without the י after צ. Either spelling finds the same cards.
        const MH_SEARCH_SYNONYM_GROUPS = [
            ['טיפול יום', 'אשפוז יום'],
            ['ציפור', 'צפור']
        ];
        const mhSearchNeedles = (term) => {
            const t = mhNormalizeSearchText(term);
            if (!t) return [];
            const needles = [t];
            MH_SEARCH_SYNONYM_GROUPS.forEach((group) => {
                group.forEach((phrase) => {
                    if (!t.includes(phrase)) return;
                    group.forEach((alt) => {
                        if (alt !== phrase) needles.push(t.split(phrase).join(alt));
                    });
                });
            });
            return needles;
        };
        const mhServiceMatchesSearch = (service, term) => {
            const haystack = mhServiceSearchText(service);
            return mhSearchNeedles(term).some((needle) => haystack.includes(needle));
        };

        // A bare address in the notes is shown as a link. The visible text is the word
        // before the address, so the full URL is not printed on the card. A longer name
        // is written [בית משלך](https://nefesh-il.org/support?entry=289&section=youth).
        // A link to this site opens here, in the section named in the URL.
        const mhNoteLinkSameSite = (url) => /^https?:\/\/(www\.)?nefesh-il\.org(\/|$)/i.test(url);
        // entry=356 and /s/356 name a card. A link is dropped only when every card on that
        // row is hidden, so a shared row that still has a visible card keeps its link.
        const mhSameSiteCardRow = (url) => {
            try {
                const parsed = new URL(url);
                const host = parsed.hostname.replace(/^www\./i, '');
                if (host !== 'nefesh-il.org') return null;
                const entry = parsed.searchParams.get('entry');
                if (entry && /^\d+$/.test(entry)) return Number(entry);
                const pathMatch = parsed.pathname.match(/^\/s\/(\d+)(?:-|$)/);
                return pathMatch ? Number(pathMatch[1]) : null;
            } catch {
                return null;
            }
        };
        // A leading * is direction-neutral, so in Hebrew it paints after the digits (*5400 → 5400*).
        // Isolate the short code and always show the star first. 9518* is the same code, stored backwards.
        const mhStarRe = () => /(\*\s*\d{2,5})|(\d{3,5}\s*\*)/g;
        const mhStarDigits = (token) => String(token).replace(/\D/g, '');
        const mhTelHref = (raw) => {
            const compact = String(raw || '').replace(/[^\d*#]/g, '');
            const trailing = compact.match(/^(\d{3,5})\*$/);
            if (trailing) return `tel:*${trailing[1]}`;
            return compact ? `tel:${compact}` : '';
        };
        const mhDialText = (text, keyPrefix) => {
            const raw = String(text ?? '');
            const re = mhStarRe();
            if (!re.test(raw)) return raw;
            re.lastIndex = 0;
            const out = [];
            let last = 0;
            let n = 0;
            let m;
            while ((m = re.exec(raw))) {
                if (m.index > last) out.push(raw.slice(last, m.index));
                out.push(<bdi key={`${keyPrefix || 'd'}-${n++}`} dir="ltr" className="mh-dial">{`*${mhStarDigits(m[0])}`}</bdi>);
                last = m.index + m[0].length;
            }
            if (last < raw.length) out.push(raw.slice(last));
            return out;
        };
        const mhDialPlain = (text) => String(text ?? '').replace(mhStarRe(), (tok) => `\u200e*${mhStarDigits(tok)}`);
        const mhPhoneFace = (num, label, showNumber, iconOnly, keyPrefix) => {
            if (iconOnly) return label || '';
            const shown = label ? (showNumber ? `${label}: ${num}` : label) : num;
            return mhDialText(shown, keyPrefix);
        };

        const mhRenderLinkedNotes = (notes, hiddenRows) => {
            const text = String(notes || '');
            const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|([^\s]+)[ \t]+(https?:\/\/[^\s]+)/g;
            const out = [];
            let last = 0;
            let key = 0;
            let match;
            const pushPlain = (chunk) => {
                if (!chunk) return;
                const nodes = mhDialText(chunk, `note-${key}`);
                key += 1;
                if (Array.isArray(nodes)) out.push(...nodes);
                else out.push(nodes);
            };
            while ((match = re.exec(text))) {
                const markdown = match[1] != null;
                let url = markdown ? match[2] : match[4];
                let trail = '';
                if (!markdown) {
                    const punct = url.match(/[.,;:]+$/);
                    if (punct) {
                        trail = punct[0];
                        url = url.slice(0, -trail.length);
                    }
                }
                const word = markdown ? match[1] : match[3];
                const prefix = !markdown && /^ו[א-ת]/.test(word) && word.length > 2 ? 'ו' : '';
                const label = prefix ? word.slice(1) : word;
                if (match.index > last) pushPlain(text.slice(last, match.index));
                if (prefix) pushPlain(prefix);
                const linkedRow = mhSameSiteCardRow(url);
                const dropLink = hiddenRows && linkedRow != null && hiddenRows.has(linkedRow);
                if (dropLink) {
                    const nodes = mhDialText(label, `note-${key}`);
                    key += 1;
                    if (Array.isArray(nodes)) out.push(...nodes);
                    else out.push(nodes);
                } else {
                    const sameSite = mhNoteLinkSameSite(url);
                    out.push(
                        <a
                            key={`note-link-${key++}`}
                            href={url}
                            target={sameSite ? undefined : '_blank'}
                            rel={sameSite ? undefined : 'noopener noreferrer'}
                            data-probe-external-link={sameSite ? undefined : 'true'}
                        >{label}</a>
                    );
                }
                if (trail) pushPlain(trail);
                last = match.index + match[0].length;
                if (!markdown && text[last] === ' ' && /[.,;:]/.test(text[last + 1] || '')) last += 1;
            }
            if (last < text.length) pushPlain(text.slice(last));
            return out.length ? out : text;
        };

        const mhGetEntryId = (svc, categoryKey) => {
            const org = svc.org || '';
            const desc = svc.svc || '';
            const displayName = org;
            const rowId = (svc.row != null && svc.row !== '') ? String(svc.row) : mhSlugify(displayName || categoryKey || 'entry');
            const baseSlug = (displayName && displayName.trim() !== '') ? mhSlugify(displayName) : `${categoryKey}_${rowId}`;
            return `${baseSlug || categoryKey}_${rowId}`;
        };
        const mhGetCategoryGroupForCategory = (categoryId) => {
            const found = Object.entries(CATEGORY_GROUPS).find(([, group]) => group.subcategories.includes(categoryId));
            return found ? found[0] : null;
        };
        // The group lives in the path (/treatment). Old /#<group> links from WhatsApp pastes are
        // still read, and the URL sync below moves them onto the path without a reload.
        // /g/<group> is not an app route. vercel.json permanently redirects it to the group
        // page. Rewriting it here would drop that redirect and unload the app.
        const mhReadUrlState = () => {
            try {
                const url = new URL(window.location.href);
                const hashGroup = (url.hash || '').replace(/^#/, '').trim();
                const rawGroup = mhGroupFromPath(url.pathname) || hashGroup;
                const rawPage = (url.searchParams.get('page') || '').trim();
                return {
                    q: (url.searchParams.get('q') || '').trim(),
                    entry: (url.searchParams.get('entry') || '').trim(),
                    section: (url.searchParams.get('section') || '').trim(),
                    subsection: (url.searchParams.get('subsection') || '').trim(),
                    page: MH_RESOURCE_PAGES.has(rawPage) ? rawPage : '',
                    group: MH_CATEGORY_GROUP_IDS.has(rawGroup) ? rawGroup : '',
                    term: mhGlossaryKey(url.searchParams.get('term')),
                    termcat: mhGlossaryKey(url.searchParams.get('termcat')),
                    termcards: mhGlossaryKey(url.searchParams.get('termcards')),
                    glossary: mhIsGlossaryPath(url.pathname)
                };
            } catch {
                return { q: '', entry: '', section: '', subsection: '', page: '', group: '', term: '', termcat: '', termcards: '', glossary: false };
            }
        };
        const mhReplaceUrlState = ({ q, entry, section, subsection, page, group, term, termcat, termcards, glossary }, { push = false } = {}) => {
            try {
                const url = new URL(window.location.href);
                const from = `${url.pathname}${url.search}`;
                if (q) url.searchParams.set('q', q);
                else url.searchParams.delete('q');
                if (entry) url.searchParams.set('entry', entry);
                else url.searchParams.delete('entry');
                if (section) url.searchParams.set('section', section);
                else url.searchParams.delete('section');
                if (subsection) url.searchParams.set('subsection', subsection);
                else url.searchParams.delete('subsection');
                if (page) url.searchParams.set('page', page);
                else url.searchParams.delete('page');
                if (term) url.searchParams.set('term', term);
                else url.searchParams.delete('term');
                if (termcat) url.searchParams.set('termcat', termcat);
                else url.searchParams.delete('termcat');
                if (termcards) url.searchParams.set('termcards', termcards);
                else url.searchParams.delete('termcards');
                url.pathname = glossary ? MH_GLOSSARY_PATH : mhGroupPath(group);
                url.hash = '';
                const next = `${url.pathname}${url.search}`;
                if (push && next !== from) window.history.pushState(null, '', next);
                else window.history.replaceState(null, '', next);
            } catch (_) {}
        };

        const mhParseUtmParams = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                return {
                    utm_source: params.get('utm_source') || null,
                    utm_medium: params.get('utm_medium') || null,
                    utm_campaign: params.get('utm_campaign') || null
                };
            } catch { return { utm_source: null, utm_medium: null, utm_campaign: null }; }
        };

        const mhTrackEvent = (eventType, props = {}, options = {}) => {
            try {
                if (!MH_ANALYTICS_CONFIG.enabled || !MH_ANALYTICS_CONFIG.endpoint) return;
                const url = window.location.href;
                let referrerDomain = null;
                if (document.referrer) {
                    try {
                        referrerDomain = new URL(document.referrer).hostname;
                    } catch {
                        referrerDomain = null;
                    }
                }
                const utm = mhParseUtmParams();
                // Explicit allowlisted payload — do not spread arbitrary props.
                const payload = {
                    event_id: mhGenerateId(),
                    event_type: eventType,
                    occurred_at: new Date().toISOString(),
                    page_url: url,
                    page_title: document.title || null,
                    referrer_domain: referrerDomain,
                    utm_source: utm.utm_source,
                    utm_medium: utm.utm_medium,
                    utm_campaign: utm.utm_campaign,
                    session_id: mhGetOrCreateSessionId(),
                    user_pseudo_id: mhGetOrCreateUserId(),
                    user_agent: navigator.userAgent,
                    viewport_width: window.innerWidth,
                    viewport_height: window.innerHeight,
                    section: props.section ?? null,
                    element_id: props.element_id ?? null,
                    element_type: props.element_type ?? null,
                    element_text_short: props.element_text_short ?? null,
                    search_query: props.search_query ?? null,
                    results_count: typeof props.results_count === 'number' ? props.results_count : null,
                    search_location: props.search_location ?? null,
                    entry_id: props.entry_id ?? null,
                    entry_hostname: props.entry_hostname ?? null,
                    entry_origin: props.entry_origin ?? null,
                    entry_url: props.entry_url ?? null,
                    error: props.error ?? null,
                    error_details: props.error_details ?? null,
                    ga_client_id: window.__mhGaClientId || null
                };

                const body = JSON.stringify(payload);
                let queued = false;
                // Prefer sendBeacon (same path as working search/click events).
                if (!options.forceFetch && navigator.sendBeacon) {
                    try {
                        queued = navigator.sendBeacon(
                            MH_ANALYTICS_CONFIG.endpoint,
                            new Blob([body], { type: 'application/json' })
                        );
                    } catch (_) {
                        queued = false;
                    }
                }
                if (!queued) {
                    fetch(MH_ANALYTICS_CONFIG.endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body,
                        keepalive: true
                    }).catch(() => {});
                }
            } catch {
                // swallow errors to avoid impacting UX
            }
        };

        const mhTrackSearch = (location, rawQuery, extra = {}) => {
            // Skip duplicate search rows while a share/copy (or deep-link open) is in progress.
            if (window.__mhSuppressSearchBlur) return;
            const sanitized = mhSanitizeSearchQuery(rawQuery);
            if (!sanitized) return;
            mhTrackEvent('search', {
                search_query: sanitized,
                search_location: location,
                results_count: typeof extra.results_count === 'number' ? extra.results_count : null,
                section: extra.section ?? null,
                element_id: extra.element_id ?? null,
                element_type: extra.element_type ?? null,
                entry_id: extra.entry_id ?? null
            });
        };

        /** Suppress blur→search when the user is clicking a share/copy control. */
        const mhArmShareCopy = () => {
            window.__mhSuppressSearchBlur = true;
            window.setTimeout(() => { window.__mhSuppressSearchBlur = false; }, 1000);
        };
        const mhBlurIsShareAction = (relatedTarget) => {
            try {
                if (window.__mhSuppressSearchBlur) return true;
                return !!(relatedTarget && relatedTarget.closest && relatedTarget.closest('[data-analytics-type="share"]'));
            } catch {
                return !!window.__mhSuppressSearchBlur;
            }
        };

        const mhInitShareLinkTracking = () => {
            // Capture early so blur-from-search cannot race ahead of suppress.
            document.addEventListener('pointerdown', (event) => {
                if (event.target?.closest?.('[data-analytics-type="share"]')) mhArmShareCopy();
            }, true);
            document.addEventListener('mousedown', (event) => {
                if (event.target?.closest?.('[data-analytics-type="share"]')) mhArmShareCopy();
            }, true);
            // Dedicated share tracking — independent of React handlers / clipboard success.
            document.addEventListener('click', (event) => {
                const el = event.target?.closest?.('[data-analytics-type="share"]');
                if (!el) return;
                const kind = el.getAttribute('data-share-kind') || '';
                if (kind === 'search') {
                    mhArmShareCopy();
                    const q = (el.getAttribute('data-share-query') || '').trim();
                    // forceFetch: deep-link types may need API constraint fallback (sendBeacon hides HTTP errors).
                    mhTrackEvent('search_link_copied', {
                        section: 'deep_link',
                        element_id: 'copy_search_link',
                        element_type: 'search_link_copied',
                        element_text_short: ('copied_search:' + q).slice(0, 80),
                        search_query: mhSanitizeSearchQuery(q),
                        search_location: 'search_link_copied'
                    }, { forceFetch: true });
                    return;
                }
                if (kind === 'card') {
                    mhArmShareCopy();
                    const entryId = el.getAttribute('data-share-entry-id') || el.closest('[data-entry-id]')?.getAttribute('data-entry-id') || null;
                    const section = el.getAttribute('data-share-section') || el.closest('[data-entry-category]')?.getAttribute('data-entry-category') || 'deep_link';
                    const label = el.getAttribute('data-share-label') || entryId || '';
                    mhTrackEvent('card_link_copied', {
                        section,
                        element_id: 'copy_card_link',
                        element_type: 'card_link_copied',
                        element_text_short: ('copied_card:' + label).slice(0, 80),
                        entry_id: entryId,
                        search_location: 'card_link_copied'
                    }, { forceFetch: true });
                    return;
                }
                if (kind === 'section') {
                    mhArmShareCopy();
                    const section = el.getAttribute('data-share-section') || 'deep_link';
                    const label = el.getAttribute('data-share-label') || section;
                    mhTrackEvent('section_link_copied', {
                        section,
                        element_id: 'copy_section_link',
                        element_type: 'section_link_copied',
                        element_text_short: ('copied_section:' + label).slice(0, 80),
                        search_location: 'section_link_copied'
                    }, { forceFetch: true });
                    return;
                }
                if (kind === 'term' || kind === 'termcat' || kind === 'glossary') {
                    mhArmShareCopy();
                    const section = el.getAttribute('data-share-section') || 'glossary';
                    const label = el.getAttribute('data-share-label') || section;
                    const sectionName = kind === 'term' ? `term_${section}` : kind === 'termcat' ? `termcat_${section}` : 'glossary';
                    mhTrackEvent('section_link_copied', {
                        section: sectionName,
                        element_id: kind === 'glossary' ? 'copy_glossary_link' : kind === 'term' ? 'copy_term_link' : 'copy_termcat_link',
                        element_type: kind === 'glossary' ? 'glossary_link_copied' : kind === 'term' ? 'term_link_copied' : 'termcat_link_copied',
                        element_text_short: (`copied_${kind}:` + label).slice(0, 80),
                        search_location: kind === 'glossary' ? 'glossary_link_copied' : kind === 'term' ? 'term_link_copied' : 'termcat_link_copied'
                    }, { forceFetch: true });
                    return;
                }
                if (kind === 'termcards') {
                    mhArmShareCopy();
                    const key = (el.getAttribute('data-share-section') || '').trim();
                    mhTrackEvent('search_link_copied', {
                        section: 'deep_link',
                        element_id: 'copy_termcards_link',
                        element_type: 'termcards_link_copied',
                        element_text_short: ('copied_termcards:' + key).slice(0, 80),
                        search_query: mhSanitizeSearchQuery(key),
                        search_location: 'termcards_link_copied'
                    }, { forceFetch: true });
                }
            }, true);
        };

        const mhInitClickTracking = () => {
            document.addEventListener('click', (event) => {
                const el = event.target.closest('[data-analytics-id],[data-tracking-name]');
                if (!el) return;
                if (el.matches?.('[data-probe-external-link]')) return;
                // Share/deep-link copy buttons are handled by mhInitShareLinkTracking.
                if (el.getAttribute('data-analytics-type') === 'share' || el.getAttribute('data-analytics-type') === 'admin-edit') return;
                const elementId = el.getAttribute('data-analytics-id') || el.getAttribute('data-tracking-name');
                if (!elementId) return;
                const tagName = el.tagName ? el.tagName.toLowerCase() : 'element';
                const elementType = el.getAttribute('data-analytics-type') || tagName;
                const entryIdEl = el.closest('[data-entry-id]');
                // data-analytics-entry is the card when the control is not inside one,
                // as with a glossary term's link to a single service.
                const entryId = el.getAttribute('data-analytics-entry')
                    || (entryIdEl ? entryIdEl.getAttribute('data-entry-id') : null);
                const sectionEl = el.closest('[data-analytics-section]');
                const section = sectionEl
                    ? sectionEl.getAttribute('data-analytics-section')
                    : (entryIdEl ? entryIdEl.getAttribute('data-entry-category') : null);
                const textSource = el.getAttribute('data-analytics-text') || el.innerText || el.textContent || '';
                const elementTextShort = textSource.trim().slice(0, 80) || null;
                // data-analytics-term marks a move between a glossary term and the directory.
                // search_query holds the term key; element_type names the direction.
                const termKey = (el.getAttribute('data-analytics-term') || '').trim();
                const searchQuery = termKey ? mhSanitizeSearchQuery(termKey) : null;
                mhTrackEvent('click', {
                    element_id: elementId,
                    element_type: elementType,
                    element_text_short: elementTextShort,
                    section,
                    entry_id: entryId,

                };
                const shouldHandleAnchor = (a) => {
                    if (!a || a.closest?.('[data-skip-external-link-check]')) return null;
                    if (a.hasAttribute('download')) return null;
                    const href = a.getAttribute('href');
                    if (!href || href.startsWith('#') || href.startsWith('javascript:')) return null;
                    if (/^mailto:/i.test(href) || /^tel:/i.test(href)) return null;
                    let u;
                    try {
                        u = new URL(href, window.location.href);
                    } catch {
                        return null;
                    }
                    if (u.origin === window.location.origin) return null;
                    if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
                    const host = (u.hostname || '').replace(/^www\./, '').toLowerCase();
                    if (host === 'maps.google.com' || (host === 'google.com' && u.pathname.startsWith('/maps'))) return null;

                };
                const getAnchorAnalyticsMeta = (a, absoluteHref) => {

                    const tagName = a?.tagName ? a.tagName.toLowerCase() : 'a';
                    const elementType = a?.getAttribute?.('data-analytics-type') || tagName;
                    const textSource = a?.getAttribute?.('data-analytics-text') || a?.innerText || a?.textContent || '';
                    const elementTextShort = textSource.trim().slice(0, 80) || null;
                    const entryIdEl = a?.closest?.('[data-entry-id]');
                    const entryId = entryIdEl ? entryIdEl.getAttribute('data-entry-id') : null;
                    return { elementId, elementType, elementTextShort, entryId, section: 'link_probe' };
                };
                const probeAndGo = async (absoluteHref, newTab, meta) => {
                    try {
                        const res = await fetch('/api/link-probe', {

                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: absoluteHref }),
                        });
                        let data = null;
                        try {
                            data = await res.json();
                        } catch {
                            data = null;
                        }
                        if (!data) {
                            follow(absoluteHref, newTab);
                            return;
                        }
                        if (data.ok === true) {
                            window.mhAnalytics?.trackEvent('click', {
                                element_id: meta?.elementId || absoluteHref.slice(0, 240),
                                element_type: meta?.elementType || 'outbound_link',
                                element_text_short: meta?.elementTextShort || null,
                                section: meta?.section || 'link_probe',

                            window.mhAnalytics?.trackEvent('click', {
                                element_id: meta?.elementId || absoluteHref.slice(0, 240),
                                element_type: meta?.elementType || 'outbound_link',
                                element_text_short: meta?.elementTextShort || null,
                                section: meta?.section || 'link_probe',
                                entry_id: meta?.entryId || null,
                                error: 'error',

                                    final_url: data.finalUrl,
                                    requested_url: absoluteHref,

                            }, { forceFetch: true });
                            return;

                        window.mhAnalytics?.trackEvent('click', {
                            element_id: meta?.elementId || absoluteHref.slice(0, 240),
                            element_type: meta?.elementType || 'outbound_link',
                            element_text_short: meta?.elementTextShort || null,
                            section: meta?.section || 'link_probe',
                            entry_id: meta?.entryId || null,

                    if (!svc || svc.row == null || svc.row === '') return;
                    const row = Number(svc.row);
                    if (!Number.isFinite(row)) return;
                    const edit = cardEditMap && cardEditMap[`${svc.row}|||${svc.svc || ''}`];
                    const hidden = edit && typeof edit.hidden === 'boolean' ? edit.hidden : Boolean(svc.hidden);
                    if (!byRow.has(row)) byRow.set(row, { hidden: 0, visible: 0 });

                    if (hidden) bucket.hidden += 1;
                    else bucket.visible += 1;

                            e.stopPropagation();
                            mhArmShareCopy();
                        }}
                        onClick={(e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            copyText(link, { onSuccess: () => markGlossaryLinkCopied(copiedId) });
                        }}
                        title={isCopied ? 'הקישור הועתק' : idle}
                        aria-label={isCopied ? 'הקישור הועתק' : idle}
                        data-tracking-name={`copy_${kind}_link_${glossaryKey}`}
                        data-analytics-type="share"
                        data-share-kind={kind}
                        data-share-section={glossaryKey}
                        data-share-label={label || glossaryKey}
                    >
                        <i className={`fas ${isCopied ? 'fa-check' : 'fa-link'}`} aria-hidden="true"></i>
                    </button>
                );
            };
            const buildEntryLink = ({ entryId, categoryId, row }) => {
                const groupId = mhGetCategoryGroupForCategory(categoryId);
                const url = new URL(window.location.href);
                url.pathname = mhGroupPath(groupId);
                url.search = '';
                url.hash = '';
                // Prefer numeric row so share URLs stay ASCII-clear (no Hebrew / percent-encoding).
                const shareEntry = (row != null && row !== '') ? String(row) : entryId;
                url.searchParams.set('entry', shareEntry);
                url.searchParams.set('section', categoryId);
                return url.toString();
            };
            const buildSectionLink = ({ categoryId = null, subsectionId = null, groupId = null } = {}) => {
                const url = new URL(window.location.href);
                url.search = '';
                url.hash = '';
                if (categoryId) {
                    url.pathname = mhGroupPath(groupId || mhGetCategoryGroupForCategory(categoryId));
                    url.searchParams.set('section', categoryId);
                    if (subsectionId) url.searchParams.set('subsection', subsectionId);
                } else {
                    url.pathname = mhGroupPath(groupId);
                }
                return url.toString();
            };
            const sectionShareKey = ({ categoryId = null, subsectionId = null, groupId = null } = {}) => {
                if (categoryId && subsectionId) return `${categoryId}_${subsectionId}`;
                if (categoryId) return categoryId;
                if (groupId) return `group_${groupId}`;
                return '';
            };
            const SectionCopyButton = ({ categoryId = null, subsectionId = null, groupId = null, label = '', variant = 'section' }) => {
                const shareKey = sectionShareKey({ categoryId, subsectionId, groupId });
                if (!shareKey) return null;
                const isCopied = copiedSectionKey === shareKey;
                const className = [
                    'mh-section-copy-link',
                    variant === 'subsection' ? 'mh-subsection-copy-link' : '',
                    variant === 'group' ? 'mh-group-copy-link' : '',
                    isCopied ? 'mh-section-copy-link-copied' : ''
                ].filter(Boolean).join(' ');
                return (
                    <button
                        type="button"
                        className={className}
                        onMouseDown={(e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            mhArmShareCopy();
                        }}
                        onClick={(e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            const link = buildSectionLink({ categoryId, subsectionId, groupId });
                            copyText(link, {
                                onSuccess: () => markSectionLinkCopied(shareKey)
                            });
                        }}
                        title={isCopied ? 'הקישור הועתק' : 'העתקת קישור שפותח את המקטע הזה בדף'}
                        aria-label={isCopied ? 'הקישור הועתק' : `העתק קישור למקטע ${label || shareKey}`}
                        data-tracking-name={`copy_section_link_${shareKey}`}
                        data-analytics-type="share"
                        data-share-kind="section"
                        data-share-section={shareKey}
                        data-share-label={label || shareKey}
                    >
                        <i className={`fas ${isCopied ? 'fa-check' : 'fa-link'}`} aria-hidden="true"></i>
                    </button>
                );
            };
            const CategoryIntro = ({ cat, showSectionLinks }) => {
                if (!cat.intro && !cat.desc && !(showSectionLinks && cat.sectionLinks?.length)) return null;
                return (
                    <div className="mh-cat-desc">
                        {cat.intro && <p style={{ margin: '0 0 var(--space-md)' }}>{cat.intro}</p>}
                        {showSectionLinks && cat.sectionLinks?.length > 0 && (
                            <ul style={{ margin: '0 0 var(--space-md)', paddingRight: 'var(--space-lg)' }}>
                                {cat.sectionLinks.map(link => (
                                    <li key={link.target} style={{ marginBottom: 'var(--space-xs)' }}>
                                        <button
                                            type="button"
                                            className="mh-section-link"
                                            onClick={() => scrollToTreatmentSubcategory(link.target)}
                                            data-tracking-name={`jump_${link.target}`}
                                        >
                                            {link.label}
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        )}
                        {cat.desc && <p style={{ margin: 0 }}>{cat.desc}</p>}
                    </div>
                );
            };
            const getCatServices = (cat) => {
                if (!cat) return [];
                if (Array.isArray(cat.services)) return cat.services;
                if (cat.subsections) {
                    return Object.values(cat.subsections).flatMap(sub => Array.isArray(sub.services) ? sub.services : []);
                }
                return [];
            };
            const getCatServiceCount = (cat) => (cat && cat.resourceCount != null ? cat.resourceCount : getCatServices(cat).length);

            const getGroupServiceCount = (groupId) => {
                const group = CATEGORY_GROUPS[groupId];
                if (!group) return 0;
                return group.subcategories.reduce((sum, subId) => {
                    const cat = filtered[subId];
                    return sum + (cat ? getCatServiceCount(cat) : 0);
                }, 0);
            };

            const applyHaravotBarzelSearch = (launchFrom = 'hero') => {
                setHaravotBarzelLaunchedFrom(launchFrom);
                setSearchTerm(HARAVOT_BARZEL_SEARCH);
                setTermCardsKey(null);
                setSelectedCategoryGroup(null);
                setRequestedEntryId(null);
                setRequestedSectionId(null);
                setRequestedSubsectionId(null);
                setResourcePage(null);
                handledDeepLinkRef.current = null;
                requestAnimationFrame(() => {
                    document.querySelector('.mh-search-wrap')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            };

            // A known glossary key lists every directory card that points at that term, across the whole directory.
            const activeTermCardsKey = termCardsKey && terms[termCardsKey] ? termCardsKey : '';
            // On a group page the search covers only that group's categories; the home page covers everything.
            const filtered = useMemo(() => {
                if (!searchTerm && !cardFilterOn && !activeTermCardsKey) return data;
                const scope = activeTermCardsKey ? null : (selectedCategoryGroup ? CATEGORY_GROUPS[selectedCategoryGroup]?.subcategories : null);
                const matches = (s) => {
                    if (activeTermCardsKey && !(Array.isArray(s.cardTerms) && s.cardTerms.includes(activeTermCardsKey))) return false;
                    return (!searchTerm || mhServiceMatchesSearch(s, searchTerm)) && mhServiceMatchesCardFilter(s, cardFilter);
                };
                const r = {};
                Object.entries(data).forEach(([id, cat]) => {
                    if (scope && !scope.includes(id)) return;
                    if (Array.isArray(cat.services)) {
                        const m = cat.services.filter(matches);
                        if (m.length) r[id] = { ...cat, services: m };
                        return;
                    }
                    if (cat.subsections) {
                        const matchedSubsections = {};
                        Object.entries(cat.subsections).forEach(([subId, sub]) => {
                            const m = (sub.services || []).filter(matches);
                            if (m.length) matchedSubsections[subId] = { ...sub, services: m };
                        });
                        if (Object.keys(matchedSubsections).length) r[id] = { ...cat, subsections: matchedSubsections };
                    }
                });
                return r;
            }, [searchTerm, data, selectedCategoryGroup, cardFilter, cardFilterOn, activeTermCardsKey]);
            const resolvedEntryTarget = useMemo(() => {
                if (!requestedEntryId) return null;
                const candidates = entryTargets[requestedEntryId] || [];
                if (!candidates.length) return null;
                if (requestedSectionId) {
                    const exactSection = candidates.find((target) => target.categoryId === requestedSectionId);
                    if (exactSection) return exactSection;
                }
                if (selectedCategoryGroup) {
                    const sameGroup = candidates.find((target) => target.groupId === selectedCategoryGroup);
                    if (sameGroup) return sameGroup;
                }
                return candidates[0];
            }, [entryTargets, requestedEntryId, requestedSectionId, selectedCategoryGroup]);

            // Search results: auto-expand so matches are visible without extra clicks.
            // When 3+ sections match: expand only sections with ≤3 items (keeps long lists folded).
            // When 1–2 sections match: expand all (e.g. a single section with one hit).
            useEffect(() => {
                if (!searchTerm && !cardFilterOn && !activeTermCardsKey) return;
                const entries = Object.entries(filtered);
                const sectionCount = entries.length;
                if (sectionCount === 0) {
                    setExpandedCats([]);
                    return;
                }
                let autoExpand =
                    sectionCount >= 3
                        ? entries.filter(([, cat]) => getCatServiceCount(cat) <= 3).map(([id]) => id)
                        : entries.map(([id]) => id);
                const isHaravotBarzel = searchTerm === HARAVOT_BARZEL_SEARCH;
                if (isHaravotBarzel && entries.some(([id]) => id === 'emergency')) {
                    autoExpand = ['emergency', ...autoExpand.filter((id) => id !== 'emergency')];
                }
                setExpandedCats(autoExpand);
                if (isHaravotBarzel && autoExpand.includes('emergency')) {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            document.querySelector('[data-analytics-id="subcategory_emergency"]')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        });
                    });
                }
            }, [searchTerm, filtered, cardFilterOn, activeTermCardsKey]);
            useEffect(() => {
                if (!resolvedEntryTarget) return;
                const { entryId, groupId, categoryId, subsectionId } = resolvedEntryTarget;
                const subsectionKey = subsectionId ? `${categoryId}_${subsectionId}` : null;
                let changed = false;
                if (groupId && selectedCategoryGroup !== groupId) {
                    setSelectedCategoryGroup(groupId);
                    changed = true;
                }
                if (!expandedCats.includes(categoryId)) {
                    setExpandedCats((prev) => (prev.includes(categoryId) ? prev : [...prev, categoryId]));
                    changed = true;
                }
                if (subsectionKey && !expandedSubsections.includes(subsectionKey)) {
                    setExpandedSubsections((prev) => (prev.includes(subsectionKey) ? prev : [...prev, subsectionKey]));
                    changed = true;
                }
                if (changed) return;
                const handledKey = `${groupId || ''}:${categoryId}:${subsectionId || ''}:${entryId}`;
                if (handledDeepLinkRef.current === handledKey) return;
                const runScroll = () => {
                    const selector = [
                        `.mh-card[data-entry-id="${entryId}"]`,
                        `[data-entry-category="${categoryId}"]`,
                        subsectionId ? `[data-entry-subsection="${subsectionId}"]` : ''
                    ].join('');
                    const targetEl = document.querySelector(selector);
                    if (!targetEl) return;
                    handledDeepLinkRef.current = handledKey;
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    setHighlightedEntryKey(handledKey);
                };
                requestAnimationFrame(() => requestAnimationFrame(runScroll));
            }, [resolvedEntryTarget, selectedCategoryGroup, expandedCats, expandedSubsections, directorySource]);
            // Section deep links (?section=…&subsection=…#group): expand path and scroll to section top.
            useEffect(() => {
                if (!requestedSectionId || requestedEntryId || searchTerm) return;
                const categoryId = requestedSectionId;
                if (!Object.prototype.hasOwnProperty.call(DATA, categoryId)) return;
                const groupId = mhGetCategoryGroupForCategory(categoryId);
                const subsectionId = requestedSubsectionId || null;
                const cat = DATA[categoryId];
                const validSubsection = subsectionId
                    && cat?.subsections
                    && Object.prototype.hasOwnProperty.call(cat.subsections, subsectionId)
                    ? subsectionId
                    : null;
                const subsectionKey = validSubsection ? `${categoryId}_${validSubsection}` : null;
                let changed = false;
                if (groupId && selectedCategoryGroup !== groupId) {
                    setSelectedCategoryGroup(groupId);
                    changed = true;
                }
                if (!expandedCats.includes(categoryId)) {
                    setExpandedCats((prev) => (prev.includes(categoryId) ? prev : [...prev, categoryId]));
                    changed = true;
                }
                if (subsectionKey && !expandedSubsections.includes(subsectionKey)) {
                    setExpandedSubsections((prev) => (prev.includes(subsectionKey) ? prev : [...prev, subsectionKey]));
                    changed = true;
                }
                if (changed) return;
                const handledKey = `section:${groupId || ''}:${categoryId}:${validSubsection || ''}`;
                if (handledDeepLinkRef.current === handledKey) return;
                const runScroll = () => {
                    const selector = validSubsection
                        ? `[data-section-anchor="subsection_${categoryId}_${validSubsection}"]`
                        : `[data-analytics-id="subcategory_${categoryId}"]`;
                    const targetEl = document.querySelector(selector);
                    if (!targetEl) return;
                    handledDeepLinkRef.current = handledKey;
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                };
                requestAnimationFrame(() => requestAnimationFrame(runScroll));
            }, [requestedSectionId, requestedSubsectionId, requestedEntryId, searchTerm, selectedCategoryGroup, expandedCats, expandedSubsections]);
            useEffect(() => {
                if (!highlightedEntryKey) return undefined;
                if (highlightTimeoutRef.current) window.clearTimeout(highlightTimeoutRef.current);
                highlightTimeoutRef.current = window.setTimeout(() => {
                    setHighlightedEntryKey((current) => (current === highlightedEntryKey ? null : current));
                }, 4000);
                return () => {
                    if (highlightTimeoutRef.current) {
                        window.clearTimeout(highlightTimeoutRef.current);
                        highlightTimeoutRef.current = null;
                    }
                };
            }, [highlightedEntryKey]);

            const openResourcePage = (page) => {
                setShowTerms(false);
                setFocusedTerm(null);
                setFocusedTermCat(null);
                setTermCardsKey(null);
                setShowIntro(false);
                setSearchTerm('');
                setSelectedCategoryGroup('information');
                setRequestedSectionId('books_movies');
                setRequestedSubsectionId(null);
                setRequestedEntryId(null);
                setExpandedCats(prev => prev.includes('books_movies') ? prev : [...prev, 'books_movies']);
                setResourcePage(page);
                setFilmFilters({ audience: 'peers', language: '', typeGroup: '', topic: '', free: '', platform: '' });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const closeResourcePage = () => {
                setResourcePage(null);
                setFilmFilters({ audience: 'peers', language: '', typeGroup: '', topic: '', free: '', platform: '' });
                setSelectedCategoryGroup('information');
                setRequestedSectionId('books_movies');
                setExpandedCats(prev => prev.includes('books_movies') ? prev : [...prev, 'books_movies']);
                handledDeepLinkRef.current = null;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        document.querySelector('[data-analytics-id="subcategory_books_movies"]')
                            ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                });
            };

            const filmIsFree = (film) => (film.platforms || []).some(p => p.free);
            const filmPlatformNames = (film) => (film.platforms || []).map(p => p.name);
            const FILM_LANGUAGE_FILTER_VALUES = new Set(['English', 'עברית']);
            const normalizeFilmLanguage = (lang) => {
                const s = String(lang || '').trim();
                const lower = s.toLowerCase();
                if (lower === 'en' || lower === 'english' || s === 'אנגלית') return 'English';
                if (lower === 'he' || lower === 'hebrew' || s === 'עברית') return 'עברית';
                return s;
            };
            const filmDisplayLanguages = (film) => [...new Set((film.languages || []).map(normalizeFilmLanguage))];
            const filmMatchesFilters = (film, filters, exclude = null) => {
                if (exclude !== 'audience') {
                    if (filters.audience === 'peers' && !(Number(film.ratingPeers) >= 4)) return false;
                    if (filters.audience === 'therapists' && !(Number(film.ratingTherapists) >= 4)) return false;
                }
                if (exclude !== 'language' && filters.language) {
                    const want = normalizeFilmLanguage(filters.language).toLowerCase();
                    if (!filmDisplayLanguages(film).some(l => l.toLowerCase() === want)) return false;
                }
                if (exclude !== 'typeGroup' && filters.typeGroup) {
                    const g = FILM_TYPE_GROUP[film.type] || film.type;
                    if (g !== filters.typeGroup) return false;
                }
                if (exclude !== 'topic' && filters.topic) {
                    if (!(film.topics || []).some(t => String(t).toLowerCase() === filters.topic.toLowerCase())) return false;
                }
                if (exclude !== 'free') {
                    if (filters.free === 'yes' && !filmIsFree(film)) return false;
                    if (filters.free === 'no' && filmIsFree(film)) return false;
                }
                if (exclude !== 'platform' && filters.platform) {
                    if (!filmPlatformNames(film).some(n => n.toLowerCase().includes(filters.platform.toLowerCase()))) return false;
                }
                return true;
            };

            const filteredFilms = useMemo(() => {
                return FILMS.filter(film => filmMatchesFilters(film, filmFilters));
            }, [filmFilters]);

            const filmFilterOptions = useMemo(() => {
                const uniqSort = (arr) => [...new Set(arr)].sort((a, b) => String(a).localeCompare(String(b), 'he'));
                const languages = uniqSort(
                    FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'language'))
                        .flatMap(f => filmDisplayLanguages(f))
                        .filter(l => FILM_LANGUAGE_FILTER_VALUES.has(l))
                );
                const topics = uniqSort(
                    FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'topic'))
                        .flatMap(f => f.topics || [])
                );
                const platforms = uniqSort(
                    FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'platform'))
                        .flatMap(f => filmPlatformNames(f))
                );
                return { languages, topics, platforms };
            }, [filmFilters]);

            useEffect(() => {
                setFilmFilters(prev => {
                    let next = prev;
                    const ensure = (key, ok) => {
                        if (prev[key] && !ok) {
                            if (next === prev) next = { ...prev };
                            next[key] = '';
                        }
                    };
                    ensure('language', !prev.language || filmFilterOptions.languages.includes(prev.language));
                    ensure('topic', !prev.topic || filmFilterOptions.topics.includes(prev.topic));
                    ensure('platform', !prev.platform || filmFilterOptions.platforms.some(p => p.toLowerCase().includes(prev.platform.toLowerCase())));
                    if (prev.typeGroup) {
                        const hasType = FILMS.some(f => filmMatchesFilters(f, prev, 'typeGroup') && (FILM_TYPE_GROUP[f.type] || f.type) === prev.typeGroup);
                        ensure('typeGroup', hasType);
                    }
                    if (prev.free === 'yes') {
                        ensure('free', FILMS.some(f => filmMatchesFilters(f, prev, 'free') && filmIsFree(f)));
                    } else if (prev.free === 'no') {
                        ensure('free', FILMS.some(f => filmMatchesFilters(f, prev, 'free') && !filmIsFree(f)));
                    }
                    return next;
                });
            }, [filmFilterOptions]);

            const filmTypeFilterOptions = useMemo(() => {
                const base = FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'typeGroup'));
                const groups = new Set(base.map(f => FILM_TYPE_GROUP[f.type] || f.type));
                return [
                    groups.has('film') ? { value: 'film', label: 'סרט / דוקו' } : null,
                    groups.has('series') ? { value: 'series', label: 'סדרה' } : null
                ].filter(Boolean);
            }, [filmFilters]);

            const filmFreeFilterOptions = useMemo(() => {
                const base = FILMS.filter(f => filmMatchesFilters(f, filmFilters, 'free'));
                const hasYes = base.some(filmIsFree);
                const hasNo = base.some(f => !filmIsFree(f));
                return [
                    hasYes ? { value: 'yes', label: 'כן' } : null,
                    hasNo ? { value: 'no', label: 'לא / בתשלום' } : null
                ].filter(Boolean);
            }, [filmFilters]);

            const renderCategoryContent = (cat, id) => {
                if (cat.resourceHub) {
                    const cards = [
                        { page: 'books', icon: 'fa-book', title: 'ספרים', titleEn: 'Books', desc: 'המלצות קריאה (בקרוב)' },
                        { page: 'movies', icon: 'fa-film', title: 'סרטים וסדרות', titleEn: 'Movies & Series', desc: '' },
                        { page: 'ted', icon: 'fa-microphone-lines', title: 'TED Talks', titleEn: 'TED Talks', desc: 'פלייליסטים והרצאות נבחרות באנגלית' }
                    ];
                    return (
                        <div className="mh-resource-nav-grid">
                            {cards.map(card => (
                                <div
                                    key={card.page}
                                    className="mh-resource-nav-card"
                                    role="button"
                                    tabIndex={0}
                                    onClick={() => openResourcePage(card.page)}
                                    onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && openResourcePage(card.page)}
                                    data-tracking-name={`resource_open_${card.page}`}
                                    aria-label={`${card.title} — ${card.titleEn}`}
                                >
                                    <div className="mh-resource-nav-card-icon"><i className={`fas ${card.icon}`}></i></div>
                                    <div className="mh-resource-nav-card-title">{card.title}</div>
                                    <div style={{ fontSize: '0.85rem', opacity: 0.85 }}>{card.titleEn}</div>
                                    {card.desc && <p className="mh-resource-nav-card-desc">{card.desc}</p>}
                                </div>
                            ))}
                        </div>
                    );
                }
                if (cat.subsections) {
                    return Object.entries(cat.subsections).map(([subId, sub]) => (
                        <div key={`${id}_${subId}`} style={{ marginBottom: 'var(--space-xl)' }}>
                            <div
                                onClick={() => toggleSubsection(id, subId)}
                                role="button"
                                tabIndex={0}
                                onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && toggleSubsection(id, subId)}
                                aria-expanded={expandedSubsections.includes(`${id}_${subId}`)}
                                data-section-anchor={`subsection_${id}_${subId}`}
                                data-analytics-id={`subsection_${id}_${subId}`}
                                style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 'var(--space-md)', marginBottom: 'var(--space-md)', borderBottom: '1px solid var(--border)', paddingBottom: 'var(--space-sm)', cursor: 'pointer' }}
                            >
                                <div>
                                    <strong style={{ color: 'var(--primary)', fontSize: 'var(--text-base)' }}>{expandedSubsections.includes(`${id}_${subId}`) ? '▼ ' : '▶ '} {sub.title}</strong>
                                    <div style={{ fontSize: 'var(--text-sm)', color: 'var(--text-muted)' }}>{sub.titleEn}</div>
                                    <span style={{ display: 'inline-block', marginTop: '4px', background: 'rgba(45, 90, 123, 0.12)', color: 'var(--primary)', borderRadius: '999px', padding: '2px 8px', fontSize: 'var(--text-sm)' }}>
                                        {(sub.services || []).length} רשומות
                                    </span>
                                </div>
                                <SectionCopyButton
                                    categoryId={id}
                                    subsectionId={subId}
                                    label={sub.title}
                                    variant="subsection"
                                />
                            </div>
                            {expandedSubsections.includes(`${id}_${subId}`) && (
                                <div className="mh-cat-grid">
                                    {(sub.services || []).map((s, i) => <Card key={`${subId}_${i}`} s={s} categoryKey={id} subsectionId={subId} />)}
                                </div>
                            )}
                        </div>
                    ));
                }
                return (
                    <div className="mh-cat-grid">
                        {(cat.services || []).map((s, i) => <Card key={i} s={s} categoryKey={id} subsectionId={null} />)}
                    </div>
                );
            };

            const Card = ({ s, categoryKey, subsectionId, distanceLabel }) => {
                const [mapOpen, setMapOpen] = useState(false);
                const [mapFilter, setMapFilter] = useState('');
                const [contactOpen, setContactOpen] = useState(null);
                const [contactFilter, setContactFilter] = useState('');
                const [copiedKey, setCopiedKey] = useState('');
                const copiedTimer = useRef(null);
                const markCopied = (key) => {
                    setCopiedKey(key);
                    if (copiedTimer.current) window.clearTimeout(copiedTimer.current);
                    copiedTimer.current = window.setTimeout(() => {
                        setCopiedKey((current) => (current === key ? '' : current));
                        copiedTimer.current = null;
                    }, 2000);
                };
                useEffect(() => {
                    if (!mapOpen && !contactOpen) return undefined;
                    const onKey = (e) => {
                        if (e.key !== 'Escape') return;
                        setMapOpen(false);
                        setContactOpen(null);
                    };
                    document.addEventListener('keydown', onKey);
                    return () => document.removeEventListener('keydown', onKey);
                }, [mapOpen, contactOpen]);
                const entryId = categoryKey ? mhGetEntryId(s, categoryKey) : null;
                const entryTargetKey = `${mhGetCategoryGroupForCategory(categoryKey) || ''}:${categoryKey}:${subsectionId || ''}:${entryId || ''}`;
