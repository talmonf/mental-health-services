<!DOCTYPE html>
  <html lang="en-GB" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Nefesh directory</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://nefesh-il.org/admin">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2d5a7b;
      --primary-dark: #1e3f5a;
      --text: #333;
      --muted: #5a5a5a;
      --border: #e0e0e0;
      --bg: #f0f2f5;
      --card: #fff;
      --warn: #c47a12;
      --pv: #2d5a7b;
      --search: #3d8b6e;
      --click: #c47a12;
      --other: #8a7a9a;
    }
    body { margin: 0; font-family: Heebo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; color: var(--primary-dark); margin: 0 0 8px; }
    h2 { font-size: 1.15rem; color: var(--primary); margin: 28px 0 12px; }
    h3 { font-size: 0.95rem; color: var(--primary-dark); margin: 16px 0 8px; }
    p.lede { color: var(--muted); margin: 0 0 16px; }
    .card { background: var(--card); border-radius: 10px; padding: 16px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.07); margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.02em; white-space: nowrap; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat { flex: 1 1 140px; background: #eef4f8; border-radius: 8px; padding: 12px 14px; }
    .stat b { display: block; font-size: 1.4rem; color: var(--primary-dark); }
    .stat span { color: var(--muted); font-size: 0.85rem; }
    label { display: block; font-weight: 600; margin: 0 0 6px; font-size: 0.82rem; color: var(--muted); }
    input[type=text], input[type=date], input[type=number], textarea, select {
      width: 100%; box-sizing: border-box; padding: 8px 10px; border: 2px solid var(--border);
      border-radius: 8px; font: inherit; background: #fff;
    }
    textarea { min-height: 120px; }
    button, .btn {
      display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px;
      border: none; border-radius: 8px; background: var(--primary); color: #fff; font: inherit; font-weight: 600;
      cursor: pointer; text-decoration: none;
    }
    button.secondary { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .err { color: #c0392b; }
    .ok { color: #1e7a4a; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    a.back { color: var(--primary); text-decoration: none; font-weight: 600; }
    a.open { font-size: 0.8rem; font-weight: 600; white-space: nowrap; color: var(--primary); text-decoration: none; }
    a.open:hover { text-decoration: underline; }
    .gate { max-width: 480px; margin: 80px auto; background: var(--card); padding: 32px; border-radius: 10px; text-align: center; }
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tabs button {
      background: transparent; color: var(--muted); border: none; border-bottom: 3px solid transparent;
      border-radius: 8px 8px 0 0; min-height: 44px; font-weight: 600; margin-bottom: -2px;
    }
    .tabs button:hover:not(.active) { color: var(--primary-dark); background: #f4f8fb; }
    .tabs button.active {
      color: var(--primary-dark); background: #dce8f2; border-bottom: 3px solid var(--primary);
    }
    .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; align-items: end; }
    .filters .wide { grid-column: span 2; }
    .filters .exclude { grid-column: span 2; }
    .filters .exclude-pair { display: flex; gap: 8px; align-items: stretch; }
    .filters .exclude-pair select { flex: 1; min-width: 0; }
    .filters .check-field {
      display: flex; align-items: center; gap: 8px; margin: 0; flex: 0 0 auto;
      padding: 8px 10px; border: 2px solid var(--border); border-radius: 8px;
      background: #fff; font-weight: 600; box-sizing: border-box; cursor: pointer;
      white-space: nowrap;
    }
    .filters .check-field input { width: auto; margin: 0; flex: none; }
    .chart { display: flex; flex-direction: row; direction: ltr; align-items: flex-end; gap: 6px; min-height: 140px; overflow-x: auto; padding: 8px 0 0; }
    .chart-col { flex: 1 0 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 22px; }
    .chart-stack { width: 100%; display: flex; flex-direction: column-reverse; height: 120px; border-radius: 4px 4px 0 0; overflow: hidden; background: #eef2f5; }
    .chart-seg { width: 100%; }
    .chart-seg.pv { background: var(--pv); }
    .chart-seg.search { background: var(--search); }
    .chart-seg.click { background: var(--click); }
    .chart-seg.other { background: var(--other); }
    .chart-label { font-size: 0.65rem; color: var(--muted); writing-mode: horizontal-tb; transform: none; white-space: nowrap; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
    .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .hbar { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.85rem; }
    .hbar .name { flex: 0 0 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar .track { flex: 1; height: 10px; background: #eef2f5; border-radius: 6px; overflow: hidden; }
    .hbar .fill { height: 100%; background: var(--primary); }
    .hbar .n { flex: 0 0 2.5rem; color: var(--muted); text-align: right; }
    a.name-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    a.name-link:hover { text-decoration: underline; }
    .he-panel { direction: rtl; text-align: right; }
    .he-panel th, .he-panel td { text-align: right; }
    .dir-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .dir-grid .full { grid-column: 1 / -1; }
    .dir-help { color: var(--muted); font-size: 0.9rem; margin: 0 0 12px; }
    .dir-check { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-weight: 600; font-size: 0.85rem; }
    .dir-check input { width: auto; }
    .dir-check .dir-help { margin: 0; font-weight: 400; }
    .dir-fieldset { border: 1px solid var(--border, #ddd); border-radius: 8px; padding: 8px 12px 12px; margin: 0 0 12px; }
    .dir-fieldset legend { font-weight: 700; padding: 0 4px; }
    .dir-fieldset select { margin-top: 4px; }
    #d-members { margin: 0 0 8px; padding-inline-start: 18px; }
    .member-row { margin: 4px 0; }
    .dir-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    @media (max-width: 700px) { .dir-grid { grid-template-columns: 1fr; } }
    .users-table-wrap { overflow-x: auto; }
    .users-table-wrap table { min-width: 1240px; }
    .elig-mark { font-weight: 700; font-size: 1.15rem; line-height: 1; }
    .elig-mark.yes { color: #1e7a4a; }
    .elig-mark.no { color: #c0392b; }
    .dir-list-filters { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .dir-list-filters .dir-list-search { flex: 1 1 240px; }
    .dir-list-filters select { width: auto; min-width: 8rem; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: #eef4f8; color: var(--primary-dark); }
    .badge.warn { background: #fdf3e7; color: #8a5a12; }

    .qcard .publish { background: #eef4f8; border-radius: 8px; padding: 12px; }

    .faq-edit .row-end { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .status-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    details.chrome { margin-top: 4px; }
    details.chrome summary { cursor: pointer; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .kz-panel { direction: ltr; text-align: left; }
    .kz-panel h2[dir=auto] { margin-top: 0; }
    .kz-guide h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .kz-steps { margin: 8px 0 0; padding-inline-start: 1.25rem; }
    .kz-steps li { margin: 6px 0; }
    .kz-guide details { margin-top: 12px; }
    .kz-guide details summary { cursor: pointer; font-weight: 600; color: var(--primary-dark); }
    .kz-guide details:not([open]) > :not(summary) { display: none; }
    .kz-panel .filters .wide { grid-column: 1 / -1; }
    details.kz-about { margin-bottom: 16px; }
    details.kz-about summary { cursor: pointer; font-weight: 600; color: var(--primary-dark); }
    .kz-about p { margin: 8px 0; }
    .kz-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
    .kz-pre {
      white-space: pre-wrap; max-height: 420px; overflow: auto; background: #f7f9fb;
      border-radius: 8px; padding: 12px; font-size: 0.85rem; margin: 8px 0 0;
    }
    .kz-hit { display: block; width: 100%; text-align: inherit; background: transparent; color: inherit; border: none; padding: 8px 0; cursor: pointer; font: inherit; }
    .kz-hit:hover b { text-decoration: underline; }
    .kz-meta { font-size: 0.8rem; color: var(--muted); word-break: break-all; margin: 8px 0; }
    .audit-entry { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; background: #fff; }
    .audit-entry .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.85rem; margin-bottom: 6px; }
    .audit-entry h3 { margin: 4px 0 8px; }
    .audit-entry .desc { white-space: pre-wrap; margin: 0 0 8px; }
    .audit-links { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.85rem; }
    .lvl { display: inline-block; min-width: 1.6em; text-align: center; font-weight: 700; border-radius: 999px; padding: 2px 8px; font-size: 0.8rem; }
    .lvl-0 { background: #fbeaea; color: #8a2a2a; }
    .lvl-1 { background: #fdf3e7; color: #8a5a12; }
    .lvl-2 { background: #eef4f8; color: var(--primary-dark); }
    .lvl-3 { background: #e7f6ee; color: #1e7a4a; }
    .internal-section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px 4px 10px; background: #fff; font-size: 0.85rem; }
    .chip.suggested { border-style: dashed; background: #fdfaf3; }
    .chip button { min-height: 26px; padding: 2px 8px; font-size: 0.75rem; }
    .picker-results { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; }
    .picker-results button.kz-hit { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .picker-results .muted { font-size: 0.8rem; }
    .contact-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .contact-row .who { flex: 1 1 220px; }
    .contact-row input { flex: 1 1 200px; width: auto; }
    .gloss-term { margin-bottom: 16px; }
    .gloss-term h3 { display: flex; gap: 8px; align-items: center; }
    .gloss-term label.dir-check { font-weight: 400; }
    [dir=auto] { unicode-bidi: plaintext; }
    @media (max-width: 700px) {
      .filters .wide, .filters .exclude { grid-column: span 1; }
      .filters .exclude-pair { flex-wrap: wrap; }
    }
  </style>

    function hashToTab() {
      const h = (location.hash || '').replace(/^#/, '');
      if (['users', 'questions', 'updates', 'kolzchut', 'audit', 'verification', 'glossary'].includes(h)) return h;
      if (h === 'directory' || h.indexOf('directory/') === 0) return 'directory';
      return 'analytics';
    }
    function directoryIdFromHash() {
      const m = /^directory\/(\d+)$/.exec((location.hash || '').replace(/^#/, ''));
      return m ? Number(m[1]) : null;
    }
    const state = {

    };

    function el(html) {
      const d = document.createElement('div');
      d.innerHTML = html.trim();
      return d.firstElementChild;
    }
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function fmtDate(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return esc(String(v).slice(0, 16));
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy}, ${hh}:${min}`;
    }
    function fmtDay(v) {
      const s = String(v || '').slice(0, 10);
      if (!s) return '';
      const [y, m, d] = s.split('-');
      return `${d}/${m}`;
    }
    function ymdToDmy(ymd) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd || ''));
      return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
    }
    function dmyToYmd(dmy) {
      const s = String(dmy || '').trim();
      if (!s) return '';
      const m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/.exec(s);
      if (!m) return null;
      const dd = m[1].padStart(2, '0');
      const mm = m[2].padStart(2, '0');
      const yyyy = m[3];
      const dt = new Date(`${yyyy}-${mm}-${dd}T00:00:00Z`);
      if (Number.isNaN(dt.getTime()) || dt.toISOString().slice(0, 10) !== `${yyyy}-${mm}-${dd}`) return null;
      return `${yyyy}-${mm}-${dd}`;
    }
    const regionNames = typeof Intl !== 'undefined' && Intl.DisplayNames
      ? new Intl.DisplayNames(['en'], { type: 'region' })
      : null;
    function countryName(code) {
      const c = String(code || '').trim();
      if (!c || c === '(unknown)') return '(unknown)';
      if (/^[A-Za-z]{2}$/.test(c) && regionNames) {
        try {
          return regionNames.of(c.toUpperCase()) || c.toUpperCase();
        } catch {
          return c.toUpperCase();
        }
      }
      return c;
    }
    function table(headers, rows, cells, empty) {
      if (!rows || !rows.length) return `<p class="lede">${empty || 'No data in this window.'}</p>`;
      return `<table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
        rows.map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')
      }</tbody></table>`;
    }
    function openLink(href, label, dirAuto) {
      if (!href) return dirAuto ? `<span dir="auto">${esc(label)}</span>` : esc(label);
      const inner = dirAuto ? `<span dir="auto">${esc(label)}</span>` : esc(label);
      return `<a class="name-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
    }
    function contactName(r) {
      const display = String(r.display_name || '').trim();
      const text = String(r.element_text_short || '').trim();
      const id = String(r.element_id || '').trim();
      const type = String(r.element_type || '').trim();
      if (display && display.toLowerCase() !== type.toLowerCase()) return display;
      if (CONTACT_NAMES[id]) return CONTACT_NAMES[id];
      if (text && text.toLowerCase() !== type.toLowerCase()) return text;
      if (id && id.toLowerCase() !== type.toLowerCase()) {
        return id.replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
      }
      return actionLabel(type);
    }
    function hbars(rows, hrefFor) {
      if (!rows || !rows.length) return '<p class="lede">No data in this window.</p>';
      const max = Math.max(...rows.map((r) => Number(r.n) || 0), 1);
      return rows.map((r) => {
        const n = Number(r.n) || 0;
        const w = Math.round((n / max) * 100);
        const href = hrefFor ? hrefFor(r) : '';
        const name = href
          ? `<a class="name-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(r.key)}">${esc(r.key)}</a>`
          : esc(r.key);
        return `<div class="hbar"><span class="name" title="${esc(r.key)}">${name}</span><span class="track"><span class="fill" style="width:${w}%"></span></span><span class="n">${n}</span></div>`;
      }).join('');
    }
    function entryHref(row) {
      const n = String(row || '').replace(/\D/g, '');
      return n ? `/?entry=${encodeURIComponent(n)}` : '';
    }
    function sectionLabel(key) {
      if (SECTION_LABELS[key]) return SECTION_LABELS[key];
      return String(key || '').replace(/_/g, ' ') || '(none)';
    }
    function sectionHref(key) {
      const k = String(key || '');
      if (!k || CHROME_SECTIONS.has(k)) return '';
      if (k.startsWith('group_')) {
        const id = k.slice(6);
        return GROUP_KEYS[id] ? `/#${encodeURIComponent(id)}` : '';
      }
      if (CATEGORY_SET.has(k)) return `/?section=${encodeURIComponent(k)}`;
      const us = k.lastIndexOf('_');
      if (us > 0) {
        const parent = k.slice(0, us);
        const sub = k.slice(us + 1);
        if (CATEGORY_SET.has(parent) && sub) {
          return `/?section=${encodeURIComponent(parent)}&subsection=${encodeURIComponent(sub)}`;
        }
      }
      return '';
    }
    function sectionHrefFromElementId(id) {
      const raw = String(id || '');
      if (raw.startsWith('subcategory_')) return sectionHref(raw.slice('subcategory_'.length));
      if (raw.startsWith('subsection_')) return sectionHref(raw.slice('subsection_'.length));
      if (raw.startsWith('category_')) {
        const rest = raw.slice('category_'.length);
        if (GROUP_KEYS[rest]) return `/#${encodeURIComponent(rest)}`;
        return sectionHref(rest);
      }
      if (raw.startsWith('group_')) return sectionHref(raw);
      return sectionHref(raw);
    }
    function sectionLabelFromElementId(id) {
      const raw = String(id || '');
      if (raw.startsWith('subcategory_')) return sectionLabel(raw.slice('subcategory_'.length));
      if (raw.startsWith('subsection_')) return sectionLabel(raw.slice('subsection_'.length));
      if (raw.startsWith('category_')) {
        const rest = raw.slice('category_'.length);
        return GROUP_KEYS[rest] || sectionLabel(rest);
      }
      if (raw.startsWith('group_')) return sectionLabel(raw);
      return sectionLabel(raw);
    }
    function actionLabel(type) {
      return ACTION[type] || String(type || 'click');
    }

    function csvEscape(v) {

    }

    function downloadUsersCsv(users) {
      const headers = ['Email','Country','City','Gender','Qualification','License number','Organisation','Title','How they found us','Details','Email preference','Email verified','Verified at','Admin','Registered','Last access'];
      const lines = [headers.join(',')];
      for (const u of users) {
        lines.push([
          u.email,
          countryName(u.country),
          u.city,
          GENDER[u.gender] || '',
          QUAL[u.qualification] || u.qualification,
          u.licenseNumber,
          u.organization,
          u.title,
          FOUND[u.foundVia] || u.foundVia,
          u.foundViaOther,
          PREF[u.emailPreference] || u.emailPreference,
          u.emailVerified ? 'Yes' : 'No',
          u.emailVerifiedAt ? fmtDate(u.emailVerifiedAt) : '',
          u.isAdmin ? 'Yes' : 'No',
          fmtDate(u.createdAt),
          fmtDate(u.lastAccessAt)
        ].map(csvEscape).join(','));
      }
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nefesh-users.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function statusBadge(status) {
      const label = QSTATUS[status] || status;
      const cls = status === 'open' ? 'warn' : status === 'discarded' ? 'muted' : 'ok';
      return `<span class="badge ${cls}">${esc(label)}</span>`;
    }

    async function patchQuestion(id, body) {
      const r = await fetch('/api/admin/questions', {
        method: 'PATCH',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, ...body })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'נכשל');
      return data;
    }

    async function saveFaq(method, body) {
      const r = await fetch('/api/admin/faq', {
        method,
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'נכשל');
      return data;
    }

          body += `<p><button type="button" class="secondary" data-kz-more="continue" data-kz-value="${esc(result.continueToken)}">Next page</button></p>`;
        }
      } else if (result.action === 'category') {
        body = `<p class="lede" dir="auto">${esc(result.category)}</p><div dir="rtl" lang="he">` +
          (result.members || []).map((member) => {
            const sub = member.ns === 14;
            const label = String(member.title || '').replace(/^קטגוריה:/, '');
            return sub
              ? `<button type="button" class="kz-hit" data-kz-category="${esc(label)}"><b dir="auto">${esc(member.title)}</b> <span class="muted" dir="ltr">subcategory</span></button>`
              : `<button type="button" class="kz-hit" data-kz-title="${esc(member.title)}"><b dir="auto">${esc(member.title)}</b></button>`;
          }).join('') + `</div>`;
        if (result.continueToken) {
          body += `<p><button type="button" class="secondary" data-kz-more="continue" data-kz-value="${esc(result.continueToken)}">Next page</button></p>`;
        }
      } else if (result.action === 'info') {
        const cats = result.categories || [];
        body = `<p><a class="open" href="${esc(result.url)}" target="_blank" rel="noopener"><span dir="auto">${esc(result.title)}</span></a></p>
          <p class="lede">Last edited ${esc(result.touched)} · ${esc(result.length)} characters · revision ${esc(result.lastrevid)}</p>
          <div>${cats.map((name) => `<button type="button" class="secondary" data-kz-category="${esc(name)}" style="margin:0 0 8px 8px">${esc(name)}</button>`).join('') || '<span class="muted">No categories</span>'}</div>`;
      }
      return body + `<details class="chrome"><summary>Technical details</summary><p class="kz-meta">${esc(result.ms)} ms · ${esc(result.requestUrl)}</p><pre class="kz-pre">${esc(JSON.stringify(result, null, 2))}</pre></details>`;
    }
    function kzStrip(html) {
      return String(html || '')
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&amp;/gi, '&')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/&quot;/gi, '"')
        .replace(/&#0?39;/gi, "'")
        .replace(/\s+\n/g, '\n')
        .replace(/[ \t]{2,}/g, ' ')
        .trim();
    }
    function kzArticleUrl(title) {
      return 'https://www.kolzchut.org.il/he/' + encodeURIComponent(String(title || '').replace(/ /g, '_'));
    }
    function kzCap(text) {
      const value = String(text || '');
      if (value.length <= 20000) return { content: value, truncated: false };
      return { content: value.slice(0, 20000), truncated: true };
    }
    async function kzWiki(action, query) {
      const params = new URLSearchParams();
      params.set('format', 'json');
      params.set('origin', '*');
      const limit = String(Math.max(1, Math.min(20, Number(query.limit) || 10)));
      if (action === 'search') {
        params.set('action', 'query');
        params.set('list', 'search');
        params.set('srsearch', query.q);
        params.set('srlimit', limit);
        params.set('sroffset', String(Math.max(0, Number(query.offset) || 0)));
        params.set('srprop', 'snippet|size|wordcount|timestamp');
      } else if (action === 'suggest') {
        params.set('action', 'opensearch');
        params.set('search', query.q);
        params.set('limit', limit);
        params.set('namespace', '0');
      } else if (action === 'article' || action === 'section') {
        params.set('action', 'parse');
        params.set('page', query.title);
        params.set('prop', query.format === 'wikitext' ? 'wikitext' : 'text');
        params.set('disablelimitreport', 'true');
        params.set('disableeditsection', 'true');
        if (action === 'section') params.set('section', query.section);
      } else if (action === 'sections') {
        params.set('action', 'parse');
        params.set('page', query.title);
        params.set('prop', 'sections');
      } else if (action === 'categories') {
        params.set('action', 'query');
        params.set('list', 'allcategories');
        params.set('aclimit', limit);
        if (query.prefix) params.set('acprefix', query.prefix);
        if (query.continueToken) params.set('accontinue', query.continueToken);
      } else if (action === 'category') {
        let name = query.category || '';
        if (name.indexOf('Category:') === 0) name = 'קטגוריה:' + name.slice('Category:'.length);
        else if (name.indexOf('קטגוריה:') !== 0) name = 'קטגוריה:' + name;
        params.set('action', 'query');
        params.set('list', 'categorymembers');
        params.set('cmtitle', name);
        params.set('cmlimit', limit);
        params.set('cmtype', 'page|subcat');
        if (query.continueToken) params.set('cmcontinue', query.continueToken);
      } else if (action === 'info') {
        params.set('action', 'query');
        params.set('titles', query.title);
        params.set('prop', 'info|categories');
        params.set('inprop', 'url');
        params.set('cllimit', '50');
      } else {
        throw new Error('Unknown action');
      }
      const url = 'https://www.kolzchut.org.il/w/he/api.php?' + params.toString();
      const started = Date.now();
      const response = await fetch(url);
      const ms = Date.now() - started;
      if (!response.ok) throw new Error('Kol Zchut returned HTTP ' + response.status);
      const data = await response.json();
      if (data && data.error) throw new Error(data.error.info || data.error.code || 'Kol Zchut API error');
      if (action === 'search') {
        const hits = (data.query && data.query.search) || [];
        const total = (data.query && data.query.searchinfo && data.query.searchinfo.totalhits) || 0;
        const offset = Number(query.offset) || 0;
        return {
          action, requestUrl: url, ms, total, offset,
          hasMore: total > offset + hits.length,
          nextOffset: total > offset + hits.length ? offset + hits.length : null,
          results: hits.map((hit) => ({
            title: hit.title, pageid: hit.pageid, snippet: kzStrip(hit.snippet),
            wordcount: hit.wordcount, size: hit.size, timestamp: hit.timestamp, url: kzArticleUrl(hit.title)
          }))
        };
      }
      if (action === 'suggest') {
        const titles = data[1] || [];
        const descriptions = data[2] || [];
        const links = data[3] || [];
        return {
          action, requestUrl: url, ms,
          results: titles.map((title, i) => ({ title, description: kzStrip(descriptions[i] || ''), url: links[i] || kzArticleUrl(title) }))
        };
      }
      if (action === 'article' || action === 'section') {
        const raw = query.format === 'wikitext' ? (data.parse.wikitext && data.parse.wikitext['*']) : kzStrip(data.parse.text && data.parse.text['*']);
        const body = kzCap(raw);
        return {
          action, requestUrl: url, ms, title: data.parse.title, pageid: data.parse.pageid,
          url: kzArticleUrl(data.parse.title), format: query.format, section: action === 'section' ? query.section : null, ...body
        };
      }
      if (action === 'sections') {
        const rows = (data.parse && data.parse.sections) || [];
        return {
          action, requestUrl: url, ms, title: data.parse.title, pageid: data.parse.pageid, url: kzArticleUrl(data.parse.title),
          sections: rows.map((section) => ({ index: section.index, heading: kzStrip(section.line), number: section.number, level: section.level }))
        };
      }
      if (action === 'categories') {
        const rows = (data.query && data.query.allcategories) || [];
        return {
          action, requestUrl: url, ms,
          continueToken: (data.continue && data.continue.accontinue) || null,
          categories: rows.map((row) => ({ name: row['*'] || '' }))
        };
      }
      if (action === 'category') {
        const rows = (data.query && data.query.categorymembers) || [];
        return {
          action, requestUrl: url, ms, category: params.get('cmtitle'),
          continueToken: (data.continue && data.continue.cmcontinue) || null,
          members: rows.map((row) => ({ pageid: row.pageid, ns: row.ns, title: row.title, url: kzArticleUrl(row.title) }))
        };
      }
      const pages = (data.query && data.query.pages) || {};
      const page = Object.values(pages)[0];
      if (!page || page.missing != null) throw new Error('Page not found');
      return {
        action, requestUrl: url, ms, title: page.title, pageid: page.pageid, url: kzArticleUrl(page.title),
        touched: page.touched, lastrevid: page.lastrevid, length: page.length,
        categories: (page.categories || []).map((cat) => String(cat.title || '').replace(/^קטגוריה:/, ''))
      };
    }
    async function kzRun() {
      const kz = state.kz;
      kz.loading = true;
      kz.error = '';
      render();
      const query = {
        q: kz.q, title: kz.title, section: kz.section, format: kz.format,
        prefix: kz.prefix, category: kz.category, limit: kz.limit, offset: kz.offset,
        continueToken: kz.continueToken
      };
      if ((kz.action === 'search' || kz.action === 'suggest') && !String(kz.q || '').trim()) {
        kz.loading = false;
        kz.error = 'Type the words to search for.';
        render();
        return;
      }
      if ((kz.action === 'article' || kz.action === 'sections' || kz.action === 'section' || kz.action === 'info') && !String(kz.title || '').trim()) {
        kz.loading = false;
        kz.error = 'Type the exact article title.';
        render();
        return;
      }
      if (kz.action === 'category' && !String(kz.category || '').trim()) {
        kz.loading = false;
        kz.error = 'Type the category name.';
        render();
        return;
      }
      if (kz.action === 'section' && !/^\d+$/.test(String(kz.section || '').trim())) {
        kz.loading = false;
        kz.error = 'The section number must be a whole number, starting at 0.';
        render();
        return;
      }
      try {
        kz.result = await kzWiki(kz.action, query);
      } catch (error) {
        kz.result = null;
        kz.error = error && error.message ? error.message : 'Could not reach Kol Zchut.';
      }
      kz.loading = false;
      render();
    }

            ${field('format', `<label for="kz-format">Text format</label><select id="kz-format"><option value="text"${kz.format === 'text' ? ' selected' : ''}>Plain text (words only)</option><option value="wikitext"${kz.format === 'wikitext' ? ' selected' : ''}>Wikitext (keeps tables)</option></select>`)}
            ${field('prefix', `<label for="kz-prefix">Category name starts with</label><input id="kz-prefix" type="text" dir="auto" value="${esc(kz.prefix)}" placeholder="Optional">`, true)}

            ${field('limit', `<label for="kz-limit">How many results (up to 20)</label><input id="kz-limit" type="number" min="1" max="20" value="${esc(kz.limit)}">`)}
            ${field('offset', `<label for="kz-offset">Skip this many results</label><input id="kz-offset" type="number" min="0" value="${esc(kz.offset)}">`)}
          </div>
          ${kz.action === 'search' || kz.action === 'suggest' ? `<p class="dir-help">Or press an example. It fills the search and runs it.</p>
          <div class="kz-actions">
            <button type="button" class="secondary" data-kz-preset="סל שיקום">סל שיקום</button>
            <button type="button" class="secondary" data-kz-preset="קביעת נכות">קביעת נכות</button>
            <button type="button" class="secondary" data-kz-preset="גמלת סיעוד">גמלת סיעוד</button>
          </div>` : ''}

    function todayYmd() {

    }

    function contactLink(name, url) {

        : `<span dir="auto">${esc(name)}</span>`;
    }
    async function api(path, opts) {
      const init = Object.assign({ credentials: 'include' }, opts || {});
      if (init.body && typeof init.body !== 'string') {
        init.headers = { 'Content-Type': 'application/json' };
        init.body = JSON.stringify(init.body);
      }
      const r = await fetch(path, init);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `הבקשה נכשלה (${r.status})`);
      return data;
    }
    async function loadTermTitles() {
      if (state.termTitles) return;
      try {
        const r = await fetch('/directory.json');
        const data = await r.json();
        const map = {};
        (data.glossary || []).forEach((t) => { map[t.key] = t.title; });
        state.termTitles = map;
      } catch {
        state.termTitles = {};
      }
    }
    function termTitle(key) {
      return (state.termTitles && state.termTitles[key]) || key;
    }

    async function loadAudit() {
      const p = new URLSearchParams();
      const f = state.auditFilter;
      if (f.area) p.set('area', f.area);
      if (f.from) p.set('from', f.from);
      if (f.to) p.set('to', f.to);
      try {
        let entries = (await api('/api/admin/audit?' + p.toString())).entries || [];
        const row = String(f.card || '').replace(/\D/g, '');
        if (row) entries = entries.filter((e) => (e.cards || []).some((c) => String(c.rowId) === row));
        state.audit = entries;
        state.auditMsg = '';
      } catch (e) {
        state.audit = [];
        state.auditMsg = e.message;
      }
    }

          <div><label for="a-terms">מפתחות מונחים במילון (מופרדים בפסיק)</label><input id="a-terms" name="termKeys" type="text" dir="ltr" value="${esc((e.termKeys || []).join(', '))}"></div>
          <div class="full"><label for="a-mig">סקריפט מיגרציה (לא חובה)</label><input id="a-mig" name="migration" type="text" dir="ltr" value="${esc(e.migration || '')}"></div>
        </div>
        <div class="dir-actions">
          <button type="submit">שמירה</button>
          <button type="button" class="secondary" data-act="cancel-audit">ביטול</button>
        </div>
      </form>`;
    }

    function renderAudit(root) {
      const f = state.auditFilter;
      const entries = state.audit;
      const editing = state.auditEdit;
      const list = !entries
        ? '<p>טוען…</p>'
        : !entries.length
          ? '<p class="lede">אין רשומות.</p>'
          : entries.map((e) => `<article class="audit-entry">
              <div class="meta">
                <b>${esc(ymdToDmy(e.happenedAt))}</b>
                <span class="badge">${esc(AUDIT_AREAS[e.area] || e.area)}</span>
                ${e.migration ? `<span class="badge muted" dir="ltr">${esc(e.migration)}</span>` : ''}
                <button type="button" class="secondary" data-edit-audit="${esc(e.id)}" style="min-height:30px;padding:2px 10px;margin-inline-start:auto">עריכה</button>
              </div>
              <h3 dir="auto">${esc(e.title)}</h3>
              <p class="desc" dir="auto">${esc(e.description)}</p>
              ${(e.cards || []).length ? `<div class="audit-links"><span class="muted">כרטיסים:</span>${e.cards.map((c) => `<span><a class="name-link" href="#directory/${esc(c.id)}">${esc(c.rowId)} · ${esc(c.org)}</a> <a class="open" href="/?entry=${esc(c.rowId)}" target="_blank" rel="noopener">באתר</a></span>`).join('')}</div>` : ''}
              ${(e.termKeys || []).length ? `<div class="audit-links"><span class="muted">מונחים:</span>${e.termKeys.map((k) => `<a class="name-link" href="/term/${esc(k.replace(/_/g, '-'))}" target="_blank" rel="noopener">${esc(termTitle(k))}</a>`).join('')}</div>` : ''}
            </article>`).join('');
      root.appendChild(el(`<div class="he-panel">
        ${msgHtml(state.auditMsg)}
        <div class="card">
          <p class="dir-help">יומן השינויים באתר, מהחדש לישן. התיאור של כל רשומה מאושר לפני שהיא נרשמת. היומן פנימי ולא מוצג באתר.</p>
          <div class="filters">
            <div><label for="af-area">תחום</label><select id="af-area"><option value="">הכול</option>${Object.entries(AUDIT_AREAS).map(([k, v]) => `<option value="${k}"${k === f.area ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
            <div><label for="af-card">מספר שורה</label><input id="af-card" type="text" dir="ltr" value="${esc(f.card)}"></div>
            <div><label for="af-from">מתאריך</label><input id="af-from" type="date" value="${esc(f.from)}"></div>
            <div><label for="af-to">עד תאריך</label><input id="af-to" type="date" value="${esc(f.to)}"></div>
            <div><button type="button" id="af-go">סינון</button></div>
            <div><button type="button" class="secondary" id="af-new">רשומה חדשה</button></div>
          </div>
        </div>
        <div id="audit-form-slot">${editing ? auditForm(editing === 'new' ? null : (entries || []).find((e) => e.id === editing)) : ''}</div>
        ${list}
      </div>`));
      root.querySelector('#af-go').addEventListener('click', async () => {
        state.auditFilter = {
          area: root.querySelector('#af-area').value,
          card: root.querySelector('#af-card').value.trim(),
          from: root.querySelector('#af-from').value,
          to: root.querySelector('#af-to').value
        };
        await loadAudit();
        render();
      });
      root.querySelector('#af-new').addEventListener('click', () => { state.auditEdit = 'new'; render(); });
      root.querySelectorAll('[data-edit-audit]').forEach((btn) => btn.addEventListener('click', () => {
        state.auditEdit = Number(btn.getAttribute('data-edit-audit'));
        render();
        window.scrollTo(0, 0);
      }));
      const form = root.querySelector('#audit-form');
      if (!form) return;
      form.querySelector('[data-act=cancel-audit]').addEventListener('click', () => { state.auditEdit = null; render(); });
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const fd = new FormData(form);
        const list = (name) => String(fd.get(name) || '').split(/[\s,]+/).map((s) => s.trim()).filter(Boolean);
        const body = {
          happenedAt: String(fd.get('happenedAt') || ''),
          area: String(fd.get('area') || ''),
          title: String(fd.get('title') || '').trim(),
          description: String(fd.get('description') || '').trim(),
          cardRows: list('cardRows').map(Number).filter((n) => Number.isInteger(n) && n > 0),
          termKeys: list('termKeys'),
          migration: String(fd.get('migration') || '').trim()
        };
        if (state.auditEdit !== 'new') body.id = state.auditEdit;
        try {
          await api('/api/admin/audit', { method: state.auditEdit === 'new' ? 'POST' : 'PATCH', body });
          state.auditEdit = null;
          await loadAudit();
          state.auditMsg = 'נשמר.';
        } catch (e) {
          state.auditMsg = e.message;
        }
        render();
      });
    }

    async function loadVerification() {
      try {
        state.verif = await api('/api/admin/verification');
        state.verifMsg = '';
      } catch (e) {
        state.verif = { cards: [], google: { connected: false, configured: false } };
        state.verifMsg = e.message;
      }
    }

    function googleBox(google) {
      const g = google || {};
      if (g.connected) {
        return `<p>Google Contacts מחובר לחשבון <b dir="ltr">${esc(g.email)}</b> מאז ${esc(fmtDate(g.connectedAt))}.
          <button type="button" class="secondary" id="g-disconnect" style="margin-inline-start:8px">ניתוק</button></p>
          <p class="dir-help">קישורים ל-contacts.google.com נפתחים רק בחשבון הזה. מנהלים אחרים רואים את השם, הדוא״ל והטלפון שנשמרו.</p>`;
      }
      if (!g.configured) {
        return '<p class="dir-help">Google Contacts לא מוגדר בשרת (חסרים GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET או GOOGLE_TOKEN_KEY). אפשר עדיין להדביק קישור לאיש קשר או להקליד את פרטיו.</p>';
      }
      return `<p>Google Contacts לא מחובר. <a class="btn" href="/api/admin/google-connect">התחברות ל-Google Contacts</a></p>
        <p class="dir-help">החיבור מבקש הרשאת קריאה בלבד לאנשי הקשר. עד שהוא מחובר, אפשר להדביק קישור לאיש קשר או להקליד את פרטיו.</p>`;
    }

    function renderVerification(root) {
      const data = state.verif;
      if (!data) {
        root.appendChild(el('<div class="card he-panel"><p>טוען…</p></div>'));
        return;
      }
      const f = state.verifFilter;
      const cards = data.cards || [];
      const counts = [0, 1, 2, 3].map((n) => cards.filter((c) => c.level === n).length);
      const avg = cards.length ? Math.round(cards.reduce((s, c) => s + c.score, 0) / cards.length) : 0;
      const staleBefore = (() => {
        const m = Number(f.stale);
        if (!m) return '';
        const d = new Date();
        d.setMonth(d.getMonth() - m);
        return d.toISOString().slice(0, 10);
      })();
      const needle = f.q.trim().toLowerCase();
      const shown = cards.filter((c) => {
        if (needle && `${c.rowId} ${c.org} ${c.svc} ${c.verifiedBy}`.toLowerCase().indexOf(needle) === -1) return false;
        if (f.level !== '' && c.level > Number(f.level)) return false;
        if (staleBefore && c.verifiedOn && c.verifiedOn >= staleBefore) return false;
        if (f.gap && c.gaps.indexOf(f.gap) === -1) return false;
        return true;
      });
      const rows = shown.map((c) => `<tr>
          <td>${esc(c.rowId)}</td>
          <td dir="auto">${esc(c.org)}<div class="muted" dir="auto">${esc(c.svc)}</div></td>
          <td>${levelBadge(c.level)}</td>
          <td>${c.verifiedOn ? esc(ymdToDmy(c.verifiedOn)) : '<span class="muted">—</span>'}</td>
          <td>${contactLink(c.verifiedBy, c.verifiedByUrl)}</td>
          <td>${esc(c.contacts)}</td>
          <td title="${esc(c.gaps.map((g) => GAP_LABELS[g] || g).join(' · '))}">${esc(c.score)}%</td>
          <td><a class="open" href="#directory/${esc(c.id)}">פתיחה</a></td>
        </tr>`).join('');
      root.appendChild(el(`<div class="he-panel">
        ${msgHtml(state.verifMsg)}
        <div class="card">${googleBox(data.google)}</div>
        <div class="card">
          <p class="dir-help">רמת האימות הנוכחית של כל כרטיס היא האימות האחרון שנרשם. ${Object.entries(LEVELS).map(([n, t]) => `${levelBadge(n)} ${esc(t)}`).join(' · ')}</p>
          <div class="row">
            ${counts.map((n, i) => `<div class="stat"><b>${n}</b><span>${levelBadge(i)} ${esc(LEVELS[i])}</span></div>`).join('')}
            <div class="stat"><b>${avg}%</b><span>שלמות ממוצעת</span></div>
          </div>
          <div class="filters" style="margin-top:12px">
            <div class="wide"><label for="vf-q">חיפוש</label><input id="vf-q" type="text" value="${esc(f.q)}" placeholder="שם, תיאור, מספר שורה או מאמת"></div>
            <div><label for="vf-level">רמה</label><select id="vf-level">
              <option value="">הכול</option>
              <option value="0"${f.level === '0' ? ' selected' : ''}>לא אומת</option>
              <option value="1"${f.level === '1' ? ' selected' : ''}>עד רמה 1</option>
              <option value="2"${f.level === '2' ? ' selected' : ''}>עד רמה 2</option>
            </select></div>
            <div><label for="vf-stale">אומת לפני יותר מ־(חודשים)</label><input id="vf-stale" type="number" min="0" value="${esc(f.stale)}"></div>
            <div><label for="vf-gap">חסר בכרטיס</label><select id="vf-gap"><option value="">הכול</option>${Object.entries(GAP_LABELS).map(([k, v]) => `<option value="${k}"${k === f.gap ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
          </div>
          <p class="muted">${shown.length} מתוך ${cards.length} כרטיסים</p>
          <div style="overflow-x:auto">
            <table>
              <thead><tr><th>שורה</th><th>כרטיס</th><th>רמה</th><th>תאריך</th><th>אומת על ידי</th><th>אנשי קשר</th><th>שלמות</th><th></th></tr></thead>
              <tbody>${rows || '<tr><td colspan="8">אין כרטיסים שמתאימים לסינון.</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      </div>`));
      const bindFilter = (id, key, evName) => {
        const node = root.querySelector(id);
        node.addEventListener(evName, () => {
          state.verifFilter[key] = node.value;
          const pos = node.selectionStart;
          render();
          const again = document.querySelector(id);
          if (again && evName === 'input') {
            again.focus();
            if (pos != null && again.setSelectionRange) again.setSelectionRange(pos, pos);
          }
        });
      };
      bindFilter('#vf-q', 'q', 'input');
      bindFilter('#vf-level', 'level', 'change');
      bindFilter('#vf-stale', 'stale', 'change');
      bindFilter('#vf-gap', 'gap', 'change');
      const disc = root.querySelector('#g-disconnect');
      if (disc) disc.addEventListener('click', async () => {
        if (!confirm('לנתק את Google Contacts? אנשי הקשר שכבר נשמרו יישארו.')) return;
        try {
          const out = await api('/api/admin/google-connect', { method: 'DELETE' });
          state.verif.google = out.google;
          state.verifMsg = '';
        } catch (e) {
          state.verifMsg = e.message;
        }
        render();
      });
    }

    /** Search box over saved contacts and Google, with paste-a-link and type-a-name fallbacks. */
    function contactPickerHtml(prefix) {
      return `<div class="contact-picker" data-picker="${prefix}">
        <label for="${prefix}-q">חיפוש איש קשר (שם, דוא״ל, ארגון)</label>
        <input id="${prefix}-q" type="text" autocomplete="off">
        <div class="picker-results" id="${prefix}-results" hidden></div>
        <details class="chrome" style="margin-top:8px">
          <summary>הדבקת קישור או הקלדת פרטים</summary>
          <div class="dir-grid">
            <div class="full"><label for="${prefix}-url">קישור מ-contacts.google.com</label><input id="${prefix}-url" type="text" dir="ltr" placeholder="https://contacts.google.com/person/c123…"></div>
            <div><label for="${prefix}-name">שם</label><input id="${prefix}-name" type="text"></div>
            <div><label for="${prefix}-org">ארגון ותפקיד</label><input id="${prefix}-org" type="text"></div>
            <div><label for="${prefix}-email">דוא״ל</label><input id="${prefix}-email" type="text" dir="ltr"></div>
            <div><label for="${prefix}-phone">טלפון</label><input id="${prefix}-phone" type="text" dir="ltr"></div>
            <div class="full"><button type="button" class="secondary" id="${prefix}-manual">שימוש בפרטים האלה</button></div>
          </div>
        </details>
      </div>`;
    }

    function bindContactPicker(root, prefix, onPick) {
      const q = root.querySelector(`#${prefix}-q`);
      const box = root.querySelector(`#${prefix}-results`);
      let timer = null;
      let found = [];
      const show = (data) => {
        const local = data.local || [];
        const localIds = new Set(local.map((c) => c.resourceName).filter(Boolean));
        const google = (data.google || []).filter((c) => !localIds.has(c.resourceName));
        found = [...local.map((c) => ({ kind: 'local', c })), ...google.map((c) => ({ kind: 'google', c }))];
        const note = data.googleError
          ? `<p class="err" style="padding:0 10px">${esc(data.googleError)}</p>`
          : !data.connected ? '<p class="muted" style="padding:0 10px">Google Contacts לא מחובר, מוצגים רק אנשי קשר שכבר נשמרו.</p>' : '';
        box.innerHTML = note + (found.length ? found.map((item, i) => `<button type="button" class="kz-hit" data-pick="${i}">
            <b dir="auto">${esc(item.c.displayName)}</b>
            <span class="muted">${item.kind === 'google' ? ' · Google' : ' · שמור'}</span>
            <div class="muted" dir="auto">${esc([item.c.organization, item.c.email, item.c.phone].filter(Boolean).join(' · '))}</div>
          </button>`).join('') : '<p class="muted" style="padding:0 10px">אין תוצאות.</p>');
        box.hidden = false;
      };
      q.addEventListener('input', () => {
        clearTimeout(timer);
        const v = q.value.trim();
        if (v.length < 2) { box.hidden = true; return; }
        timer = setTimeout(async () => {
          try {
            show(await api('/api/admin/contacts?q=' + encodeURIComponent(v)));
          } catch (e) {
            box.innerHTML = `<p class="err" style="padding:0 10px">${esc(e.message)}</p>`;
            box.hidden = false;
          }
        }, 300);
      });
      box.addEventListener('click', (ev) => {
        const btn = ev.target.closest('[data-pick]');
        if (!btn) return;
        const item = found[Number(btn.getAttribute('data-pick'))];
        if (!item) return;
        onPick(item.kind === 'local' ? { contactId: item.c.id } : { contact: { resourceName: item.c.resourceName, displayName: item.c.displayName } });
      });
      root.querySelector(`#${prefix}-manual`).addEventListener('click', () => {
        const val = (s) => root.querySelector(`#${prefix}-${s}`).value.trim();
        const contact = { url: val('url'), displayName: val('name'), organization: val('org'), email: val('email'), phone: val('phone') };
        if (!contact.url && !contact.displayName) {
          alert('צריך קישור או שם.');
          return;
        }
        onPick({ contact });
      });
    }

    async function loadCardInternal(id) {
      const out = { verifications: null, completeness: null, contacts: null, links: null, errors: [] };
      const tasks = [
        api(`/api/admin/verification?id=${id}`).then((d) => { out.verifications = d.verifications; out.completeness = d.completeness; }),
        api(`/api/admin/card-contacts?id=${id}`).then((d) => { out.contacts = d.contacts; }),
        api(`/api/admin/glossary-links?card=${id}`).then((d) => { out.links = d.links; })
      ];
      const results = await Promise.allSettled(tasks);
      results.forEach((r) => { if (r.status === 'rejected') out.errors.push(r.reason && r.reason.message); });
      await loadTermTitles();
      state.cardInternal = { id, ...out };
    }

    function renderCardInternal(root, card) {
      const data = state.cardInternal && state.cardInternal.id === card.id ? state.cardInternal : null;
      if (!data) {
        root.appendChild(el('<div class="card he-panel"><p>טוען מידע פנימי…</p></div>'));
        return;
      }
      const vers = data.verifications || [];
      const current = vers[0];
      const contacts = data.contacts || [];
      const links = (data.links || []).filter((l) => l.status !== 'rejected');
      const comp = data.completeness;
      const termOptions = Object.entries(state.termTitles || {})
        .filter(([k]) => !links.some((l) => l.termKey === k))
        .sort((a, b) => a[1].localeCompare(b[1], 'he'))
        .map(([k, t]) => `<option value="${esc(k)}">${esc(t)}</option>`).join('');
      root.appendChild(el(`<div class="card he-panel" id="card-internal">
        <h2>פנימי — לא מוצג באתר</h2>
        ${msgHtml(state.cardInternalMsg)}
        ${data.errors.length ? `<p class="err">${esc(data.errors.join(' · '))}</p>` : ''}
        ${comp ? `<p class="dir-help">שלמות הכרטיס: <b>${esc(comp.score)}%</b>${comp.gaps.length ? ` · חסר: ${comp.gaps.map((g) => esc(g.label + (g.detail ? ` (${g.detail})` : ''))).join(' · ')}` : ''}</p>` : ''}

        <div class="internal-section">
          <h3>אימות</h3>
          <p>${current ? `${levelBadge(current.level)} ${esc(LEVELS[current.level])} · ${esc(ymdToDmy(current.verifiedOn))} · ${contactLink(current.contact && current.contact.displayName, current.contact && current.contact.contactUrl)}` : `${levelBadge(0)} ${esc(LEVELS[0])}`}</p>
          <form id="verif-form" class="dir-grid">
            <div><label for="v-level">רמה</label><select id="v-level" name="level">${Object.entries(LEVELS).map(([n, t]) => `<option value="${n}"${Number(n) === (current ? current.level : 1) ? ' selected' : ''}>${n} — ${esc(t)}</option>`).join('')}</select></div>
            <div><label for="v-date">תאריך האימות</label><input id="v-date" name="verifiedOn" type="date" max="${todayYmd()}" value="${todayYmd()}" required></div>
            <div class="full"><label for="v-contact">אומת על ידי</label><select id="v-contact" name="contactId">
              <option value="">— ללא איש קשר —</option>
              ${contacts.map((c) => `<option value="${esc(c.contact.id)}">${esc(c.contact.displayName)}${c.roleNote ? ` (${esc(c.roleNote)})` : ''}</option>`).join('')}
            </select><p class="dir-help">הרשימה היא אנשי הקשר של הכרטיס. כדי לבחור מישהו אחר, הוסיפו אותו קודם למטה.</p></div>
            <div class="full"><label for="v-note">איך אומת ומה נבדק</label><textarea id="v-note" name="methodNote" maxlength="2000" style="min-height:70px"></textarea></div>
            <div class="full"><button type="submit">רישום אימות</button></div>
          </form>
          ${vers.length ? `<details class="chrome"><summary>היסטוריה (${vers.length})</summary>${table(['תאריך', 'רמה', 'אומת על ידי', 'הערה', 'נרשם על ידי'], vers, (v) => [
            esc(ymdToDmy(v.verifiedOn)), levelBadge(v.level),
            contactLink(v.contact && v.contact.displayName, v.contact && v.contact.contactUrl),
            `<span dir="auto" style="white-space:pre-wrap">${esc(v.methodNote)}</span>`,
            `<span class="muted" dir="ltr">${esc(v.recordedBy)}</span>`
          ])}</details>` : ''}
        </div>

        <div class="internal-section">
          <h3>אנשי קשר שקשורים לכרטיס</h3>
          ${contacts.length ? contacts.map((c) => `<div class="contact-row" data-link="${esc(c.linkId)}">
              <div class="who">${contactLink(c.contact.displayName, c.contact.contactUrl)}
                <div class="muted" dir="auto">${esc([c.contact.organization, c.contact.email, c.contact.phone].filter(Boolean).join(' · '))}</div></div>
              <input type="text" name="role" value="${esc(c.roleNote)}" placeholder="תפקיד או הקשר" maxlength="500">
              <button type="button" class="secondary" data-act="save-role">שמירה</button>
              <button type="button" class="secondary" data-act="remove-contact">הסרה</button>
            </div>`).join('') : '<p class="muted">אין אנשי קשר.</p>'}
          <div style="margin-top:12px">
            <label for="cc-role">תפקיד או הקשר של איש הקשר החדש</label>
            <input id="cc-role" type="text" maxlength="500">
            ${contactPickerHtml('cc')}
          </div>
        </div>

        <div class="internal-section">
          <h3>מונחים במילון</h3>
          <p class="dir-help">מונח מאושר מופיע בכרטיס תחת «מונחים קשורים», והכרטיס מופיע בדף המונח תחת «שירותים במדריך».</p>
          <div class="chips">${links.length ? links.map((l) => `<span class="chip ${l.status === 'suggested' ? 'suggested' : ''}" title="${esc(l.matchedText)}">
              ${esc(termTitle(l.termKey))}${l.status === 'suggested' ? ' <span class="muted">(הצעה)</span>' : ''}
              ${l.status === 'suggested' ? `<button type="button" data-link-status="approved" data-link-id="${esc(l.id)}">אישור</button>` : ''}
              <button type="button" class="secondary" data-link-status="rejected" data-link-id="${esc(l.id)}">${l.status === 'suggested' ? 'דחייה' : 'הסרה'}</button>
            </span>`).join('') : '<span class="muted">אין מונחים מקושרים.</span>'}</div>
          <div class="toolbar"><select id="term-add" style="max-width:320px"><option value="">הוספת מונח…</option>${termOptions}</select><button type="button" class="secondary" id="term-add-btn">הוספה</button></div>
        </div>
      </div>`));

      const panel = root.querySelector('#card-internal');
      const refresh = async (text) => {
        await loadCardInternal(card.id);
        state.cardInternalMsg = text || '';
        render();
      };
      const fail = (e) => { state.cardInternalMsg = e.message; render(); };

      panel.querySelector('#verif-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        try {
          await api('/api/admin/verification', {
            method: 'POST',
            body: {
              cardId: card.id,
              level: Number(fd.get('level')),
              verifiedOn: String(fd.get('verifiedOn') || ''),
              contactId: fd.get('contactId') ? Number(fd.get('contactId')) : null,
              methodNote: String(fd.get('methodNote') || '').trim()
            }
          });
          state.verif = null;
          await refresh('נשמר.');
        } catch (e) { fail(e); }
      });

      panel.querySelectorAll('.contact-row').forEach((row) => {
        const linkId = Number(row.getAttribute('data-link'));
        row.querySelector('[data-act=save-role]').addEventListener('click', async () => {
          try {
            await api('/api/admin/card-contacts', { method: 'PATCH', body: { linkId, roleNote: row.querySelector('[name=role]').value.trim() } });
            await refresh('נשמר.');
          } catch (e) { fail(e); }
        });
        row.querySelector('[data-act=remove-contact]').addEventListener('click', async () => {
          if (!confirm('להסיר את איש הקשר מהכרטיס? אימותים קודמים שרשומים על שמו יישמרו.')) return;
          try {
            await fetch(`/api/admin/card-contacts?id=${linkId}`, { method: 'DELETE', credentials: 'include' }).then(async (r) => {
              if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'ההסרה נכשלה');
            });
            await refresh('עודכן.');
          } catch (e) { fail(e); }
        });
      });

      bindContactPicker(panel, 'cc', async (picked) => {
        try {
          await api('/api/admin/card-contacts', {
            method: 'POST',
            body: Object.assign({ cardId: card.id, roleNote: panel.querySelector('#cc-role').value.trim() }, picked)
          });
          state.verif = null;
          await refresh('נוסף.');
        } catch (e) { fail(e); }
      });

      panel.querySelectorAll('[data-link-status]').forEach((btn) => btn.addEventListener('click', async () => {
        try {
          await api('/api/admin/glossary-links', { method: 'PATCH', body: { id: Number(btn.getAttribute('data-link-id')), status: btn.getAttribute('data-link-status') } });
          state.glossLinks = null;
          await refresh('עודכן.');
        } catch (e) { fail(e); }
      }));
      panel.querySelector('#term-add-btn').addEventListener('click', async () => {
        const termKey = panel.querySelector('#term-add').value;
        if (!termKey) return;
        try {
          await api('/api/admin/glossary-links', { method: 'POST', body: { termKey, cardId: card.id } });
          state.glossLinks = null;
          await refresh('נוסף.');
        } catch (e) { fail(e); }
      });
    }

    async function loadGlossaryLinks() {
      await loadTermTitles();
      try {
        state.glossLinks = (await api('/api/admin/glossary-links?status=' + encodeURIComponent(state.glossStatus))).links || [];
        state.glossMsg = '';
      } catch (e) {
        state.glossLinks = [];
        state.glossMsg = e.message;
      }
    }

    function renderGlossary(root) {
      const links = state.glossLinks;
      const statusLabels = { suggested: 'הצעות לאישור', approved: 'מאושרים', rejected: 'נדחו' };
      const byTerm = new Map();
      (links || []).forEach((l) => {
        if (!byTerm.has(l.termKey)) byTerm.set(l.termKey, []);
        byTerm.get(l.termKey).push(l);
      });
      const groups = [...byTerm.entries()].sort((a, b) => termTitle(a[0]).localeCompare(termTitle(b[0]), 'he'));
      const actions = state.glossStatus === 'suggested'
        ? [['approved', 'אישור'], ['rejected', 'דחייה']]
        : state.glossStatus === 'approved' ? [['rejected', 'הסרה']] : [['approved', 'אישור'], ['suggested', 'החזרה להצעות']];
      root.appendChild(el(`<div class="he-panel">
        ${msgHtml(state.glossMsg)}
        <div class="card">
          <p class="dir-help">קישורים בין מונחים במילון לכרטיסים. ההצעות נוצרות מהתאמת שם המונח וכינוייו לטקסט של הכרטיס. רק קישור מאושר מופיע באתר, בכרטיס ובדף המונח.</p>
          <div class="status-filters">${Object.entries(statusLabels).map(([k, v]) => `<button type="button" class="${k === state.glossStatus ? '' : 'secondary'}" data-gstatus="${k}">${esc(v)}</button>`).join('')}</div>
          ${links == null ? '<p>טוען…</p>' : !links.length ? '<p class="lede">אין קישורים במצב הזה.</p>' : `<p class="muted">${links.length} קישורים, ${groups.length} מונחים</p>
            <div class="toolbar">${actions.map(([s, t]) => `<button type="button" class="secondary" data-bulk="${s}">${esc(t)} למסומנים</button>`).join('')}
              <label class="dir-check"><input type="checkbox" id="g-all"> סימון הכול</label></div>`}
        </div>
        ${groups.map(([key, list]) => `<div class="card gloss-term">
          <h3><label class="dir-check" style="margin:0"><input type="checkbox" data-term-all="${esc(key)}"></label>${esc(termTitle(key))} <span class="badge muted" dir="ltr">${esc(key)}</span> <span class="muted">${list.length}</span></h3>
          ${list.map((l) => `<div class="contact-row">
            <label class="dir-check who" style="margin:0"><input type="checkbox" data-gid="${esc(l.id)}" data-gterm="${esc(key)}">
              <span><a class="name-link" href="#directory/${esc(l.card.id)}">${esc(l.card.rowId)} · ${esc(l.card.org)}</a> <span class="muted" dir="auto">${esc(l.card.svc)}</span>
              ${l.matchedText ? `<div class="muted" dir="auto">«${esc(l.matchedText)}»</div>` : ''}</span></label>
            ${actions.map(([s, t]) => `<button type="button" class="secondary" data-gone="${s}" data-gid-one="${esc(l.id)}">${esc(t)}</button>`).join('')}
          </div>`).join('')}
        </div>`).join('')}
      </div>`));
      const setStatus = async (ids, status) => {
        if (!ids.length) return;
        try {
          await api('/api/admin/glossary-links', { method: 'PATCH', body: { ids, status } });
          await loadGlossaryLinks();
          state.glossMsg = 'עודכן.';
        } catch (e) {
          state.glossMsg = e.message;
        }
        render();
      };
      root.querySelectorAll('[data-gstatus]').forEach((btn) => btn.addEventListener('click', async () => {
        state.glossStatus = btn.getAttribute('data-gstatus');
        state.glossLinks = null;
        render();
        await loadGlossaryLinks();
        render();
      }));
      const all = root.querySelector('#g-all');
      if (all) all.addEventListener('change', () => root.querySelectorAll('[data-gid], [data-term-all]').forEach((c) => { c.checked = all.checked; }));
      root.querySelectorAll('[data-term-all]').forEach((box) => box.addEventListener('change', () => {
        root.querySelectorAll(`[data-gterm="${box.getAttribute('data-term-all')}"]`).forEach((c) => { c.checked = box.checked; });
      }));
      root.querySelectorAll('[data-bulk]').forEach((btn) => btn.addEventListener('click', () => {
        const ids = Array.from(root.querySelectorAll('[data-gid]:checked')).map((c) => Number(c.getAttribute('data-gid')));
        setStatus(ids, btn.getAttribute('data-bulk'));
      }));
      root.querySelectorAll('[data-gone]').forEach((btn) => btn.addEventListener('click', () => {
        setStatus([Number(btn.getAttribute('data-gid-one'))], btn.getAttribute('data-gone'));
      }));
    }

    async function loadTab(tab) {
      if (tab === 'audit' && !state.audit) {
        await loadTermTitles();
        await loadAudit();
      }
      if (tab === 'verification' && !state.verif) await loadVerification();
      if (tab === 'glossary' && !state.glossLinks) await loadGlossaryLinks();
    }

    function render() {
      if (!state.user) {
        renderGate('Sign in on the directory first, then come back here. This page is for operators only.');
        return;
      }
      if (!state.user.isAdmin) {
        renderGate('You do not have access.');
        return;
      }
      if (state.user.passwordActionRequired || state.user.profileComplete === false) {
        renderGate('Finish signing in on the directory (complete your profile or change your password), then return here.');
        return;
      }
      if (state.error && !state.analytics && (state.tab === 'analytics' || state.tab === 'updates')) {
        renderGate(state.error);
        return;
      }
      if (state.error && !state.users && state.tab === 'users') {
        renderGate(state.error);
        return;
      }
      if (state.error && state.questions == null && state.tab === 'questions') {
        renderGate(state.error);
        return;
      }
      if (state.error && state.directoryCards == null && state.tab === 'directory') {
        renderGate(state.error);
        return;
      }

      app.innerHTML = '';
      const wrap = el(`<div>
        <div class="toolbar">
          <a class="back" href="/">Back to the directory</a>
          <span class="muted">${esc(state.user.email)}</span>
        </div>
        <h1>Admin</h1>
        <div class="tabs" role="tablist">
          ${[
            ['analytics', 'Analytics'],
            ['users', 'Registered users'],
            ['questions', 'שאלות נפוצות'],
            ['updates', 'פרסום עדכונים'],
            ['directory', 'כרטיסי מדריך'],
            ['verification', 'אימות כרטיסים'],
            ['glossary', 'קישורי מילון'],
            ['audit', 'יומן שינויים'],
            ['kolzchut', 'כל זכות']
          ].map(([id, label]) => {
            const on = state.tab === id;
            return `<button type="button" role="tab" data-tab="${id}" aria-selected="${on ? 'true' : 'false'}" class="${on ? 'active' : ''}">${label}</button>`;
          }).join('')}
        </div>
        <div id="tabbody"></div>
      </div>`);
      app.appendChild(wrap);
      wrap.querySelectorAll('.tabs button').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const tab = btn.getAttribute('data-tab');
          if (tab === 'directory') {
            state.directoryId = null;
            state.directoryCard = null;
            state.directoryMsg = '';
          }
          setTab(tab);
          if (tab === 'users' && !state.users) await loadUsers();
          if ((tab === 'analytics' || tab === 'updates') && !state.analytics) await loadAnalytics();
          if (tab === 'questions') {
            if (!state.questions) await loadQuestions();
            if (!state.faq) await loadFaqAdmin();
          }
          if (tab === 'directory' && !state.directoryCards) await loadDirectoryList();
          await loadTab(tab);
          render();
        });
      });
      const body = wrap.querySelector('#tabbody');
      if (state.tab === 'audit') renderAudit(body);
      else if (state.tab === 'verification') renderVerification(body);
      else if (state.tab === 'glossary') renderGlossary(body);
      else if (state.tab === 'users') renderUsers(body);
      else if (state.tab === 'questions') renderQuestions(body);
      else if (state.tab === 'updates') renderUpdates(body);
      else if (state.tab === 'directory') renderDirectory(body);
      else if (state.tab === 'kolzchut') renderKolzchut(body);
      else renderAnalytics(body);
    }

    window.addEventListener('hashchange', async () => {
      const next = hashToTab();
      const nextId = next === 'directory' ? directoryIdFromHash() : null;
      if (next === state.tab && nextId === state.directoryId) return;
      state.tab = next;
      state.directoryId = nextId;
      if (next === 'users' && !state.users) await loadUsers();
      if ((next === 'analytics' || next === 'updates') && !state.analytics) await loadAnalytics();
      if (next === 'questions') {
        if (!state.questions) await loadQuestions();
        if (!state.faq) await loadFaqAdmin();
      }
      if (next === 'directory') {
        if (!state.directoryCards) await loadDirectoryList();
        if (nextId) await loadDirectoryCard(nextId);
        else state.directoryCard = null;
      }
      await loadTab(next);
      render();
    });

    (async () => {
      try {
        await loadSession();
        if (state.user && state.user.isAdmin) {
          if (state.tab === 'users') await loadUsers();
          else if (state.tab === 'questions') {
            await loadQuestions();
            await loadFaqAdmin();
          } else if (state.tab === 'directory') await loadDirectory();
          else if (['audit', 'verification', 'glossary'].includes(state.tab)) await loadTab(state.tab);
          else await loadAnalytics();
          const googleResult = new URLSearchParams(location.search).get('google');
          if (googleResult && GOOGLE_RESULT[googleResult]) {
            state.verifMsg = GOOGLE_RESULT[googleResult][1];
            history.replaceState(null, '', location.pathname + location.hash);
          }
        }
        render();
      } catch (e) {
        renderGate('Could not reach the server.');
      }
    })();
  </script>
</body>
</html>
