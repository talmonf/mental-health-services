<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אדמין — מדריך נפש</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://nefesh-il.org/admin">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2d5a7b;
      --primary-dark: #1e3f5a;
      --text: #333;
      --muted: #5a5a5a;
      --border: #e0e0e0;
      --bg: #f0f2f5;
      --card: #fff;
      --warn: #c47a12;
      --pv: #2d5a7b;
      --search: #3d8b6e;
      --click: #c47a12;
      --other: #8a7a9a;
    }
    body { margin: 0; font-family: Heebo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; color: var(--primary-dark); margin: 0 0 8px; }
    h2 { font-size: 1.15rem; color: var(--primary); margin: 28px 0 12px; }
    h3 { font-size: 0.95rem; color: var(--primary-dark); margin: 16px 0 8px; }
    p.lede { color: var(--muted); margin: 0 0 16px; }
    .card { background: var(--card); border-radius: 10px; padding: 16px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.07); margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.02em; white-space: nowrap; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat { flex: 1 1 140px; background: #eef4f8; border-radius: 8px; padding: 12px 14px; }
    .stat b { display: block; font-size: 1.4rem; color: var(--primary-dark); }
    .stat span { color: var(--muted); font-size: 0.85rem; }
    label { display: block; font-weight: 600; margin: 0 0 6px; font-size: 0.82rem; color: var(--muted); }
    input[type=text], input[type=date], textarea, select {
      width: 100%; box-sizing: border-box; padding: 8px 10px; border: 2px solid var(--border);
      border-radius: 8px; font: inherit; background: #fff;
    }
    textarea { min-height: 120px; }
    button, .btn {
      display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px;
      border: none; border-radius: 8px; background: var(--primary); color: #fff; font: inherit; font-weight: 600;
      cursor: pointer; text-decoration: none;
    }
    button.secondary { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .err { color: #c0392b; }
    .ok { color: #1e7a4a; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    a.back { color: var(--primary); text-decoration: none; font-weight: 600; }
    .gate { max-width: 480px; margin: 80px auto; background: var(--card); padding: 32px; border-radius: 10px; text-align: center; }
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tabs button {
      background: transparent; color: var(--muted); border: none; border-radius: 8px 8px 0 0;
      min-height: 44px; font-weight: 600;
    }
    .tabs button.active { color: var(--primary-dark); background: #eef4f8; }
    .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; align-items: end; }
    .filters .wide { grid-column: span 2; }
    .chart { display: flex; align-items: flex-end; gap: 6px; min-height: 140px; overflow-x: auto; padding: 8px 0 0; }
    .chart-col { flex: 1 0 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 22px; }
    .chart-stack { width: 100%; display: flex; flex-direction: column-reverse; height: 120px; border-radius: 4px 4px 0 0; overflow: hidden; background: #eef2f5; }
    .chart-seg { width: 100%; }
    .chart-seg.pv { background: var(--pv); }
    .chart-seg.search { background: var(--search); }
    .chart-seg.click { background: var(--click); }
    .chart-seg.other { background: var(--other); }
    .chart-label { font-size: 0.65rem; color: var(--muted); writing-mode: horizontal-tb; transform: none; white-space: nowrap; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-left: 6px; }
    .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .hbar { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.85rem; }
    .hbar .name { flex: 0 0 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar .track { flex: 1; height: 10px; background: #eef2f5; border-radius: 6px; overflow: hidden; }
    .hbar .fill { height: 100%; background: var(--primary); }
    .hbar .n { flex: 0 0 2.5rem; color: var(--muted); text-align: left; }
    .users-table-wrap { overflow-x: auto; }
    .users-table-wrap table { min-width: 1240px; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: #eef4f8; color: var(--primary-dark); }
    .badge.warn { background: #fdf3e7; color: #8a5a12; }
    .badge.ok { background: #e7f6ee; color: #1e7a4a; }
    .badge.muted { background: #eef2f5; color: var(--muted); }
    .muted { color: var(--muted); }
    .qcard { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; background: #fff; }
    .qcard .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 0.85rem; }
    .qcard .qtext { white-space: pre-wrap; margin: 0 0 12px; }
    .qcard .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .qcard .publish { background: #eef4f8; border-radius: 8px; padding: 12px; }
    .faq-edit { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .faq-edit .row-end { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .status-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    @media (max-width: 700px) {
      .filters .wide { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <main id="app">טוען…</main>
  <script>
    const QUAL = {
      social_worker: 'עובד/ת סוציאלי/ת',
      psychologist: 'פסיכולוג/ית',
      psychiatrist: 'פסיכיאטר/ית',
      therapist: 'מטפל/ת / יועץ/ת',
      nurse: 'אח/ות',
      peer_supporter: 'עמית/ת תומך/ת',
      student: 'סטודנט/ית',
      family_self: 'בן/בת משפחה או מתמודד/ת',
      other: 'אחר'
    };
    const FOUND = {
      google: 'גוגל',
      facebook_instagram: 'פייסבוק / אינסטגרם',
      whatsapp: 'וואטסאפ',
      colleague: 'עמית/ה לעבודה',
      university: 'לימודים / הכשרה',
      organization: 'הארגון שבו אני עובד/ת',
      media: 'תקשורת',
      other: 'אחר'
    };
    const PREF = { none: 'בלי עדכונים', weekly: 'סיכום שבועי', immediate: 'כשזה קורה' };
    const DEVICE = { mobile: 'נייד', desktop: 'מחשב', tablet: 'טאבלט' };
    const DEEP = {
      search_link_copied: 'העתקת קישור חיפוש',
      card_link_copied: 'העתקת קישור כרטיס',
      section_link_copied: 'העתקת קישור מדור',
      search_link_opened: 'פתיחת קישור חיפוש',
      card_link_opened: 'פתיחת קישור כרטיס',
      section_link_opened: 'פתיחת קישור מדור'
    };

    const QSTATUS = {
      open: 'פתוחה',
      answered: 'טופלה',
      published: 'פורסמה לשאלות נפוצות',
      discarded: 'התעלמו'
    };

    const app = document.getElementById('app');
    function hashToTab() {
      const h = (location.hash || '').replace(/^#/, '');
      if (h === 'users' || h === 'questions') return h;
      return 'analytics';
    }
    const state = {
      user: null,
      tab: hashToTab(),
      analytics: null,
      users: null,
      accounts: null,
      questions: null,
      faq: null,
      questionStatus: 'open',
      questionMsg: '',
      faqMsg: '',
      days: 30,
      from: '',
      to: '',
      eventType: '',
      device: '',
      audience: '',
      country: '',
      section: '',
      userQ: '',
      userSort: 'created_at',
      userDir: 'desc',
      error: '',
      loading: false
    };

    function el(html) {
      const d = document.createElement('div');
      d.innerHTML = html.trim();
      return d.firstElementChild;
    }
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function fmtDate(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return esc(String(v).slice(0, 16));
      return d.toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
    }
    function fmtDay(v) {
      const s = String(v || '').slice(0, 10);
      if (!s) return '';
      const [y, m, d] = s.split('-');
      return `${d}.${m}`;
    }
    function table(headers, rows, cells) {
      if (!rows || !rows.length) return '<p class="lede">אין נתונים בחלון זה.</p>';
      return `<table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
        rows.map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')
      }</tbody></table>`;
    }
    function hbars(rows) {
      if (!rows || !rows.length) return '<p class="lede">אין נתונים בחלון זה.</p>';
      const max = Math.max(...rows.map((r) => Number(r.n) || 0), 1);
      return rows.map((r) => {
        const n = Number(r.n) || 0;
        const w = Math.round((n / max) * 100);
        return `<div class="hbar"><span class="name" title="${esc(r.key)}">${esc(r.key)}</span><span class="track"><span class="fill" style="width:${w}%"></span></span><span class="n">${n}</span></div>`;
      }).join('');
    }

    async function loadSession() {
      try {
        const r = await fetch('/api/auth/session', { credentials: 'include' });
        const data = await r.json().catch(() => ({}));
        state.user = data.user || null;
      } catch {
        state.user = null;
      }
    }

    function analyticsQuery() {
      const p = new URLSearchParams();
      if (state.from && state.to) {
        p.set('from', state.from);
        p.set('to', state.to);
      } else {
        p.set('days', String(state.days));
      }
      if (state.eventType) p.set('event_type', state.eventType);
      if (state.device) p.set('device', state.device);
      if (state.audience) p.set('audience', state.audience);
      if (state.country) p.set('country', state.country);
      if (state.section) p.set('section', state.section);
      return p.toString();
    }

    async function loadAnalytics() {
      const r = await fetch('/api/admin/analytics?' + analyticsQuery(), { credentials: 'include' });
      if (r.status === 401 || r.status === 403) {
        state.error = r.status === 401 ? 'יש להיכנס לחשבון באתר הראשי תחילה.' : 'אין הרשאה.';
        state.analytics = null;
        return;
      }
      if (!r.ok) {
        state.error = 'טעינת האנליטיקה נכשלה.';
        return;
      }
      state.error = '';
      state.analytics = await r.json();
    }

    async function loadUsers() {
      const p = new URLSearchParams();
      if (state.userQ) p.set('q', state.userQ);
      p.set('sort', state.userSort);
      p.set('dir', state.userDir);
      const r = await fetch('/api/admin/users?' + p.toString(), { credentials: 'include' });
      if (r.status === 401 || r.status === 403) {
        state.error = r.status === 401 ? 'יש להיכנס לחשבון באתר הראשי תחילה.' : 'אין הרשאה.';
        state.users = null;
        return;
      }
      if (!r.ok) {
        state.error = 'טעינת המשתמשים נכשלה.';
        return;
      }
      state.error = '';
      const data = await r.json();
      state.users = data.users || [];
      state.accounts = data.accounts || null;
    }

    async function loadQuestions() {
      const p = new URLSearchParams();
      if (state.questionStatus) p.set('status', state.questionStatus);
      const r = await fetch('/api/admin/questions?' + p.toString(), { credentials: 'include' });
      if (r.status === 401 || r.status === 403) {
        state.error = r.status === 401 ? 'יש להיכנס לחשבון באתר הראשי תחילה.' : 'אין הרשאה.';
        state.questions = null;
        return;
      }
      if (!r.ok) {
        state.error = 'טעינת השאלות נכשלה.';
        return;
      }
      state.error = '';
      const data = await r.json();
      state.questions = data.questions || [];
    }

    async function loadFaqAdmin() {
      const r = await fetch('/api/admin/faq', { credentials: 'include' });
      if (r.status === 401 || r.status === 403) {
        state.error = r.status === 401 ? 'יש להיכנס לחשבון באתר הראשי תחילה.' : 'אין הרשאה.';
        state.faq = null;
        return;
      }
      if (!r.ok) {
        state.error = 'טעינת השאלות הנפוצות נכשלה.';
        return;
      }
      state.error = '';
      const data = await r.json();
      state.faq = data.items || [];
    }

    function renderGate(message) {
      app.innerHTML = '';
      app.appendChild(el(`<div class="gate">
        <h1>אדמין</h1>
        <p class="lede">${esc(message)}</p>
        <p><a class="back" href="/">חזרה למדריך</a></p>
      </div>`));
    }

    function setTab(tab) {
      state.tab = tab;
      location.hash = tab;
    }

    function barChart(rows) {
      if (!rows || !rows.length) return '<p class="lede">אין נתונים בחלון זה.</p>';
      const max = Math.max(...rows.map((r) => Number(r.total) || ((Number(r.page_view)||0)+(Number(r.search)||0)+(Number(r.click)||0)+(Number(r.other)||0))), 1);
      const cols = rows.map((r) => {
        const pv = Number(r.page_view) || 0;
        const se = Number(r.search) || 0;
        const cl = Number(r.click) || 0;
        const ot = Number(r.other) || 0;
        const total = Number(r.total) || (pv + se + cl + ot);
        const scale = 120 / max;
        return `<div class="chart-col" title="${esc(fmtDay(r.day))}: ${total}">
          <div class="chart-stack">
            <div class="chart-seg pv" style="height:${pv * scale}px"></div>
            <div class="chart-seg search" style="height:${se * scale}px"></div>
            <div class="chart-seg click" style="height:${cl * scale}px"></div>
            <div class="chart-seg other" style="height:${ot * scale}px"></div>
          </div>
          <span class="chart-label">${esc(fmtDay(r.day))}</span>
        </div>`;
      }).join('');
      return `<div class="chart">${cols}</div>
        <div class="legend">
          <span><i style="background:var(--pv)"></i>צפיות</span>
          <span><i style="background:var(--search)"></i>חיפושים</span>
          <span><i style="background:var(--click)"></i>לחיצות</span>
          <span><i style="background:var(--other)"></i>אחר</span>
        </div>`;
    }

    function optionList(values, current, blank) {
      return `<option value="">${esc(blank)}</option>` + (values || []).map((v) =>
        `<option value="${esc(v)}"${v === current ? ' selected' : ''}>${esc(v)}</option>`
      ).join('');
    }

    function renderAnalytics(root) {
      const d = state.analytics || {};
      const k = d.kpis || {};
      const si = d.signedIn || {};
      const rl = d.requestLog;
      const opts = d.filterOptions || { countries: [], sections: [] };
      const totalEvents = Number(k.total) || 0;
      const signedShare = totalEvents ? Math.round((Number(si.signed_in_events) || 0) / totalEvents * 100) : 0;

      root.innerHTML = `
        <div class="card">
          <form id="filters" class="filters">
            <div>
              <label for="days">חלון</label>
              <select id="days">
                <option value="7">7 ימים</option>
                <option value="30">30 ימים</option>
                <option value="90">90 ימים</option>
              </select>
            </div>
            <div>
              <label for="from">מתאריך</label>
              <input id="from" type="date" value="${esc(state.from)}">
            </div>
            <div>
              <label for="to">עד תאריך</label>
              <input id="to" type="date" value="${esc(state.to)}">
            </div>
            <div>
              <label for="eventType">סוג אירוע</label>
              <select id="eventType">
                <option value="">הכל</option>
                <option value="page_view">צפיות</option>
                <option value="search">חיפושים</option>
                <option value="click">לחיצות</option>
                <option value="deep-link">קישורים עמוקים</option>
              </select>
            </div>
            <div>
              <label for="device">מכשיר</label>
              <select id="device">
                <option value="">הכל</option>
                <option value="mobile">נייד</option>
                <option value="desktop">מחשב</option>
                <option value="tablet">טאבלט</option>
              </select>
            </div>
            <div>
              <label for="audience">קהל</label>
              <select id="audience">
                <option value="">הכל</option>
                <option value="signed-in">מחוברים</option>
                <option value="anonymous">אנונימיים</option>
              </select>
            </div>
            <div>
              <label for="country">מדינה (אירוע)</label>
              <select id="country">${optionList(opts.countries, state.country, 'הכל')}</select>
            </div>
            <div>
              <label for="section">מדור</label>
              <select id="section">${optionList(opts.sections, state.section, 'הכל')}</select>
            </div>
            <div>
              <label>&nbsp;</label>
              <button type="submit">סינון</button>
            </div>
          </form>
        </div>
        ${state.error ? `<p class="err">${esc(state.error)}</p>` : ''}
        <div class="row" id="stats">
          <div class="stat"><b>${k.page_view || 0}</b><span>צפיות בדף</span></div>
          <div class="stat"><b>${k.unique_sessions || 0}</b><span>סשנים ייחודיים</span></div>
          <div class="stat"><b>${k.search || 0}</b><span>חיפושים</span></div>
          <div class="stat"><b>${k.click || 0}</b><span>לחיצות</span></div>
          <div class="stat"><b>${signedShare}%</b><span>מחוברים (${si.signed_in_events || 0} / ${si.anonymous_events || 0} אנונימי)</span></div>
          ${rl ? `<div class="stat"><b>${rl.bot}</b><span>שליפות בוט</span></div>
                  <div class="stat"><b>${rl.estimated_human}</b><span>שליפות אנושיות (הערכה)</span></div>` : ''}
        </div>
        <h2>נפח יומי</h2>
        <div class="card" id="volume">${barChart(d.volume)}</div>
        <div class="split">
          <div>
            <h2>מכשיר</h2>
            <div class="card">${hbars((d.byDevice || []).map((r) => ({ key: DEVICE[r.key] || r.key, n: r.n })))}</div>
          </div>
          <div>
            <h2>מדינה</h2>
            <div class="card">${hbars(d.byCountry)}</div>
          </div>
          <div>
            <h2>מדור</h2>
            <div class="card">${hbars(d.bySection)}</div>
          </div>
        </div>
        <h2>לחיצות על כרטיסים / רכיבים</h2>
        <div class="card">${table(
          ['כניסה', 'רכיב', 'סוג', 'כמות'],
          d.topClicks,
          (r) => [esc(r.entry_id), esc(r.element_id), esc(r.element_type), r.n]
        )}</div>
        <h2>חיפושים נפוצים (לפחות 3)</h2>
        <div class="card">${table(
          ['שאילתה', 'כמות'],
          d.topSearches,
          (r) => [esc(r.search_query), r.n]
        )}</div>
        <h2>קישורים עמוקים</h2>
        <div class="card">${table(
          ['אירוע', 'כמות'],
          d.deepLinks,
          (r) => [esc(DEEP[r.event_type] || r.event_type), r.n]
        )}</div>
        <h2>פרסום עדכון באתר</h2>
        <div class="card">
          <p class="lede">מנויי «כשזה קורה» מקבלים מיד. מנויי הסיכום השבועי מקבלים ביום ראשון. כלום לא נשלח לפני אישור הכתובת.</p>
          <form id="pub">
            <label for="title">כותרת</label>
            <input id="title" name="title" type="text" required maxlength="200">
            <label for="body">מה השתנה</label>
            <textarea id="body" name="body" required maxlength="8000"></textarea>
            <p id="pubmsg"></p>
            <button type="submit">פרסום ותור למיילים</button>
          </form>
          <h3>עדכונים אחרונים</h3>
          ${table(['מתי', 'כותרת'], d.recentUpdates, (r) => [esc(fmtDate(r.published_at)), esc(r.title)])}
        </div>
      `;

      root.querySelector('#days').value = String(state.days);
      root.querySelector('#eventType').value = state.eventType;
      root.querySelector('#device').value = state.device;
      root.querySelector('#audience').value = state.audience;

      root.querySelector('#filters').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const from = root.querySelector('#from').value;
        const to = root.querySelector('#to').value;
        state.from = from;
        state.to = to;
        if (!(from && to)) state.days = Number(root.querySelector('#days').value) || 30;
        state.eventType = root.querySelector('#eventType').value;
        state.device = root.querySelector('#device').value;
        state.audience = root.querySelector('#audience').value;
        state.country = root.querySelector('#country').value;
        state.section = root.querySelector('#section').value;
        await loadAnalytics();
        render();
      });
      root.querySelector('#days').addEventListener('change', async () => {
        state.days = Number(root.querySelector('#days').value) || 30;
        state.from = '';
        state.to = '';
        await loadAnalytics();
        render();
      });

      const pub = root.querySelector('#pub');
      pub.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const msg = root.querySelector('#pubmsg');
        const btn = pub.querySelector('button');
        btn.disabled = true;
        msg.textContent = 'מפרסמים…';
        msg.className = '';
        try {
          const r = await fetch('/api/admin/updates', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: root.querySelector('#title').value,
              body: root.querySelector('#body').value
            })
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data.error || 'נכשל');
          msg.className = 'ok';
          msg.textContent = `פורסם. בתור מיידי: ${data.queued || 0}. נשלחו: ${data.send?.sent ?? 0}.`;
          root.querySelector('#title').value = '';
          root.querySelector('#body').value = '';
          await loadAnalytics();
          render();
        } catch (e) {
          msg.className = 'err';
          msg.textContent = e.message || 'נכשל';
          btn.disabled = false;
        }
      });
    }

    function csvEscape(v) {
      const s = String(v == null ? '' : v);
      if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
      return s;
    }

    function downloadUsersCsv(users) {
      const headers = ['אימייל','מדינה','עיר','הכשרה','מספר רישוי','ארגון','תפקיד','איך הגיעו','פירוט','העדפת מייל','אימות אימייל','תאריך אימות','מנהל','תאריך הרשמה','כניסה אחרונה'];
      const lines = [headers.join(',')];
      for (const u of users) {
        lines.push([
          u.email,
          u.country,
          u.city,
          QUAL[u.qualification] || u.qualification,
          u.licenseNumber,
          u.organization,
          u.title,
          FOUND[u.foundVia] || u.foundVia,
          u.foundViaOther,
          PREF[u.emailPreference] || u.emailPreference,
          u.emailVerified ? 'אומת' : 'לא אומת',
          u.emailVerifiedAt ? fmtDate(u.emailVerifiedAt) : '',
          u.isAdmin ? 'כן' : 'לא',
          fmtDate(u.createdAt),
          fmtDate(u.lastAccessAt)
        ].map(csvEscape).join(','));
      }
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nefesh-users.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function renderUsers(root) {
      const users = state.users || [];
      const acc = state.accounts || {};
      const unverified = Math.max(0, (acc.total || 0) - (acc.verified || 0));
      root.innerHTML = `
        <div class="row" style="margin-bottom:16px">
          <div class="stat"><b>${acc.total || users.length}</b><span>חשבונות</span></div>
          <div class="stat"><b>${acc.verified || 0}</b><span>אומתו</span></div>
          <div class="stat"><b>${unverified}</b><span>ממתינים לאישור</span></div>
        </div>
        <div class="card">
          <form id="userfilters" class="filters">
            <div class="wide">
              <label for="userQ">חיפוש (אימייל, ארגון, תפקיד, עיר, מספר רישוי)</label>
              <input id="userQ" type="text" value="${esc(state.userQ)}" placeholder="חיפוש…">
            </div>
            <div>
              <label for="userSort">מיון</label>
              <select id="userSort">
                <option value="created_at">תאריך הרשמה</option>
                <option value="last_access_at">כניסה אחרונה</option>
                <option value="email_verified_at">אימות אימייל</option>
                <option value="email">אימייל</option>
              </select>
            </div>
            <div>
              <label for="userDir">כיוון</label>
              <select id="userDir">
                <option value="desc">יורד</option>
                <option value="asc">עולה</option>
              </select>
            </div>
            <div>
              <label>&nbsp;</label>
              <button type="submit">סינון</button>
            </div>
            <div>
              <label>&nbsp;</label>
              <button type="button" class="secondary" id="csv">הורדת CSV</button>
            </div>
          </form>
        </div>
        ${state.error ? `<p class="err">${esc(state.error)}</p>` : ''}
        <div class="card users-table-wrap">${
          table(
            ['אימייל','מדינה','עיר','הכשרה','מספר רישוי','ארגון','תפקיד','איך הגיעו','העדפת מייל','אימות אימייל','הרשמה','כניסה אחרונה'],
            users,
            (u) => [
              `${esc(u.email)}${u.isAdmin ? ' <span class="badge">מנהל</span>' : ''}`,
              esc(u.country),
              esc(u.city || ''),
              esc(QUAL[u.qualification] || u.qualification),
              esc(u.licenseNumber || ''),
              esc(u.organization),
              esc(u.title),
              esc((FOUND[u.foundVia] || u.foundVia) + (u.foundViaOther ? ` (${u.foundViaOther})` : '')),
              esc(PREF[u.emailPreference] || u.emailPreference),
              u.emailVerified
                ? `<span class="badge ok">אומת</span>${u.emailVerifiedAt ? `<div class="muted">${esc(fmtDate(u.emailVerifiedAt))}</div>` : ''}`
                : '<span class="badge warn">לא אומת</span>',
              esc(fmtDate(u.createdAt)),
              esc(fmtDate(u.lastAccessAt))
            ]
          )
        }</div>
        <div class="split">
          <div>
            <h2>הכשרה</h2>
            <div class="card">${hbars((acc.byQualification || []).map((r) => ({ key: QUAL[r.key] || r.key, n: r.n })))}</div>
          </div>
          <div>
            <h2>איך הגיעו</h2>
            <div class="card">${hbars((acc.byFoundVia || []).map((r) => ({ key: FOUND[r.key] || r.key, n: r.n })))}</div>
          </div>
          <div>
            <h2>מדינה</h2>
            <div class="card">${hbars(acc.byCountry)}</div>
          </div>
          <div>
            <h2>העדפת מייל</h2>
            <div class="card">${hbars((acc.byEmailPreference || []).map((r) => ({ key: PREF[r.key] || r.key, n: r.n })))}</div>
          </div>
        </div>
      `;
      root.querySelector('#userSort').value = state.userSort;
      root.querySelector('#userDir').value = state.userDir;
      root.querySelector('#userfilters').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        state.userQ = root.querySelector('#userQ').value.trim();
        state.userSort = root.querySelector('#userSort').value;
        state.userDir = root.querySelector('#userDir').value;
        await loadUsers();
        render();
      });
      root.querySelector('#csv').addEventListener('click', () => downloadUsersCsv(users));
    }

    function statusBadge(status) {
      const label = QSTATUS[status] || status;
      const cls = status === 'open' ? 'warn' : status === 'discarded' ? 'muted' : 'ok';
      return `<span class="badge ${cls}">${esc(label)}</span>`;
    }

    async function patchQuestion(id, body) {
      const r = await fetch('/api/admin/questions', {
        method: 'PATCH',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, ...body })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'נכשל');
      return data;
    }

    async function saveFaq(method, body) {
      const r = await fetch('/api/admin/faq', {
        method,
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'נכשל');
      return data;
    }

    function renderQuestions(root) {
      const questions = state.questions || [];
      const faq = state.faq || [];
      const filters = [
        ['open', 'פתוחות'],
        ['answered', 'טופלו'],
        ['published', 'פורסמו'],
        ['discarded', 'התעלמו'],
        ['', 'הכול']
      ].map(([v, label]) =>
        `<button type="button" class="${state.questionStatus === v ? '' : 'secondary'}" data-status="${esc(v)}">${esc(label)}</button>`
      ).join('');

      root.innerHTML = `
        <p class="lede">שאלות ממשתמשים רשומים. מענה במייל מחוץ לאתר, ואפשר לפרסם תשובה לשאלות הנפוצות.</p>
        ${state.error ? `<p class="err">${esc(state.error)}</p>` : ''}
        ${state.questionMsg ? `<p class="ok">${esc(state.questionMsg)}</p>` : ''}
        <div class="status-filters">${filters}</div>
        ${questions.length ? questions.map((q) => {
          const mailto = `mailto:${q.askerEmail}?subject=${encodeURIComponent('תשובה לשאלה במדריך נפש')}`;
          return `<div class="qcard" data-id="${esc(q.id)}">
            <div class="meta">
              ${statusBadge(q.status)}
              <span>${esc(fmtDate(q.createdAt))}</span>
              <a href="${esc(mailto)}">${esc(q.askerEmail)}</a>
            </div>
            <p class="qtext">${esc(q.question)}</p>
            <label>הערות פנימיות</label>
            <textarea class="notes">${esc(q.adminNotes || '')}</textarea>
            <div class="actions">
              <button type="button" class="secondary" data-act="notes">שמירת הערות</button>
              ${q.status === 'open' ? '<button type="button" data-act="answered">סמן כטופל</button>' : ''}
              ${q.status !== 'discarded' ? '<button type="button" class="secondary" data-act="discarded">התעלם</button>' : ''}
            </div>
            ${q.status === 'published' ? '<p class="muted">פורסמה לשאלות נפוצות.</p>' : `<form class="publish" data-publish="${esc(q.id)}">
              <label>שאלה לשאלות נפוצות</label>
              <input type="text" class="faq-q" value="${esc(q.question.slice(0, 500))}">
              <label>תשובה</label>
              <textarea class="faq-a" placeholder="התשובה שתוצג לכולם"></textarea>
              <button type="submit">פרסם לשאלות נפוצות</button>
            </form>`}
          </div>`;
        }).join('') : '<p class="lede">אין שאלות בסטטוס הזה.</p>'}

        <h2>שאלות נפוצות</h2>
        ${state.faqMsg ? `<p class="ok">${esc(state.faqMsg)}</p>` : ''}
        <div class="card">
          <h3>הוספה ידנית</h3>
          <form id="faq-new">
            <label for="faq-new-q">שאלה</label>
            <input id="faq-new-q" type="text" required maxlength="500">
            <label for="faq-new-a">תשובה</label>
            <textarea id="faq-new-a" required></textarea>
            <button type="submit">פרסום</button>
          </form>
        </div>
        ${faq.length ? faq.map((item) => `<form class="faq-edit" data-faq-id="${esc(item.id)}">
          <div class="meta" style="margin-bottom:8px">${item.published ? '<span class="badge ok">מפורסם</span>' : '<span class="badge warn">מוסתר</span>'}</div>
          <label>שאלה</label>
          <input type="text" class="faq-q" value="${esc(item.question)}" maxlength="500" required>
          <label>תשובה</label>
          <textarea class="faq-a" required>${esc(item.answer)}</textarea>
          <div class="row-end">
            <button type="submit">שמירה</button>
            <button type="button" class="secondary" data-act="toggle">${item.published ? 'הסתרה' : 'פרסום מחדש'}</button>
          </div>
        </form>`).join('') : '<p class="lede">עדיין אין שאלות נפוצות.</p>'}
      `;

      root.querySelectorAll('.status-filters button').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.questionStatus = btn.getAttribute('data-status') || '';
          state.questionMsg = '';
          await loadQuestions();
          render();
        });
      });

      root.querySelectorAll('.qcard').forEach((card) => {
        const id = card.getAttribute('data-id');
        const notesEl = card.querySelector('.notes');
        card.querySelectorAll('[data-act]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const act = btn.getAttribute('data-act');
            btn.disabled = true;
            try {
              if (act === 'notes') await patchQuestion(id, { adminNotes: notesEl.value });
              else await patchQuestion(id, { status: act, adminNotes: notesEl.value });
              state.questionMsg = 'נשמר.';
              await loadQuestions();
              render();
            } catch (e) {
              state.questionMsg = '';
              state.error = e.message || 'נכשל';
              render();
            }
          });
        });
        const pub = card.querySelector('[data-publish]');
        if (pub) {
          pub.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const btn = pub.querySelector('button[type=submit]');
            btn.disabled = true;
            try {
              await saveFaq('POST', {
                question: pub.querySelector('.faq-q').value.trim(),
                answer: pub.querySelector('.faq-a').value.trim(),
                sourceQuestionId: id
              });
              state.questionMsg = 'פורסם לשאלות נפוצות.';
              state.faqMsg = '';
              await loadQuestions();
              await loadFaqAdmin();
              render();
            } catch (e) {
              state.error = e.message || 'נכשל';
              render();
            }
          });
        }
      });

      const faqNew = root.querySelector('#faq-new');
      faqNew.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const btn = faqNew.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
          await saveFaq('POST', {
            question: root.querySelector('#faq-new-q').value.trim(),
            answer: root.querySelector('#faq-new-a').value.trim()
          });
          state.faqMsg = 'פורסם.';
          await loadFaqAdmin();
          render();
        } catch (e) {
          state.faqMsg = '';
          state.error = e.message || 'נכשל';
          render();
        }
      });

      root.querySelectorAll('.faq-edit').forEach((form) => {
        const id = form.getAttribute('data-faq-id');
        form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const btn = form.querySelector('button[type=submit]');
          btn.disabled = true;
          try {
            await saveFaq('PATCH', {
              id,
              question: form.querySelector('.faq-q').value.trim(),
              answer: form.querySelector('.faq-a').value.trim()
            });
            state.faqMsg = 'נשמר.';
            await loadFaqAdmin();
            render();
          } catch (e) {
            state.faqMsg = '';
            state.error = e.message || 'נכשל';
            render();
          }
        });
        form.querySelector('[data-act=toggle]').addEventListener('click', async (ev) => {
          ev.preventDefault();
          const btn = ev.currentTarget;
          btn.disabled = true;
          const published = !faq.find((f) => f.id === id)?.published;
          try {
            await saveFaq('PATCH', { id, published });
            state.faqMsg = published ? 'פורסם מחדש.' : 'הוסתר.';
            await loadFaqAdmin();
            render();
          } catch (e) {
            state.faqMsg = '';
            state.error = e.message || 'נכשל';
            render();
          }
        });
      });
    }

    function render() {
      if (!state.user) {
        renderGate('יש להיכנס לחשבון במדריך ואז לחזור לכאן. העמוד מיועד למפעילים בלבד.');
        return;
      }
      if (!state.user.isAdmin) {
        renderGate('אין הרשאה.');
        return;
      }
      if (state.error && !state.analytics && state.tab === 'analytics') {
        renderGate(state.error);
        return;
      }
      if (state.error && !state.users && state.tab === 'users') {
        renderGate(state.error);
        return;
      }
      if (state.error && state.questions == null && state.tab === 'questions') {
        renderGate(state.error);
        return;
      }

      app.innerHTML = '';
      const wrap = el(`<div>
        <div class="toolbar">
          <a class="back" href="/">חזרה למדריך</a>
          <span class="muted">${esc(state.user.email)}</span>
        </div>
        <h1>אדמין</h1>
        <div class="tabs">
          <button type="button" data-tab="analytics" class="${state.tab === 'analytics' ? 'active' : ''}">אנליטיקה</button>
          <button type="button" data-tab="users" class="${state.tab === 'users' ? 'active' : ''}">משתמשים רשומים</button>
          <button type="button" data-tab="questions" class="${state.tab === 'questions' ? 'active' : ''}">שאלות</button>
        </div>
        <div id="tabbody"></div>
      </div>`);
      app.appendChild(wrap);
      wrap.querySelectorAll('.tabs button').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const tab = btn.getAttribute('data-tab');
          setTab(tab);
          if (tab === 'users' && !state.users) await loadUsers();
          if (tab === 'analytics' && !state.analytics) await loadAnalytics();
          if (tab === 'questions') {
            if (!state.questions) await loadQuestions();
            if (!state.faq) await loadFaqAdmin();
          }
          render();
        });
      });
      const body = wrap.querySelector('#tabbody');
      if (state.tab === 'users') renderUsers(body);
      else if (state.tab === 'questions') renderQuestions(body);
      else renderAnalytics(body);
    }

    window.addEventListener('hashchange', async () => {
      const next = hashToTab();
      if (next === state.tab) return;
      state.tab = next;
      if (next === 'users' && !state.users) await loadUsers();
      if (next === 'analytics' && !state.analytics) await loadAnalytics();
      if (next === 'questions') {
        if (!state.questions) await loadQuestions();
        if (!state.faq) await loadFaqAdmin();
      }
      render();
    });

    (async () => {
      try {
        await loadSession();
        if (state.user && state.user.isAdmin) {
          if (state.tab === 'users') await loadUsers();
          else if (state.tab === 'questions') {
            await loadQuestions();
            await loadFaqAdmin();
          } else await loadAnalytics();
        }
        render();
      } catch (e) {
        renderGate('לא הצלחנו להגיע לשרת.');
      }
    })();
  </script>
</body>
</html>
