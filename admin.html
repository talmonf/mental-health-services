<!DOCTYPE html>
  <html lang="en-GB" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Nefesh directory</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://nefesh-il.org/admin">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2d5a7b;
      --primary-dark: #1e3f5a;
      --text: #333;
      --muted: #5a5a5a;
      --border: #e0e0e0;
      --bg: #f0f2f5;
      --card: #fff;
      --warn: #c47a12;
      --pv: #2d5a7b;
      --search: #3d8b6e;
      --click: #c47a12;
      --other: #8a7a9a;
    }
    body { margin: 0; font-family: Heebo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; color: var(--primary-dark); margin: 0 0 8px; }
    h2 { font-size: 1.15rem; color: var(--primary); margin: 28px 0 12px; }
    h3 { font-size: 0.95rem; color: var(--primary-dark); margin: 16px 0 8px; }
    p.lede { color: var(--muted); margin: 0 0 16px; }
    .card { background: var(--card); border-radius: 10px; padding: 16px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.07); margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.02em; white-space: nowrap; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat { flex: 1 1 140px; background: #eef4f8; border-radius: 8px; padding: 12px 14px; }
    .stat b { display: block; font-size: 1.4rem; color: var(--primary-dark); }
    .stat span { color: var(--muted); font-size: 0.85rem; }
    label { display: block; font-weight: 600; margin: 0 0 6px; font-size: 0.82rem; color: var(--muted); }
    input[type=text], input[type=date], input[type=number], textarea, select {
      width: 100%; box-sizing: border-box; padding: 8px 10px; border: 2px solid var(--border);
      border-radius: 8px; font: inherit; background: #fff;
    }
    textarea { min-height: 120px; }
    button, .btn {
      display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px;
      border: none; border-radius: 8px; background: var(--primary); color: #fff; font: inherit; font-weight: 600;
      cursor: pointer; text-decoration: none;
    }
    button.secondary { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .err { color: #c0392b; }
    .ok { color: #1e7a4a; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    a.back { color: var(--primary); text-decoration: none; font-weight: 600; }
    a.open { font-size: 0.8rem; font-weight: 600; white-space: nowrap; color: var(--primary); text-decoration: none; }
    a.open:hover { text-decoration: underline; }
    .gate { max-width: 480px; margin: 80px auto; background: var(--card); padding: 32px; border-radius: 10px; text-align: center; }
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tabs button {
      background: transparent; color: var(--muted); border: none; border-radius: 8px 8px 0 0;
      min-height: 44px; font-weight: 600;
    }
    .tabs button.active { color: var(--primary-dark); background: #eef4f8; }
    .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; align-items: end; }
    .filters .wide { grid-column: span 2; }
    .filters .exclude { grid-column: span 2; }
    .filters .exclude-pair { display: flex; gap: 8px; align-items: stretch; }
    .filters .exclude-pair select { flex: 1; min-width: 0; }
    .filters .check-field {
      display: flex; align-items: center; gap: 8px; margin: 0; flex: 0 0 auto;
      padding: 8px 10px; border: 2px solid var(--border); border-radius: 8px;
      background: #fff; font-weight: 600; box-sizing: border-box; cursor: pointer;
      white-space: nowrap;
    }
    .filters .check-field input { width: auto; margin: 0; flex: none; }
    .chart { display: flex; flex-direction: row; direction: ltr; align-items: flex-end; gap: 6px; min-height: 140px; overflow-x: auto; padding: 8px 0 0; }
    .chart-col { flex: 1 0 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 22px; }
    .chart-stack { width: 100%; display: flex; flex-direction: column-reverse; height: 120px; border-radius: 4px 4px 0 0; overflow: hidden; background: #eef2f5; }
    .chart-seg { width: 100%; }
    .chart-seg.pv { background: var(--pv); }
    .chart-seg.search { background: var(--search); }
    .chart-seg.click { background: var(--click); }
    .chart-seg.other { background: var(--other); }
    .chart-label { font-size: 0.65rem; color: var(--muted); writing-mode: horizontal-tb; transform: none; white-space: nowrap; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
    .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .hbar { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.85rem; }
    .hbar .name { flex: 0 0 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar .track { flex: 1; height: 10px; background: #eef2f5; border-radius: 6px; overflow: hidden; }
    .hbar .fill { height: 100%; background: var(--primary); }
    .hbar .n { flex: 0 0 2.5rem; color: var(--muted); text-align: right; }
    a.name-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    a.name-link:hover { text-decoration: underline; }
    .he-panel { direction: rtl; text-align: right; }
    .he-panel th, .he-panel td { text-align: right; }
    .dir-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .dir-grid .full { grid-column: 1 / -1; }
    .dir-help { color: var(--muted); font-size: 0.9rem; margin: 0 0 12px; }
    .dir-check { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-weight: 600; font-size: 0.85rem; }
    .dir-check input { width: auto; }
    .dir-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    @media (max-width: 700px) { .dir-grid { grid-template-columns: 1fr; } }
    .users-table-wrap { overflow-x: auto; }
    .users-table-wrap table { min-width: 1240px; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: #eef4f8; color: var(--primary-dark); }
    .badge.warn { background: #fdf3e7; color: #8a5a12; }
    .badge.ok { background: #e7f6ee; color: #1e7a4a; }
    .badge.muted { background: #eef2f5; color: var(--muted); }
    .muted { color: var(--muted); }
    .qcard { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; background: #fff; }
    .qcard .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 0.85rem; }
    .qcard .qtext { white-space: pre-wrap; margin: 0 0 12px; }
    .qcard .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .qcard .publish { background: #eef4f8; border-radius: 8px; padding: 12px; }
    .faq-edit { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .faq-edit .row-end { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .status-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    details.chrome { margin-top: 4px; }
    details.chrome summary { cursor: pointer; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .kz-panel { direction: ltr; text-align: left; }
    .kz-panel h2[dir=auto] { margin-top: 0; }
    .kz-guide h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .kz-steps { margin: 8px 0 0; padding-inline-start: 1.25rem; }
    .kz-steps li { margin: 6px 0; }
    .kz-guide details { margin-top: 12px; }
    .kz-guide details summary { cursor: pointer; font-weight: 600; color: var(--primary-dark); }
    .kz-guide details:not([open]) > :not(summary) { display: none; }
    .kz-panel .filters .wide { grid-column: 1 / -1; }
    details.kz-about { margin-bottom: 16px; }
    details.kz-about summary { cursor: pointer; font-weight: 600; color: var(--primary-dark); }
    .kz-about p { margin: 8px 0; }
    .kz-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
    .kz-pre {
      white-space: pre-wrap; max-height: 420px; overflow: auto; background: #f7f9fb;
      border-radius: 8px; padding: 12px; font-size: 0.85rem; margin: 8px 0 0;
    }
    .kz-hit { display: block; width: 100%; text-align: inherit; background: transparent; color: inherit; border: none; padding: 8px 0; cursor: pointer; font: inherit; }
    .kz-hit:hover b { text-decoration: underline; }
    .kz-meta { font-size: 0.8rem; color: var(--muted); word-break: break-all; margin: 8px 0; }
    [dir=auto] { unicode-bidi: plaintext; }
    @media (max-width: 700px) {
      .filters .wide, .filters .exclude { grid-column: span 1; }
      .filters .exclude-pair { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

      mod: 'Ministry of Defense',
      mh_clinics: 'Mental health clinics',
      hmo: 'Health funds',
      hospitalization: 'Hospitalization',
      alternatives: 'Hospitalization alternatives',
      rehabilitation: 'Rehabilitation',
      therapists: 'Finding a practitioner',
      treatments: 'Treatments',
      treatments_psychiatry: 'Psychiatry',
      treatments_medical: 'Medical treatments',
      treatments_therapy: 'Therapy',
      treatments_others: 'Other treatments',
      addictions: 'Addictions',
      trauma: 'Trauma',
      families: 'Family support',
      youth: 'Teenagers & young adults',
      populations: 'Special populations',
      facebook: 'Facebook groups',

      nutrition: 'Nutrition & mental health',
      local: 'Local services',
      books_movies: 'Books, movies & TED',
      transport: 'Transportation',
      group_emergency: 'Emergency & crisis support',
      group_treatment: 'Treatment & therapy',
      group_rightsGov: 'Rights & government services',
      group_support: 'Support & community',
      group_information: 'Information & practical services'
    };
    const CHROME_SECTIONS = new Set([
      'landing', '(none)', 'link_probe', 'search_results', 'deep_link',
      'category_overview', 'category_group', 'nearby'
    ]);

    const app = document.getElementById('app');
    function hashToTab() {
      const h = (location.hash || '').replace(/^#/, '');
      if (h === 'users' || h === 'questions' || h === 'updates' || h === 'kolzchut') return h;
      if (h === 'directory' || h.indexOf('directory/') === 0) return 'directory';
      return 'analytics';
    }
    function directoryIdFromHash() {
      const m = /^directory\/(\d+)$/.exec((location.hash || '').replace(/^#/, ''));
      return m ? Number(m[1]) : null;
    }
    const state = {
      user: null,
      tab: hashToTab(),
      directoryId: directoryIdFromHash(),
      directoryCards: null,
      directoryCard: null,
      directoryMsg: '',
      kz: {
        action: 'search',
        q: '',
        title: '',
        section: '0',
        format: 'text',
        prefix: 'נכות',
        category: 'נכות',
        limit: '10',
        offset: '0',
        continueToken: '',
        loading: false,
        error: '',
        result: null
      },
      analytics: null,
      users: null,
      accounts: null,
      questions: null,
      faq: null,
      questionStatus: 'open',
      questionMsg: '',
      faqMsg: '',
      days: 30,
      from: '',
      to: '',
      eventType: '',
      device: '',
      audience: '',
      country: '',
      section: '',
      filterUserId: '',
      excludeAdmins: true,
      excludeUserIds: [],
      userQ: '',
      userSort: 'created_at',
      userDir: 'desc',
      error: '',
      loading: false
    };

    function el(html) {
      const d = document.createElement('div');
      d.innerHTML = html.trim();
      return d.firstElementChild;
    }
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function fmtDate(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return esc(String(v).slice(0, 16));
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy}, ${hh}:${min}`;
    }
    function fmtDay(v) {
      const s = String(v || '').slice(0, 10);
      if (!s) return '';
      const [y, m, d] = s.split('-');
      return `${d}/${m}`;
    }
    function ymdToDmy(ymd) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd || ''));
      return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
    }
    function dmyToYmd(dmy) {
      const s = String(dmy || '').trim();
      if (!s) return '';
      const m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/.exec(s);
      if (!m) return null;
      const dd = m[1].padStart(2, '0');
      const mm = m[2].padStart(2, '0');
      const yyyy = m[3];
      const dt = new Date(`${yyyy}-${mm}-${dd}T00:00:00Z`);
      if (Number.isNaN(dt.getTime()) || dt.toISOString().slice(0, 10) !== `${yyyy}-${mm}-${dd}`) return null;
      return `${yyyy}-${mm}-${dd}`;
    }
    const regionNames = typeof Intl !== 'undefined' && Intl.DisplayNames
      ? new Intl.DisplayNames(['en'], { type: 'region' })
      : null;
    function countryName(code) {
      const c = String(code || '').trim();
      if (!c || c === '(unknown)') return '(unknown)';
      if (/^[A-Za-z]{2}$/.test(c) && regionNames) {
        try {
          return regionNames.of(c.toUpperCase()) || c.toUpperCase();
        } catch {
          return c.toUpperCase();
        }
      }
      return c;
    }
    function table(headers, rows, cells, empty) {
      if (!rows || !rows.length) return `<p class="lede">${empty || 'No data in this window.'}</p>`;
      return `<table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
        rows.map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')
      }</tbody></table>`;
    }
    function openLink(href, label, dirAuto) {
      if (!href) return dirAuto ? `<span dir="auto">${esc(label)}</span>` : esc(label);
      const inner = dirAuto ? `<span dir="auto">${esc(label)}</span>` : esc(label);
      return `<a class="name-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
    }
    function contactName(r) {
      const display = String(r.display_name || '').trim();
      const text = String(r.element_text_short || '').trim();
      const id = String(r.element_id || '').trim();
      const type = String(r.element_type || '').trim();
      if (display && display.toLowerCase() !== type.toLowerCase()) return display;
      if (CONTACT_NAMES[id]) return CONTACT_NAMES[id];
      if (text && text.toLowerCase() !== type.toLowerCase()) return text;
      if (id && id.toLowerCase() !== type.toLowerCase()) {
        return id.replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
      }
      return actionLabel(type);
    }
    function hbars(rows, hrefFor) {
      if (!rows || !rows.length) return '<p class="lede">No data in this window.</p>';
      const max = Math.max(...rows.map((r) => Number(r.n) || 0), 1);
      return rows.map((r) => {
        const n = Number(r.n) || 0;
        const w = Math.round((n / max) * 100);
        const href = hrefFor ? hrefFor(r) : '';
        const name = href
          ? `<a class="name-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(r.key)}">${esc(r.key)}</a>`
          : esc(r.key);
        return `<div class="hbar"><span class="name" title="${esc(r.key)}">${name}</span><span class="track"><span class="fill" style="width:${w}%"></span></span><span class="n">${n}</span></div>`;
      }).join('');
    }
    function entryHref(row) {
      const n = String(row || '').replace(/\D/g, '');
      return n ? `/?entry=${encodeURIComponent(n)}` : '';
    }
    function sectionLabel(key) {
      if (SECTION_LABELS[key]) return SECTION_LABELS[key];
      return String(key || '').replace(/_/g, ' ') || '(none)';
    }
    function sectionHref(key) {
      const k = String(key || '');
      if (!k || CHROME_SECTIONS.has(k)) return '';
      if (k.startsWith('group_')) {
        const id = k.slice(6);
        return GROUP_KEYS[id] ? `/#${encodeURIComponent(id)}` : '';
      }
      if (CATEGORY_SET.has(k)) return `/?section=${encodeURIComponent(k)}`;
      const us = k.lastIndexOf('_');
      if (us > 0) {
        const parent = k.slice(0, us);
        const sub = k.slice(us + 1);
        if (CATEGORY_SET.has(parent) && sub) {
          return `/?section=${encodeURIComponent(parent)}&subsection=${encodeURIComponent(sub)}`;
        }
      }
      return '';
    }
    function sectionHrefFromElementId(id) {
      const raw = String(id || '');
      if (raw.startsWith('subcategory_')) return sectionHref(raw.slice('subcategory_'.length));
      if (raw.startsWith('subsection_')) return sectionHref(raw.slice('subsection_'.length));
      if (raw.startsWith('category_')) {
        const rest = raw.slice('category_'.length);
        if (GROUP_KEYS[rest]) return `/#${encodeURIComponent(rest)}`;
        return sectionHref(rest);
      }
      if (raw.startsWith('group_')) return sectionHref(raw);
      return sectionHref(raw);
    }
    function sectionLabelFromElementId(id) {
      const raw = String(id || '');
      if (raw.startsWith('subcategory_')) return sectionLabel(raw.slice('subcategory_'.length));
      if (raw.startsWith('subsection_')) return sectionLabel(raw.slice('subsection_'.length));
      if (raw.startsWith('category_')) {
        const rest = raw.slice('category_'.length);
        return GROUP_KEYS[rest] || sectionLabel(rest);
      }
      if (raw.startsWith('group_')) return sectionLabel(raw);
      return sectionLabel(raw);
    }
    function actionLabel(type) {
      return ACTION[type] || String(type || 'click');
    }

    async function loadSession() {
      try {
        const r = await fetch('/api/auth/session', { credentials: 'include' });
        const data = await r.json().catch(() => ({}));

    function barChart(rows) {
      if (!rows || !rows.length) return '<p class="lede">No data in this window.</p>';
      const max = Math.max(...rows.map((r) => Number(r.total) || ((Number(r.page_view)||0)+(Number(r.search)||0)+(Number(r.click)||0)+(Number(r.other)||0))), 1);
      const cols = rows.map((r) => {
        const pv = Number(r.page_view) || 0;
        const se = Number(r.search) || 0;
        const cl = Number(r.click) || 0;
        const ot = Number(r.other) || 0;
        const total = Number(r.total) || (pv + se + cl + ot);
        const scale = 120 / max;
        return `<div class="chart-col" title="${esc(fmtDay(r.day))}: ${total}">
          <div class="chart-stack">
            <div class="chart-seg pv" style="height:${pv * scale}px"></div>
            <div class="chart-seg search" style="height:${se * scale}px"></div>
            <div class="chart-seg click" style="height:${cl * scale}px"></div>
            <div class="chart-seg other" style="height:${ot * scale}px"></div>
          </div>
          <span class="chart-label">${esc(fmtDay(r.day))}</span>
        </div>`;
      }).join('');
      return `<div class="chart">${cols}</div>
        <div class="legend">
          <span><i style="background:var(--pv)"></i>Page views</span>
          <span><i style="background:var(--search)"></i>Searches</span>
          <span><i style="background:var(--click)"></i>Clicks</span>

    function csvEscape(v) {
      const s = String(v == null ? '' : v);
      if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
      return s;
    }

    function downloadUsersCsv(users) {
      const headers = ['Email','Country','City','Gender','Qualification','License number','Organisation','Title','How they found us','Details','Email preference','Email verified','Verified at','Admin','Registered','Last access'];
      const lines = [headers.join(',')];
      for (const u of users) {
        lines.push([
          u.email,
          countryName(u.country),
          u.city,
          GENDER[u.gender] || '',
          QUAL[u.qualification] || u.qualification,
          u.licenseNumber,
          u.organization,
          u.title,
          FOUND[u.foundVia] || u.foundVia,
          u.foundViaOther,
          PREF[u.emailPreference] || u.emailPreference,
          u.emailVerified ? 'Yes' : 'No',
          u.emailVerifiedAt ? fmtDate(u.emailVerifiedAt) : '',
          u.isAdmin ? 'Yes' : 'No',
          fmtDate(u.createdAt),
          fmtDate(u.lastAccessAt)
        ].map(csvEscape).join(','));
      }
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nefesh-users.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function patchQuestion(id, body) {
      const r = await fetch('/api/admin/questions', {
        method: 'PATCH',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, ...body })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'נכשל');
      return data;
    }

    async function saveFaq(method, body) {
      const r = await fetch('/api/admin/faq', {
        method,
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'נכשל');
      return data;
    }

    function renderQuestions(root) {
      const questions = state.questions || [];
      const faq = state.faq || [];
      const filters = [
        ['open', 'פתוחות'],
        ['answered', 'טופלו'],
        ['published', 'פורסמו'],
        ['discarded', 'התעלמו'],
        ['', 'הכול']
      ].map(([v, label]) =>
        `<button type="button" class="${state.questionStatus === v ? '' : 'secondary'}" data-status="${esc(v)}">${esc(label)}</button>`
      ).join('');

      root.innerHTML = `
        <div class="he-panel" lang="he">
        <p class="lede">שאלות ממשתמשים רשומים. מענה במייל מחוץ לאתר, ואפשר לפרסם תשובה לשאלות הנפוצות.</p>
        ${state.error ? `<p class="err">${esc(state.error)}</p>` : ''}
        ${state.questionMsg ? `<p class="ok">${esc(state.questionMsg)}</p>` : ''}
        <div class="status-filters">${filters}</div>
        ${questions.length ? questions.map((q) => {
          const mailto = `mailto:${q.askerEmail}?subject=${encodeURIComponent('תשובה לשאלה במדריך נפש')}`;
          return `<div class="qcard" data-id="${esc(q.id)}">
            <div class="meta">
              ${statusBadge(q.status)}
              <span>${esc(fmtDate(q.createdAt))}</span>
              <a href="${esc(mailto)}">${esc(q.askerEmail)}</a>
            </div>
            <p class="qtext" dir="auto">${esc(q.question)}</p>
            <label>הערות פנימיות</label>
            <textarea class="notes" dir="auto">${esc(q.adminNotes || '')}</textarea>
            <div class="actions">
              <button type="button" class="secondary" data-act="notes">שמירת הערות</button>
              ${q.status === 'open' ? '<button type="button" data-act="answered">סמן כטופל</button>' : ''}
              ${q.status !== 'discarded' ? '<button type="button" class="secondary" data-act="discarded">התעלם</button>' : ''}
            </div>
            ${q.status === 'published' ? '<p class="muted">פורסמה לשאלות נפוצות.</p>' : `<form class="publish" data-publish="${esc(q.id)}">
              <label>שאלה לשאלות נפוצות</label>
              <input type="text" class="faq-q" dir="auto" value="${esc(q.question.slice(0, 500))}">
              <label>תשובה</label>
              <textarea class="faq-a" dir="auto" placeholder="התשובה שתוצג לכולם"></textarea>
              <button type="submit">פרסם לשאלות נפוצות</button>
            </form>`}
          </div>`;
        }).join('') : '<p class="lede">אין שאלות בסטטוס הזה.</p>'}

        <h2>שאלות נפוצות</h2>
        ${state.faqMsg ? `<p class="ok">${esc(state.faqMsg)}</p>` : ''}
        <div class="card">
          <h3>הוספה ידנית</h3>
          <form id="faq-new">
            <label for="faq-new-q">שאלה</label>
            <input id="faq-new-q" type="text" dir="auto" required maxlength="500">
            <label for="faq-new-a">תשובה</label>
            <textarea id="faq-new-a" dir="auto" required></textarea>
            <button type="submit">פרסום</button>
          </form>
        </div>
        ${faq.length ? faq.map((item) => `<form class="faq-edit" data-faq-id="${esc(item.id)}">
          <div class="meta" style="margin-bottom:8px">${item.published ? '<span class="badge ok">מפורסם</span>' : '<span class="badge warn">מוסתר</span>'}</div>
          <label>שאלה</label>
          <input type="text" class="faq-q" dir="auto" value="${esc(item.question)}" maxlength="500" required>
          <label>תשובה</label>
          <textarea class="faq-a" dir="auto" required>${esc(item.answer)}</textarea>
          <div class="row-end">
            <button type="submit">שמירה</button>
            <button type="button" class="secondary" data-act="toggle">${item.published ? 'הסתרה' : 'פרסום מחדש'}</button>
          </div>
        </form>`).join('') : '<p class="lede">עדיין אין שאלות נפוצות.</p>'}
        </div>
      `;

      root.querySelectorAll('.status-filters button').forEach((btn) => {
        btn.addEventListener('click', async () => {
          state.questionStatus = btn.getAttribute('data-status') || '';
          state.questionMsg = '';
          await loadQuestions();
          render();
        });
      });

      root.querySelectorAll('.qcard').forEach((card) => {
        const id = card.getAttribute('data-id');
        const notesEl = card.querySelector('.notes');
        card.querySelectorAll('[data-act]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const act = btn.getAttribute('data-act');
            btn.disabled = true;
            try {
              if (act === 'notes') await patchQuestion(id, { adminNotes: notesEl.value });
              else await patchQuestion(id, { status: act, adminNotes: notesEl.value });
              state.questionMsg = 'נשמר.';
              await loadQuestions();
              render();
            } catch (e) {
              state.questionMsg = '';
              state.error = e.message || 'נכשל';
              render();
            }
          });
        });
        const pub = card.querySelector('[data-publish]');
        if (pub) {
          pub.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const btn = pub.querySelector('button[type=submit]');
            btn.disabled = true;
            try {
              await saveFaq('POST', {
                question: pub.querySelector('.faq-q').value.trim(),
                answer: pub.querySelector('.faq-a').value.trim(),
                sourceQuestionId: id
              });
              state.questionMsg = 'פורסם לשאלות נפוצות.';
              state.faqMsg = '';
              await loadQuestions();
              await loadFaqAdmin();
              render();
            } catch (e) {
              state.error = e.message || 'נכשל';
              render();
            }
          });
        }
      });

      const faqNew = root.querySelector('#faq-new');
      faqNew.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const btn = faqNew.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
          await saveFaq('POST', {
            question: root.querySelector('#faq-new-q').value.trim(),
            answer: root.querySelector('#faq-new-a').value.trim()
          });
          state.faqMsg = 'פורסם.';
          await loadFaqAdmin();
          render();
        } catch (e) {
          state.faqMsg = '';
          state.error = e.message || 'נכשל';
          render();
        }
      });

      root.querySelectorAll('.faq-edit').forEach((form) => {
        const id = form.getAttribute('data-faq-id');
        form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const btn = form.querySelector('button[type=submit]');
          btn.disabled = true;
          try {
            await saveFaq('PATCH', {
              id,
              question: form.querySelector('.faq-q').value.trim(),
              answer: form.querySelector('.faq-a').value.trim()
            });
            state.faqMsg = 'נשמר.';
            await loadFaqAdmin();
            render();
          } catch (e) {
            state.faqMsg = '';
            state.error = e.message || 'נכשל';
            render();
          }
        });
        form.querySelector('[data-act=toggle]').addEventListener('click', async (ev) => {
          ev.preventDefault();
          const btn = ev.currentTarget;
          btn.disabled = true;
          const published = !faq.find((f) => f.id === id)?.published;
          try {
            await saveFaq('PATCH', { id, published });
            state.faqMsg = published ? 'פורסם מחדש.' : 'הוסתר.';
            await loadFaqAdmin();
            render();
          } catch (e) {
            state.faqMsg = '';
            state.error = e.message || 'נכשל';
            render();
          }
        });
      });
    }

    const DIR_TEXT = [
      ['org', 'שם הארגון', false],
      ['svc', 'תיאור קצר', false],
      ['target', 'למי', true],
      ['region', 'אזור', false],
      ['cost', 'עלות', false],
      ['specialty', 'התמחות', true],
      ['languages', 'שפות', false],
      ['diseases', 'מצבים', true],
      ['notes', 'הערות', true],
      ['tags', 'מילות חיפוש (לא מוצגות כשדה בכרטיס)', true],
      ['whatsapp', 'וואטסאפ', false],
      ['whatsappLabel', 'תווית וואטסאפ', false],
      ['email', 'דוא״ל', false],
      ['web', 'אתר', false],
      ['webLabel', 'תווית אתר', false],
      ['web2', 'אתר נוסף', false],
      ['webLabel2', 'תווית אתר נוסף', false],
      ['add', 'קישור נוסף', false],
      ['addLabel', 'תווית קישור נוסף', false]
    ];
    const DIR_PHONES = ['', '2', '3', '4', '5', '6'];
    const DIR_LTR = new Set(['whatsapp', 'email', 'web', 'web2', 'add']);

    function dirLines(value) {
      return String(value || '').split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
    }

    async function loadDirectoryList() {
      const r = await fetch('/api/admin/directory', { credentials: 'include' });
      if (r.status === 401 || r.status === 403) {
        state.error = r.status === 401 ? 'Sign in on the main site first.' : 'You do not have access.';
        state.directoryCards = null;
        return;
      }
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        state.directoryCards = [];
        state.directoryMsg = data.error || 'טעינת הכרטיסים נכשלה.';
        return;
      }
      state.error = '';
      state.directoryCards = data.cards || [];
    }

    async function loadDirectoryCard(id) {
      const r = await fetch(`/api/admin/directory?id=${encodeURIComponent(id)}`, { credentials: 'include' });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        state.directoryCard = null;
        state.directoryMsg = data.error || 'הכרטיס לא נמצא.';
        return;
      }
      state.directoryMsg = '';
      state.directoryCard = data.card;
    }

    async function loadDirectory() {
      await loadDirectoryList();
      if (state.directoryId) await loadDirectoryCard(state.directoryId);
    }

    function renderDirectory(root) {
      const msg = state.directoryMsg
        ? `<p class="${state.directoryMsg === 'נשמר.' ? 'ok' : 'err'}">${esc(state.directoryMsg)}</p>`
        : '';
      if (state.directoryId) {
        const card = state.directoryCard;
        if (!card) {
          root.appendChild(el(`<div class="card he-panel">${msg}<p><button type="button" class="secondary" data-act="back">חזרה לרשימה</button></p></div>`));
          root.querySelector('[data-act=back]').addEventListener('click', () => {
            state.directoryId = null;
            state.directoryCard = null;
            state.directoryMsg = '';
            location.hash = 'directory';
            render();
          });
          return;
        }
        const fields = card.publicFields || {};
        const elig = card.eligibility || {};
        const siteRow = (site) => {
          const s = site || {};
          return `<div class="site-row dir-grid">
            <div><label>שם</label><input name="site_label" type="text" value="${esc(s.label || '')}"></div>
            <div class="full"><label>כתובת</label><input name="site_address" type="text" value="${esc(s.address || '')}"></div>
            <div><label>טלפון</label><input name="site_phone" type="text" dir="ltr" value="${esc(s.phone || '')}"></div>
            <div><label>דוא״ל</label><input name="site_email" type="text" dir="ltr" value="${esc(s.email || '')}"></div>
            <div><label>קו רוחב</label><input name="site_lat" type="text" dir="ltr" value="${s.lat == null ? '' : esc(s.lat)}"></div>
            <div><label>קו אורך</label><input name="site_lng" type="text" dir="ltr" value="${s.lng == null ? '' : esc(s.lng)}"></div>
            <div><button type="button" class="secondary" data-act="remove-site">הסרה</button></div>
          </div>`;
        };
        const rec = elig.recognition || {};
        const textInputs = DIR_TEXT.map(([name, label, area]) => {
          const value = fields[name] == null ? '' : String(fields[name]);
          const ltr = DIR_LTR.has(name) ? ' dir="ltr"' : '';
          if (area) {
            return `<div class="full"><label for="d-${name}">${esc(label)}</label><textarea id="d-${name}" name="${name}"${ltr}>${esc(value)}</textarea></div>`;
          }
          return `<div class="${name === 'org' || name === 'svc' ? 'full' : ''}"><label for="d-${name}">${esc(label)}</label><input id="d-${name}" name="${name}" type="text" value="${esc(value)}"${ltr}></div>`;
        }).join('');
        const phones = DIR_PHONES.map((suffix, index) => {
          const num = fields[`phone${suffix}`] == null ? '' : String(fields[`phone${suffix}`]);
          const label = fields[`phoneLabel${suffix}`] == null ? '' : String(fields[`phoneLabel${suffix}`]);
          const show = fields[`phoneShowNumber${suffix}`] !== false;
          return `<div>
            <label for="d-phone${suffix}">טלפון ${index + 1}</label>
            <input id="d-phone${suffix}" name="phone${suffix}" type="text" dir="ltr" value="${esc(num)}">
            <label for="d-phoneLabel${suffix}">תווית</label>
            <input id="d-phoneLabel${suffix}" name="phoneLabel${suffix}" type="text" value="${esc(label)}">
            <label class="dir-check"><input type="checkbox" name="phoneShowNumber${suffix}"${show ? ' checked' : ''}> הצגת המספר על הכפתור</label>
          </div>`;
        }).join('');
        const sex = elig.sex || 'any';
        const locationMode = elig.location_mode || 'any';
        const select = (name, label, current, options) => `<div><label for="d-${name}">${esc(label)}</label><select id="d-${name}" name="${name}">${options.map(([v, t]) => `<option value="${esc(v)}"${v === current ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
        const anyReq = [['any', 'ללא הגבלה'], ['required', 'נדרש']];
        root.appendChild(el(`<div class="card he-panel">
          ${msg}
          <p class="dir-help">שורה ${esc(card.rowId)}. <a href="/?entry=${encodeURIComponent(card.rowId)}">צפייה בכרטיס</a></p>
          <form id="dir-form">
            <h2>מוצג בכרטיס</h2>
            <div class="dir-grid">${textInputs}</div>
            <details class="chrome" ${DIR_PHONES.some((suffix) => fields[`phone${suffix}`]) ? 'open' : ''}>
              <summary>טלפונים</summary>
              <div class="dir-grid">${phones}</div>
            </details>
            <h2>התאמה — לא מוצג בכרטיס</h2>
            <p class="dir-help">השדות כאן לא מופיעים על הכרטיס, אבל נכללים במקור הדף כדי שמנועי חיפוש וכלים דומים יוכלו לקרוא אותם. שדה ריק או «ללא הגבלה» פירושו שאין תנאי בממד הזה. תנאי שמולא הוא תנאי הכרחי, לא סיבה מספיקה בפני עצמה להתאים את השירות. הערות פנימיות נכללות גם הן במקור הדף — לא לרשום בהן הערות תפעוליות פרטיות.</p>
            <div class="dir-grid">
              <div><label for="d-age_min">גיל מינימום</label><input id="d-age_min" name="age_min" type="number" min="0" max="120" value="${elig.age_min == null ? '' : esc(elig.age_min)}"></div>
              <div><label for="d-age_max">גיל מקסימום</label><input id="d-age_max" name="age_max" type="number" min="0" max="120" value="${elig.age_max == null ? '' : esc(elig.age_max)}"></div>
              ${select('sex', 'מין', sex, [['any', 'ללא הגבלה'], ['female', 'נקבה'], ['male', 'זכר']])}
              ${select('location_mode', 'מיקום', locationMode, [['any', 'ללא הגבלה'], ['nationwide', 'ארצי'], ['regions', 'אזורים'], ['sites', 'לפי מרפאות']])}
              <div class="full" id="d-regions-wrap"${locationMode === 'regions' ? '' : ' hidden'}><label for="d-regions">אזורים (שורה לכל אזור)</label><textarea id="d-regions" name="regions">${esc(dirLines(elig.regions && elig.regions.join ? elig.regions.join('\n') : '').join('\n'))}</textarea></div>
              <div class="full"><label for="d-diagnoses">אבחנות (שורה לכל אבחנה)</label><textarea id="d-diagnoses" name="diagnoses">${esc((elig.diagnoses || []).join('\n'))}</textarea></div>
              <div class="full"><label for="d-presenting_problems">קשיים או סיבות פנייה (שורה לכל פריט)</label><textarea id="d-presenting_problems" name="presenting_problems">${esc((elig.presenting_problems || []).join('\n'))}</textarea></div>
              ${select('rec_btl', 'ביטוח לאומי', rec.btl || 'any', anyReq)}
              ${select('rec_moh', 'משרד הבריאות', rec.moh || 'any', anyReq)}
              ${select('rec_mod', 'משרד הביטחון', rec.mod || 'any', anyReq)}
              ${select('rec_rehab', 'סל שיקום', rec.rehab_basket || 'any', anyReq)}
              <div class="full"><label for="d-internal_notes">הערות פנימיות (במקור הדף, לא על הכרטיס)</label><textarea id="d-internal_notes" name="internal_notes">${esc(elig.internal_notes || '')}</textarea></div>
            </div>
            <h2>מרפאות — לא מוצג בכרטיס</h2>
            <p class="dir-help">רשימת מקומות לכפתור המפה ולחיפוש לפי מרחק. שם המקום מוצג בבורר. קואורדינטות ריקות ימולאו בשמירה לפי הכתובת.</p>
            <div id="d-sites">${(Array.isArray(card.sites) ? card.sites : []).map((site) => siteRow(site)).join('')}</div>
            <p><button type="button" class="secondary" id="d-add-site">הוספת מרפאה</button></p>
            <div class="dir-actions">
              <button type="submit">שמירה</button>
              <button type="button" class="secondary" data-act="back">חזרה לרשימה</button>
            </div>
          </form>
        </div>`));
        const form = root.querySelector('#dir-form');
        const mode = form.querySelector('[name=location_mode]');
        const regionsWrap = form.querySelector('#d-regions-wrap');
        mode.addEventListener('change', () => {
          regionsWrap.hidden = mode.value !== 'regions';
        });
        form.querySelector('[data-act=back]').addEventListener('click', () => {
          state.directoryId = null;
          state.directoryCard = null;
          state.directoryMsg = '';
          location.hash = 'directory';
          render();
        });
        const sitesBox = form.querySelector('#d-sites');
        form.querySelector('#d-add-site').addEventListener('click', () => {
          sitesBox.insertAdjacentHTML('beforeend', siteRow({}));
        });
        sitesBox.addEventListener('click', (ev) => {
          const btn = ev.target.closest('[data-act=remove-site]');
          if (!btn) return;
          const row = btn.closest('.site-row');
          if (row) row.remove();
        });
        form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const btn = form.querySelector('[type=submit]');
          btn.disabled = true;
          const text = (name) => String(new FormData(form).get(name) || '').trim();
          const publicFields = {};
          DIR_TEXT.forEach(([name]) => { publicFields[name] = text(name); });
          DIR_PHONES.forEach((suffix) => {
            publicFields[`phone${suffix}`] = text(`phone${suffix}`);
            publicFields[`phoneLabel${suffix}`] = text(`phoneLabel${suffix}`);
            publicFields[`phoneShowNumber${suffix}`] = form.querySelector(`[name="phoneShowNumber${suffix}"]`).checked;
          });
          const age = (name) => {
            const v = text(name);
            return v === '' ? null : Number(v);
          };
          const body = {
            id: card.id,
            publicFields,
            eligibility: {
              age_min: age('age_min'),
              age_max: age('age_max'),
              sex: text('sex') || 'any',
              location_mode: text('location_mode') || 'any',
              regions: dirLines(text('regions')),
              diagnoses: dirLines(text('diagnoses')),
              presenting_problems: dirLines(text('presenting_problems')),
              recognition: {
                btl: text('rec_btl') || 'any',
                moh: text('rec_moh') || 'any',
                mod: text('rec_mod') || 'any',
                rehab_basket: text('rec_rehab') || 'any'
              },
              internal_notes: text('internal_notes')
            },
            sites: Array.from(form.querySelectorAll('.site-row')).map((row, index) => {
              const val = (name) => String((row.querySelector(`[name="${name}"]`) || {}).value || '').trim();
              return {
                label: val('site_label'),
                address: val('site_address'),
                phone: val('site_phone'),
                email: val('site_email'),
                lat: val('site_lat'),
                lng: val('site_lng'),
                sort_order: index
              };
            }).filter((site) => site.label || site.address)
          };
          try {
            const r = await fetch('/api/admin/directory', {
              method: 'PATCH',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.error || 'שמירת הכרטיס נכשלה');
            state.directoryCard = data.card;
            state.directoryMsg = 'נשמר.';
            if (state.directoryCards && data.card) {
              const idx = state.directoryCards.findIndex((c) => c.id === data.card.id);
              const summary = {
                id: data.card.id,
                rowId: data.card.rowId,
                org: (data.card.publicFields && data.card.publicFields.org) || '',
                svc: (data.card.publicFields && data.card.publicFields.svc) || '',
                hasEligibility: data.card.hasEligibility,
                publicEditedAt: data.card.publicEditedAt
              };
              if (idx >= 0) state.directoryCards[idx] = summary;
            }
            render();
          } catch (e) {
            state.directoryMsg = e.message || 'שמירת הכרטיס נכשלה';
            render();
          }
        });
        return;
      }

      const cards = state.directoryCards;
      if (!cards) {
        root.appendChild(el('<div class="card he-panel"><p>טוען…</p></div>'));

    function kzResultHtml(result) {

        body = `<p class="lede" dir="auto">${esc(result.category)}</p><div dir="rtl" lang="he">` +

              : `<button type="button" class="kz-hit" data-kz-title="${esc(member.title)}"><b dir="auto">${esc(member.title)}</b></button>`;
          }).join('') + `</div>`;
        if (result.continueToken) {
          body += `<p><button type="button" class="secondary" data-kz-more="continue" data-kz-value="${esc(result.continueToken)}">Next page</button></p>`;

        const cats = result.categories || [];

    function kzStrip(html) {
      return String(html || '')
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&amp;/gi, '&')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/&quot;/gi, '"')
        .replace(/&#0?39;/gi, "'")
        .replace(/\s+\n/g, '\n')
        .replace(/[ \t]{2,}/g, ' ')
        .trim();
    }
    function kzArticleUrl(title) {
      return 'https://www.kolzchut.org.il/he/' + encodeURIComponent(String(title || '').replace(/ /g, '_'));
    }
    function kzCap(text) {
      const value = String(text || '');
      if (value.length <= 20000) return { content: value, truncated: false };
      return { content: value.slice(0, 20000), truncated: true };
    }
    async function kzWiki(action, query) {
      const params = new URLSearchParams();
      params.set('format', 'json');
      params.set('origin', '*');
      const limit = String(Math.max(1, Math.min(20, Number(query.limit) || 10)));
      if (action === 'search') {
        params.set('action', 'query');
        params.set('list', 'search');
        params.set('srsearch', query.q);
        params.set('srlimit', limit);
        params.set('sroffset', String(Math.max(0, Number(query.offset) || 0)));
        params.set('srprop', 'snippet|size|wordcount|timestamp');
      } else if (action === 'suggest') {
        params.set('action', 'opensearch');
        params.set('search', query.q);
        params.set('limit', limit);
        params.set('namespace', '0');
      } else if (action === 'article' || action === 'section') {
        params.set('action', 'parse');
        params.set('page', query.title);
        params.set('prop', query.format === 'wikitext' ? 'wikitext' : 'text');
        params.set('disablelimitreport', 'true');
        params.set('disableeditsection', 'true');
        if (action === 'section') params.set('section', query.section);
      } else if (action === 'sections') {
        params.set('action', 'parse');
        params.set('page', query.title);
        params.set('prop', 'sections');
      } else if (action === 'categories') {
        params.set('action', 'query');
        params.set('list', 'allcategories');
        params.set('aclimit', limit);
        if (query.prefix) params.set('acprefix', query.prefix);
        if (query.continueToken) params.set('accontinue', query.continueToken);
      } else if (action === 'category') {
        let name = query.category || '';
        if (name.indexOf('Category:') === 0) name = 'קטגוריה:' + name.slice('Category:'.length);
        else if (name.indexOf('קטגוריה:') !== 0) name = 'קטגוריה:' + name;
        params.set('action', 'query');
        params.set('list', 'categorymembers');
        params.set('cmtitle', name);
        params.set('cmlimit', limit);
        params.set('cmtype', 'page|subcat');
        if (query.continueToken) params.set('cmcontinue', query.continueToken);
      } else if (action === 'info') {
        params.set('action', 'query');
        params.set('titles', query.title);
        params.set('prop', 'info|categories');
        params.set('inprop', 'url');
        params.set('cllimit', '50');
      } else {
        throw new Error('Unknown action');
      }
      const url = 'https://www.kolzchut.org.il/w/he/api.php?' + params.toString();
      const started = Date.now();
      const response = await fetch(url);
      const ms = Date.now() - started;
      if (!response.ok) throw new Error('Kol Zchut returned HTTP ' + response.status);
      const data = await response.json();
      if (data && data.error) throw new Error(data.error.info || data.error.code || 'Kol Zchut API error');
      if (action === 'search') {
        const hits = (data.query && data.query.search) || [];
        const total = (data.query && data.query.searchinfo && data.query.searchinfo.totalhits) || 0;
        const offset = Number(query.offset) || 0;
        return {
          action, requestUrl: url, ms, total, offset,
          hasMore: total > offset + hits.length,
          nextOffset: total > offset + hits.length ? offset + hits.length : null,
          results: hits.map((hit) => ({
            title: hit.title, pageid: hit.pageid, snippet: kzStrip(hit.snippet),
            wordcount: hit.wordcount, size: hit.size, timestamp: hit.timestamp, url: kzArticleUrl(hit.title)
          }))
        };
      }
      if (action === 'suggest') {
        const titles = data[1] || [];
        const descriptions = data[2] || [];
        const links = data[3] || [];
        return {
          action, requestUrl: url, ms,
          results: titles.map((title, i) => ({ title, description: kzStrip(descriptions[i] || ''), url: links[i] || kzArticleUrl(title) }))
        };
      }
      if (action === 'article' || action === 'section') {
        const raw = query.format === 'wikitext' ? (data.parse.wikitext && data.parse.wikitext['*']) : kzStrip(data.parse.text && data.parse.text['*']);
        const body = kzCap(raw);
        return {
          action, requestUrl: url, ms, title: data.parse.title, pageid: data.parse.pageid,
          url: kzArticleUrl(data.parse.title), format: query.format, section: action === 'section' ? query.section : null, ...body
        };
      }
      if (action === 'sections') {
        const rows = (data.parse && data.parse.sections) || [];
        return {
          action, requestUrl: url, ms, title: data.parse.title, pageid: data.parse.pageid, url: kzArticleUrl(data.parse.title),
          sections: rows.map((section) => ({ index: section.index, heading: kzStrip(section.line), number: section.number, level: section.level }))
        };
      }
      if (action === 'categories') {
        const rows = (data.query && data.query.allcategories) || [];
        return {
          action, requestUrl: url, ms,
          continueToken: (data.continue && data.continue.accontinue) || null,
          categories: rows.map((row) => ({ name: row['*'] || '' }))
        };
      }
      if (action === 'category') {
        const rows = (data.query && data.query.categorymembers) || [];
        return {
          action, requestUrl: url, ms, category: params.get('cmtitle'),
          continueToken: (data.continue && data.continue.cmcontinue) || null,
          members: rows.map((row) => ({ pageid: row.pageid, ns: row.ns, title: row.title, url: kzArticleUrl(row.title) }))
        };
      }
      const pages = (data.query && data.query.pages) || {};
      const page = Object.values(pages)[0];
      if (!page || page.missing != null) throw new Error('Page not found');
      return {
        action, requestUrl: url, ms, title: page.title, pageid: page.pageid, url: kzArticleUrl(page.title),
        touched: page.touched, lastrevid: page.lastrevid, length: page.length,
        categories: (page.categories || []).map((cat) => String(cat.title || '').replace(/^קטגוריה:/, ''))
      };
    }
    async function kzRun() {
      const kz = state.kz;
      kz.loading = true;
      kz.error = '';
      render();
      const query = {
        q: kz.q, title: kz.title, section: kz.section, format: kz.format,
        prefix: kz.prefix, category: kz.category, limit: kz.limit, offset: kz.offset,
        continueToken: kz.continueToken
      };
      if ((kz.action === 'search' || kz.action === 'suggest') && !String(kz.q || '').trim()) {
        kz.loading = false;
        kz.error = 'Type the words to search for.';
        render();
        return;
      }
      if ((kz.action === 'article' || kz.action === 'sections' || kz.action === 'section' || kz.action === 'info') && !String(kz.title || '').trim()) {
        kz.loading = false;
        kz.error = 'Type the exact article title.';
        render();
        return;
      }
      if (kz.action === 'category' && !String(kz.category || '').trim()) {
        kz.loading = false;
        kz.error = 'Type the category name.';
        render();
        return;
      }
      if (kz.action === 'section' && !/^\d+$/.test(String(kz.section || '').trim())) {
        kz.loading = false;
        kz.error = 'The section number must be a whole number, starting at 0.';
        render();
        return;
      }
      try {
        kz.result = await kzWiki(kz.action, query);
      } catch (error) {
        kz.result = null;
        kz.error = error && error.message ? error.message : 'Could not reach Kol Zchut.';
      }
      kz.loading = false;
      render();
    }

          </div>

          state.kz.section = btn.getAttribute('data-kz-section');
          state.kz.action = 'section';
          state.kz.format = 'text';
          kzRun();
        });
      });
      root.querySelectorAll('[data-kz-category]').forEach((btn) => {
        btn.addEventListener('click', () => {
          kzReadForm(root);
          state.kz.category = btn.getAttribute('data-kz-category');
          state.kz.action = 'category';
          state.kz.continueToken = '';
          kzRun();
        });
      });
      root.querySelectorAll('[data-kz-more]').forEach((btn) => {
        btn.addEventListener('click', () => {
          kzReadForm(root);
          const kind = btn.getAttribute('data-kz-more');
          const value = btn.getAttribute('data-kz-value') || '';
          if (kind === 'offset') state.kz.offset = value;
          else state.kz.continueToken = value;
          kzRun();
        });
      });
    }

    function render() {
      if (!state.user) {
        renderGate('Sign in on the directory first, then come back here. This page is for operators only.');
        return;
      }
      if (!state.user.isAdmin) {
        renderGate('You do not have access.');
        return;
      }
      if (state.user.passwordActionRequired || state.user.profileComplete === false) {
        renderGate('Finish signing in on the directory (complete your profile or change your password), then return here.');
        return;
      }
      if (state.error && !state.analytics && (state.tab === 'analytics' || state.tab === 'updates')) {
        renderGate(state.error);
        return;
      }
      if (state.error && !state.users && state.tab === 'users') {
        renderGate(state.error);
        return;
      }
      if (state.error && state.questions == null && state.tab === 'questions') {
        renderGate(state.error);
        return;
      }
      if (state.error && state.directoryCards == null && state.tab === 'directory') {
        renderGate(state.error);
        return;
      }

      app.innerHTML = '';
      const wrap = el(`<div>
        <div class="toolbar">
          <a class="back" href="/">Back to the directory</a>
          <span class="muted">${esc(state.user.email)}</span>
        </div>
        <h1>Admin</h1>
        <div class="tabs">
          <button type="button" data-tab="analytics" class="${state.tab === 'analytics' ? 'active' : ''}">Analytics</button>
          <button type="button" data-tab="users" class="${state.tab === 'users' ? 'active' : ''}">Registered users</button>
          <button type="button" data-tab="questions" class="${state.tab === 'questions' ? 'active' : ''}">שאלות נפוצות</button>
          <button type="button" data-tab="updates" class="${state.tab === 'updates' ? 'active' : ''}">פרסום עדכונים</button>
          <button type="button" data-tab="directory" class="${state.tab === 'directory' ? 'active' : ''}">כרטיסי מדריך</button>
          <button type="button" data-tab="kolzchut" class="${state.tab === 'kolzchut' ? 'active' : ''}">כל זכות</button>
        </div>
        <div id="tabbody"></div>
      </div>`);
      app.appendChild(wrap);
      wrap.querySelectorAll('.tabs button').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const tab = btn.getAttribute('data-tab');
          if (tab === 'directory') {
            state.directoryId = null;
            state.directoryCard = null;
            state.directoryMsg = '';
          }
          setTab(tab);
          if (tab === 'users' && !state.users) await loadUsers();
          if ((tab === 'analytics' || tab === 'updates') && !state.analytics) await loadAnalytics();
          if (tab === 'questions') {
            if (!state.questions) await loadQuestions();
            if (!state.faq) await loadFaqAdmin();
          }
          if (tab === 'directory' && !state.directoryCards) await loadDirectoryList();
          render();
        });
      });
      const body = wrap.querySelector('#tabbody');
      if (state.tab === 'users') renderUsers(body);
      else if (state.tab === 'questions') renderQuestions(body);
      else if (state.tab === 'updates') renderUpdates(body);
      else if (state.tab === 'directory') renderDirectory(body);
      else if (state.tab === 'kolzchut') renderKolzchut(body);
      else renderAnalytics(body);
    }

    window.addEventListener('hashchange', async () => {
      const next = hashToTab();
      const nextId = next === 'directory' ? directoryIdFromHash() : null;
      if (next === state.tab && nextId === state.directoryId) return;
      state.tab = next;
      state.directoryId = nextId;
      if (next === 'users' && !state.users) await loadUsers();
      if ((next === 'analytics' || next === 'updates') && !state.analytics) await loadAnalytics();
      if (next === 'questions') {
        if (!state.questions) await loadQuestions();
        if (!state.faq) await loadFaqAdmin();
      }
      if (next === 'directory') {
        if (!state.directoryCards) await loadDirectoryList();
        if (nextId) await loadDirectoryCard(nextId);
        else state.directoryCard = null;
      }
      render();
    });

    (async () => {
      try {
        await loadSession();
        if (state.user && state.user.isAdmin) {
          if (state.tab === 'users') await loadUsers();
          else if (state.tab === 'questions') {
            await loadQuestions();
            await loadFaqAdmin();
          } else if (state.tab === 'directory') await loadDirectory();
          else await loadAnalytics();
        }
        render();
      } catch (e) {
        renderGate('Could not reach the server.');
      }
    })();
  </script>
</body>
</html>
