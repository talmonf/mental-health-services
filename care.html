                <Field label="טלפון חירום"><input value={form.emergencyPhone} onChange={set('emergencyPhone')} /></Field>
              </div>
              <Field label="קרבה לאיש הקשר"><input value={form.emergencyRelation} onChange={set('emergencyRelation')} /></Field>
              <button className="btn" disabled={busy} type="submit">שמירת פרטים</button>
            </form>
          </div>
          <div className="card">
            <h2>מעברים בין קופות</h2>
            {!openH ? <button className="btn" type="button" onClick={() => setOpenH(true)}>הוסיפו מעבר</button> : (
              <form onSubmit={async (e) => { e.preventDefault(); if (await onSaveHmo(hform)) { setHform({ hmo: 'clalit', startedOn: '', endedOn: '', notes: '' }); setOpenH(false); } }}>
                <Field label="קופה"><Sel value={hform.hmo} onChange={(v) => setHform({ ...hform, hmo: v })} options={optPairs(HMO_HE)} /></Field>
                <div className="form-grid two">
                  <Field label="מתאריך"><input type="date" value={hform.startedOn} onChange={(e) => setHform({ ...hform, startedOn: e.target.value })} /></Field>
                  <Field label="עד תאריך"><input type="date" value={hform.endedOn} onChange={(e) => setHform({ ...hform, endedOn: e.target.value })} /></Field>
                </div>
                <Field label="הערות"><textarea value={hform.notes} onChange={(e) => setHform({ ...hform, notes: e.target.value })} /></Field>
                <div className="row"><button className="btn" disabled={busy} type="submit">שמירה</button><button className="btn secondary" type="button" onClick={() => setOpenH(false)}>ביטול</button></div>
              </form>
            )}
            {(history || []).length === 0 && <p className="muted">אין היסטוריית מעברים.</p>}
            {(history || []).map((it) => (
              <div className="item" key={it.id}>
                <h3>{HMO_HE[it.hmo] || it.hmo}{it.startedOn ? ` · מאז ${fmtDate(it.startedOn)}` : ''}{it.endedOn ? ` עד ${fmtDate(it.endedOn)}` : ' (נוכחית)'}</h3>
                {it.notes && <p className="muted">{it.notes}</p>}
                {it.mine && <button className="btn danger" type="button" onClick={() => onDeleteHmo(it.id)}>מחיקה</button>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Family({ items, busy, onSave, onDelete }) {
      const empty = { name: '', relation: '', phone: '', email: '', livesWith: false, involved: false, notes: '' };
      const [form, setForm] = useState(empty);
      const [open, setOpen] = useState(false);
      return (
        <div className="card">
          <h2>משפחה</h2>
          {!open ? <button className="btn" type="button" onClick={() => setOpen(true)}>הוסיפו בן משפחה</button> : (
            <form onSubmit={async (e) => { e.preventDefault(); if (await onSave(form)) { setForm(empty); setOpen(false); } }}>
              <div className="form-grid two">
                <Field label="שם"><input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></Field>
                <Field label="קרבה"><input value={form.relation} onChange={(e) => setForm({ ...form, relation: e.target.value })} placeholder="אם, אח, בן/בת זוג…" /></Field>
                <Field label="טלפון"><input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} /></Field>
                <Field label="אימייל"><input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></Field>
              </div>
              <div className="checks" style={{ marginBottom: 12 }}>
                <label><input type="checkbox" checked={form.livesWith} onChange={(e) => setForm({ ...form, livesWith: e.target.checked })} /> גרים יחד</label>
                <label><input type="checkbox" checked={form.involved} onChange={(e) => setForm({ ...form, involved: e.target.checked })} /> מעורב בטיפול</label>
              </div>
              <Field label="הערות"><textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
              <div className="row"><button className="btn" disabled={busy} type="submit">שמירה</button><button className="btn secondary" type="button" onClick={() => setOpen(false)}>ביטול</button></div>
            </form>
          )}
          {items.length === 0 && <p className="muted">אין בני משפחה ברשימה.</p>}
          {items.map((it) => (
            <div className="item" key={it.id}>
              <h3>{it.name}{it.relation ? ` · ${it.relation}` : ''}</h3>
              <div className="muted">{[it.phone, it.email].filter(Boolean).join(' · ')}</div>
              <div className="tiny">{it.livesWith ? 'גרים יחד' : ''}{it.involved ? (it.livesWith ? ' · מעורב בטיפול' : 'מעורב בטיפול') : ''}</div>
              {it.notes && <p className="muted">{it.notes}</p>}
              {it.mine && <button className="btn danger" type="button" onClick={() => onDelete(it.id)}>מחיקה</button>}
            </div>
          ))}
        </div>
      );
    }

    function Diagnoses({ items, busy, onSave, onDelete }) {
      const empty = { name: '', code: '', diagnosedOn: '', diagnosedBy: '', status: 'active', notes: '' };
      const [form, setForm] = useState(empty);
      const [open, setOpen] = useState(false);
      return (
        <div className="card">
          <h2>אבחנות</h2>
          {!open ? <button className="btn" type="button" onClick={() => setOpen(true)}>הוסיפו אבחנה</button> : (
            <form onSubmit={async (e) => { e.preventDefault(); if (await onSave(form)) { setForm(empty); setOpen(false); } }}>
              <Field label="אבחנה"><input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></Field>
              <div className="form-grid two">
                <Field label="קוד (ICD, אופציונלי)"><input value={form.code} onChange={(e) => setForm({ ...form, code: e.target.value })} /></Field>
                <Field label="סטטוס"><Sel value={form.status} onChange={(v) => setForm({ ...form, status: v })} options={optPairs(DX_STATUS_HE)} /></Field>
                <Field label="תאריך אבחון"><input type="date" value={form.diagnosedOn} onChange={(e) => setForm({ ...form, diagnosedOn: e.target.value })} /></Field>
                <Field label="אבחן ע״י"><input value={form.diagnosedBy} onChange={(e) => setForm({ ...form, diagnosedBy: e.target.value })} /></Field>
              </div>
              <Field label="הערות"><textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
              <div className="row"><button className="btn" disabled={busy} type="submit">שמירה</button><button className="btn secondary" type="button" onClick={() => setOpen(false)}>ביטול</button></div>
            </form>
          )}
          {items.length === 0 && <p className="muted">אין אבחנות.</p>}
          {items.map((it) => (
            <div className="item" key={it.id}>
              <h3>{it.name}{it.code ? ` (${it.code})` : ''}</h3>
              <div className="muted">{DX_STATUS_HE[it.status] || it.status}{it.diagnosedOn ? ` · ${fmtDate(it.diagnosedOn)}` : ''}{it.diagnosedBy ? ` · ${it.diagnosedBy}` : ''}</div>
              {it.notes && <p className="muted">{it.notes}</p>}
              {it.mine && <button className="btn danger" type="button" onClick={() => onDelete(it.id)}>מחיקה</button>}
            </div>
          ))}
        </div>
      );
    }

    function Therapy({ items, busy, onSave, onDelete }) {
      const empty = { therapistName: '', modality: '', startedOn: '', endedOn: '', frequency: '', notes: '' };
      const [form, setForm] = useState(empty);
      const [open, setOpen] = useState(false);
      return (
        <div className="card">
          <h2>טיפול</h2>
          {!open ? <button className="btn" type="button" onClick={() => setOpen(true)}>הוסיפו טיפול</button> : (
            <form onSubmit={async (e) => { e.preventDefault(); if (await onSave(form)) { setForm(empty); setOpen(false); } }}>
              <div className="form-grid two">
                <Field label="מטפל/ת"><input required value={form.therapistName} onChange={(e) => setForm({ ...form, therapistName: e.target.value })} /></Field>
                <Field label="גישה / סוג"><input value={form.modality} onChange={(e) => setForm({ ...form, modality: e.target.value })} placeholder="CBT, דינמי, קבוצתי…" /></Field>
                <Field label="התחלה"><input type="date" value={form.startedOn} onChange={(e) => setForm({ ...form, startedOn: e.target.value })} /></Field>
                <Field label="סיום"><input type="date" value={form.endedOn} onChange={(e) => setForm({ ...form, endedOn: e.target.value })} /></Field>
              </div>
              <Field label="תדירות"><input value={form.frequency} onChange={(e) => setForm({ ...form, frequency: e.target.value })} placeholder="שבועי, פעם בשבועיים…" /></Field>
              <Field label="הערות"><textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
              <div className="row"><button className="btn" disabled={busy} type="submit">שמירה</button><button className="btn secondary" type="button" onClick={() => setOpen(false)}>ביטול</button></div>
            </form>
          )}
          {items.length === 0 && <p className="muted">אין רשומות טיפול.</p>}
          {items.map((it) => (
            <div className="item" key={it.id}>
              <h3>{it.therapistName}{it.modality ? ` · ${it.modality}` : ''}</h3>
              <div className="muted">{it.startedOn ? `מאז ${fmtDate(it.startedOn)}` : ''}{it.endedOn ? ` עד ${fmtDate(it.endedOn)}` : (it.startedOn ? ' (נוכחי)' : '')}{it.frequency ? ` · ${it.frequency}` : ''}</div>
              {it.notes && <p className="muted">{it.notes}</p>}
              {it.mine && <button className="btn danger" type="button" onClick={() => onDelete(it.id)}>מחיקה</button>}
            </div>
          ))}
        </div>
      );
    }

    function Activities({ items, busy, onSave, onDelete }) {
      const empty = { kind: 'sport', name: '', frequency: '', startedOn: '', notes: '' };
      const [form, setForm] = useState(empty);
      const [open, setOpen] = useState(false);
      return (
        <div className="card">
          <h2>פעילות גופנית</h2>
          {!open ? <button className="btn" type="button" onClick={() => setOpen(true)}>הוסיפו פעילות</button> : (
            <form onSubmit={async (e) => { e.preventDefault(); if (await onSave(form)) { setForm(empty); setOpen(false); } }}>
              <div className="form-grid two">
                <Field label="סוג"><Sel value={form.kind} onChange={(v) => setForm({ ...form, kind: v })} options={optPairs(ACTIVITY_KIND_HE)} /></Field>
                <Field label="שם"><input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="שחייה, הליכה בפארק…" /></Field>
                <Field label="תדירות"><input value={form.frequency} onChange={(e) => setForm({ ...form, frequency: e.target.value })} /></Field>
                <Field label="מאז"><input type="date" value={form.startedOn} onChange={(e) => setForm({ ...form, startedOn: e.target.value })} /></Field>
              </div>
              <Field label="הערות"><textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
              <div className="row"><button className="btn" disabled={busy} type="submit">שמירה</button><button className="btn secondary" type="button" onClick={() => setOpen(false)}>ביטול</button></div>
            </form>
          )}
          {items.length === 0 && <p className="muted">אין פעילויות.</p>}
          {items.map((it) => (
            <div className="item" key={it.id}>
              <h3>{it.name} · {ACTIVITY_KIND_HE[it.kind] || it.kind}</h3>
              <div className="muted">{it.startedOn ? `מאז ${fmtDate(it.startedOn)}` : ''}{it.frequency ? ` · ${it.frequency}` : ''}</div>
              {it.notes && <p className="muted">{it.notes}</p>}
              {it.mine && <button className="btn danger" type="button" onClick={() => onDelete(it.id)}>מחיקה</button>}
            </div>
          ))}
        </div>
      );
    }

    function Intake({ sheet, busy, onSave }) {
      const empty = {
        presentingProblem: '', psychiatricHistory: '', medicalHistory: '', substanceUse: '',
        selfHarmHistory: '', legalIssues: '', supports: '', sleepAppetite: '', other: ''
      };
      const [form, setForm] = useState(empty);
      useEffect(() => { setForm({ ...empty, ...(sheet || {}) }); }, [sheet]);
      const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
      const fields = [
        ['presentingProblem', 'סיבת הפנייה / מצב נוכחי'],
        ['psychiatricHistory', 'היסטוריה פסיכיאטרית (אשפוזים, טיפולים)'],
        ['medicalHistory', 'היסטוריה רפואית'],
        ['substanceUse', 'שימוש בחומרים'],
        ['selfHarmHistory', 'פגיעה עצמית / מחשבות אובדניות (תיעוד אישי)'],
        ['legalIssues', 'היבטים משפטיים'],
        ['supports', 'מקורות תמיכה'],
        ['sleepAppetite', 'שינה ותיאבון'],
        ['other', 'אחר']
      ];
      return (
        <div className="card">
          <h2>גיליון קבלה</h2>
          <p className="muted">שדות מקובלים בקבלה בבריאות הנפש. זה תיעוד שלכם, לא טופס רשמי.</p>
          <form onSubmit={async (e) => { e.preventDefault(); await onSave(form); }}>
            {fields.map(([k, label]) => (
              <Field key={k} label={label}><textarea value={form[k] || ''} onChange={set(k)} /></Field>
            ))}
            <button className="btn" disabled={busy} type="submit">שמירת גיליון</button>
          </form>
        </div>
      );
    }

    function Audit({ items }) {
      return (
        <div className="card">
          <h2>יומן גישה</h2>
          <p className="muted">מי ראה או שינה משהו. אין כאן תוכן של מסמכים.</p>
          {items.map((it) => (
            <div className="item" key={it.id}>
              <div>{ACTION_HE[it.action] || it.action} {it.section ? `· ${SECTION_HE[it.section] || it.section}` : ''}</div>
              <div className="tiny">{it.actorEmail || it.actorKind} · {fmtDate(it.createdAt)}</div>
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
